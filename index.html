Game.level({
  id: 'lcs', unit: 5, order: 30, icon: '🧬', title: 'LCS Table', tag: 'DP · match → diagonal + 1, else max(up, left)', scene: 'Lay two letter strands along a board and roll back over the matches',
  intro: `<p>LCS = longest string of letters found in both \\(X\\) and \\(Y\\) in the same order (gaps allowed). Rows = \\(X\\), columns = \\(Y\\), row 0 and column 0 are 0.</p>
<ul><li>Match \\(X_i = Y_j\\): diagonal + 1, arrow ↖.</li>
<li>No match: bigger of up (↑) and left (←); on a tie the course goes ↑.</li>
<li>\\(c[m][n]\\) is the length. Trace back from it along the arrows; every ↖ gives a letter, read backwards.</li></ul>`,
  formula: `\\[c[i,j]=\\begin{cases}c[i-1,j-1]+1\\\\ \\max(c[i-1,j],\\ c[i,j-1])\\end{cases}\\]<p>Top line on a match \\(X_i = Y_j\\) (↖), bottom line otherwise (↑ or ←). Row 0 and column 0 are 0. Time and space \\(O(mn)\\); trace-back \\(O(m+n)\\). Brute force over all \\(2^m\\) subsequences is exponential.</p>`,
  exam: { X: 'intmain()', Y: 'intaain()' },
  examSrc: '2024 Final Q2b · X = intmain(), Y = intaain()',
  make(r, d) {
    const [lo, hi, al] = [[4, 5, 'ABC'], [6, 7, 'ABCD'], [8, 9, 'ABCDE']][d - 1];
    const word = () => Array.from({ length: r.int(lo, hi) }, () => r.pick(al)).join('');
    for (;;) {
      const X = word(), Y = word(), c = this.table(X, Y), L = c[X.length][Y.length];
      if (L >= 2 && L < Math.min(X.length, Y.length)) return { X, Y };
    }
  },
  table(X, Y) {
    const m = X.length, n = Y.length, c = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      c[i][j] = X[i - 1] === Y[j - 1] ? c[i - 1][j - 1] + 1 : Math.max(c[i - 1][j], c[i][j - 1]);
    return c;
  },
  /* 3D board: X tiles down the left edge, Y tiles along the back edge, every filled cell a tile whose height is its value,
     matches joined by a golden diagonal bridge, a tray for the collected LCS. Pure view (nothing is read back). */
  board(W, { X, Y, L, onCell, zeros = true }) {
    const m = X.length, n = Y.length, C = World.C, S = 1.05, B = .05, SRC = '#7a5cf0', IDLE = '#efe3d0';
    const PX = j => (j - n / 2) * S, PZ = i => (i - m / 2) * S, step = Math.min(.3, 1.7 / Math.max(1, L)), hgt = v => .12 + v * step, key = (i, j) => i * (n + 1) + j;
    const tx = PX(n) + 2.2, slotX = k => tx + k * S;
    W.slab({ w: (n + 2) * S + .5, d: (m + 2) * S + .5, x: -S / 2, z: -S / 2, y: B, h: .25, color: C.wood });
    W.slab({ w: L * S + .6, d: S + .6, x: tx + (L - 1) * S / 2, z: 0, y: B, h: .25, color: C.woodDark });
    W.text('LCS', { x: tx + (L - 1) * S / 2, y: .3, z: -S * 1.7, size: .6, bg: '#12283a', color: '#ffffff' });
    for (let k = 0; k < L; k++) W.box({ w: .88, h: .06, d: .88, x: slotX(k), z: 0, y: B + .03, color: IDLE, r: .02, shadow: false });
    const letter = (ch, x, y, z, color) => { const t = W.box({ w: .88, h: .34, d: .88, x, z, y: y + .17, color, r: .08 }); W.text(ch, { parent: t, x: 0, y: .45, z: 0, size: .62 }); return t; };
    const xt = [null], yt = [null];
    for (let i = 1; i <= m; i++) xt.push(letter(X[i - 1], PX(0) - S * 1.08, B, PZ(i), '#8fa0f0'));
    for (let j = 1; j <= n; j++) yt.push(letter(Y[j - 1], PX(j), B, PZ(0) - S * 1.08, '#6fcfc6'));
    W.text('X ↓', { x: PX(0) - S * 1.08, y: .2, z: PZ(0) - .3, size: .5 }); W.text('Y →', { x: PX(0) - .2, y: .2, z: PZ(0) - S * 1.08, size: .5 });
    const tile = [], ph = [], top = [], click = (i, j) => onCell && (() => onCell(i, j));
    const put = (i, j, v, match, ms) => {
      const k = key(i, j), h = hgt(v);
      if (ph[k]) { W.remove(ph[k]); ph[k] = null; }
      const b = tile[k] = W.box({ w: .9, d: .9, h, x: PX(j), z: PZ(i), y: B + h / 2, color: i === 0 || j === 0 ? C.dim : match ? C.ok : '#9cc3dc', r: .05, onClick: click(i, j) });
      top[k] = B + h;
      const ly = B + h + (v ? .3 : .2), t = W.text(String(v), { x: PX(j), y: ly, z: PZ(i), size: .5, depthTest: true });
      if (ms) { b.scale.y = .05; b.position.y = B + h * .025; W.to(b.scale, { y: 1 }, ms); W.move(b, { y: B + h / 2 }, ms); t.position.y = B + .4; W.to(t.position, { y: ly }, ms); }
      if (match) W.link({ x: PX(j - 1), y: top[key(i - 1, j - 1)] + .04, z: PZ(i - 1) }, { x: PX(j), y: B + h + .04, z: PZ(i) }, { color: C.hi, r: .09 });
    };
    for (let i = 0; i <= m; i++) for (let j = 0; j <= n; j++) {
      if (i === 0 || j === 0) { if (zeros) put(i, j, 0); }
      else ph[key(i, j)] = W.box({ w: .9, d: .9, h: .06, x: PX(j), z: PZ(i), y: B + .03, color: IDLE, r: .02, shadow: false, onClick: click(i, j) });
    }
    let glows = [], curK = null, hx = 0, hy = 0;
    const ball = W.ball({ r: .26, color: C.bad, y: 1 }); ball.visible = false;
    const q = W.text('?', { x: 0, y: 1, z: 0, size: .6, bg: C.hi, color: '#12283a' }); q.visible = false;
    W.fit({ dir: [.1, .95, 1], pad: m + n > 12 ? .86 : .78 });
    return {
      xt, yt, put,
      /* light the cell being filled, its two letters and the cells the recurrence reads */
      mark(cur, srcs = []) {
        glows.forEach(k => tile[k] && W.glow(tile[k], null)); glows = [];
        if (curK != null && ph[curK]) { W.paint(ph[curK], IDLE, 0); W.glow(ph[curK], null); }
        if (xt[hx]) W.glow(xt[hx], null); if (yt[hy]) W.glow(yt[hy], null);
        curK = cur ? key(cur[0], cur[1]) : null; hx = cur ? cur[0] : 0; hy = cur ? cur[1] : 0;
        q.visible = !!cur;
        if (!cur) return;
        q.position.set(PX(cur[1]), B + .55, PZ(cur[0]));
        if (ph[curK]) { W.paint(ph[curK], C.hi, 0); W.glow(ph[curK], C.hi); }
        W.glow(xt[hx], C.hi); W.glow(yt[hy], C.hi);
        srcs.forEach(([a, b]) => { const k = key(a, b); if (tile[k]) { W.glow(tile[k], SRC); glows.push(k); } });
      },
      roll(i, j, first) {
        const k = key(i, j), pos = { x: PX(j), y: (top[k] || B) + .95, z: PZ(i) };
        if (tile[k]) W.glow(tile[k], C.hi);
        if (first) { ball.visible = true; ball.position.set(pos.x, pos.y, pos.z); } else W.move(ball, pos, 450);
      },
      /* the matched letter at cell (i, j) flies to slot k of the tray */
      collect(i, j, k) { const t = letter(X[i - 1], PX(j), top[key(i, j)] || B, PZ(i), C.ok); W.hop(t, { x: slotX(k), y: B + .17 + .06, z: 0 }, 800, 2.6); return t; },
      shake(i, j) { const k = key(i, j); W.shake(tile[k] || ph[k]); },
    };
  },
  /* the story: two tiny DNA strands */
  story(W) {
    const X = 'TAC', Y = 'ATC', c = this.table(X, Y);
    const B = this.board(W, { X, Y, L: 2, zeros: false });
    for (const t of [...B.xt, ...B.yt]) if (t) t.visible = false;
    const fill = async (i, j, slow) => {
      const mt = X[i - 1] === Y[j - 1];
      B.mark([i, j], mt ? [[i - 1, j - 1]] : [[i - 1, j], [i, j - 1]]); await Game.wait(slow ? 1200 : 520);
      B.put(i, j, c[i][j], mt, 400); await Game.wait(slow ? 800 : 380);
    };
    const got = [];
    return [
      { text: 'Dr. Meera has two DNA snippets, <b>TAC</b> and <b>ATC</b>. She wants the longest string of letters that appears in <b>both, in the same order</b> (gaps allowed): the longest common subsequence.',
        run: async () => { for (let i = 1; i <= 3; i++) { B.xt[i].visible = true; W.drop(B.xt[i], 4, 400); await Game.wait(160); } for (let j = 1; j <= 3; j++) { B.yt[j].visible = true; W.drop(B.yt[j], 4, 400); await Game.wait(160); } await Game.wait(300); } },
      { text: 'One strand runs down the side, the other along the top. Tile \\(c[i][j]\\) will hold the LCS length of the first \\(i\\) letters of X and the first \\(j\\) of Y. Against an empty strand that is 0.',
        run: async () => { for (let j = 0; j <= 3; j++) { B.put(0, j, 0, false, 200); await Game.wait(110); } for (let i = 1; i <= 3; i++) { B.put(i, 0, 0, false, 200); await Game.wait(110); } } },
      { text: 'Row T. T ≠ A, so copy the bigger of <b>up</b> and <b>left</b>: 0. Then T = T is a <b>match</b>: diagonal + 1, so \\(c[1][2] = c[0][1] + 1 = 1\\) and a bridge lights up.',
        run: async () => { await fill(1, 1, true); await fill(1, 2, true); await fill(1, 3); B.mark(null); } },
      { text: 'The whole rule: match → \\(c[i][j] = c[i-1][j-1] + 1\\); no match → \\(c[i][j] = \\max(c[i-1][j],\\ c[i][j-1])\\). Rows A and C fill the same way, and C = C gives \\(1 + 1 = 2\\).',
        run: async () => { for (let i = 2; i <= 3; i++) for (let j = 1; j <= 3; j++) await fill(i, j, i === 3 && j === 3); B.mark(null); } },
      { text: 'The last tile says the LCS has length <b>2</b>. To read it, a ball starts there and rolls back. C = C is a match: <b>collect C</b> and roll down the bridge.',
        run: async () => { B.roll(3, 3, true); await Game.wait(900); got.push(B.collect(3, 3, 1)); await Game.wait(700); B.roll(2, 2); await Game.wait(600); } },
      { text: 'A ≠ T: roll to the neighbour holding the same value (on a tie go <b>up</b>). There T = T is a match: <b>collect T</b>. Read in order, the LCS is <b>TC</b>.',
        run: async () => { B.roll(1, 2); await Game.wait(1000); got.push(B.collect(1, 2, 0)); await Game.wait(700); B.roll(0, 1); await Game.wait(600); } },
      { text: 'One comparison per tile: \\(O(mn)\\) time and space for strands of length \\(m\\) and \\(n\\). The roll back takes only \\(O(m+n)\\) steps.',
        run: async () => { for (const t of got) await W.pop(t); } },
    ];
  },
  mount(ctx) {
    const task = html => ctx.task(`<span>${html}</span>`);   // one flex child, so inline math does not split the line
    const { X, Y } = ctx.inst, m = X.length, n = Y.length, H = UI.h, d = ctx.diff, c = this.table(X, Y), L = c[m][n];
    const esc = ch => ch.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const g = UI.grid(m + 1, n + 1, {
      corner: 'i \\ j',
      cols: [...Array(n + 1).keys()].map(j => `${j}<b>${j ? esc(Y[j - 1]) : '&nbsp;'}</b>`),
      rows: [...Array(m + 1).keys()].map(i => `${i}<b>${i ? esc(X[i - 1]) : '&nbsp;'}</b>`),
      onClick: (r, cc) => cellClick(r, cc),
    });
    g.el.classList.add('lcs-g');
    for (let i = 0; i <= m; i++) g.set(i, 0, 0);
    for (let j = 1; j <= n; j++) g.set(0, j, 0);
    const AR = { d: '↖', u: '↑', l: '←' };
    const arrow = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(null));
    const f = H('div', { class: 'lcs-f' }), extra = H('div');
    const lcs = new Array(L).fill('?');   // fills right to left during the trace
    ctx.el.append(H('div', { class: 'note', style: 'margin-bottom:8px' }, `X = ${X} (m = ${m}, rows) · Y = ${Y} (n = ${n}, columns)`), g.el, f, extra);
    /* 3D: the same table as a board of tiles */
    const B = this.board(ctx.world, { X, Y, L, onCell: (r, cc) => cell3d(r, cc) });

    let phase = 'fill', ci = 1, cj = 1, choiceEl = null, askEl = null, ti = m, tj = n, pos = L - 1;
    const match = (i, j) => X[i - 1] === Y[j - 1];
    const okArrows = (i, j) => match(i, j) ? ['d'] : ['u', 'l'].filter(a => a === 'u' ? c[i - 1][j] >= c[i][j - 1] : c[i][j - 1] >= c[i - 1][j]);
    const courseArrow = (i, j) => match(i, j) ? 'd' : c[i - 1][j] >= c[i][j - 1] ? 'u' : 'l';
    const head = (i, j, on) => { g.el.rows[0].cells[j + 1].classList.toggle('lcs-h', on); g.el.rows[i + 1].cells[0].classList.toggle('lcs-h', on); };
    const why = (i, j) => match(i, j)
      ? `\\(X_{${i}} = Y_{${j}} = \\)'${esc(X[i - 1])}' match: \\(c[${i}][${j}] = c[${i - 1}][${j - 1}] + 1 = ${c[i - 1][j - 1]} + 1 = ${c[i][j]}\\), arrow ↖.`
      : `'${esc(X[i - 1])}' ≠ '${esc(Y[j - 1])}': \\(c[${i}][${j}] = \\max(c[${i - 1}][${j}],\\ c[${i}][${j - 1}]) = \\max(${c[i - 1][j]},\\ ${c[i][j - 1]}) = ${c[i][j]}\\), arrow ${c[i - 1][j] === c[i][j - 1] ? '↑ (tie: ↑ or ←)' : c[i - 1][j] > c[i][j - 1] ? '↑' : '←'}.`;

    const activate = () => {
      phase = 'fill'; g.clear('hi src'); head(ci, cj, true);
      const i = ci, j = cj;
      g.cls(i, j, 'hi');
      B.mark([i, j], d === 1 ? [[i - 1, j - 1], [i - 1, j], [i, j - 1]] : d === 3 ? [] : match(i, j) ? [[i - 1, j - 1]] : [[i - 1, j], [i, j - 1]]);
      // Easy: all three candidates; Normal/Exam: the cells the recurrence actually reads; Hard: none
      if (d === 1) { g.cls(i - 1, j - 1, 'src'); g.cls(i - 1, j, 'src'); g.cls(i, j - 1, 'src'); }
      else if (d !== 3) { if (match(i, j)) g.cls(i - 1, j - 1, 'src'); else { g.cls(i - 1, j, 'src'); g.cls(i, j - 1, 'src'); } }
      const cmp = `X<sub>${i}</sub> = '${esc(X[i - 1])}' vs Y<sub>${j}</sub> = '${esc(Y[j - 1])}'`;
      extra.innerHTML = ''; choiceEl = askEl = null;
      if (d === 1) {
        f.innerHTML = `${cmp} · ↖ c[${i - 1}][${j - 1}]+1 = ${c[i - 1][j - 1] + 1} (only on a match) · ↑ c[${i - 1}][${j}] = ${c[i - 1][j]} · ← c[${i}][${j - 1}] = ${c[i][j - 1]}`;
        task(`Cell \\(c[${i}][${j}]\\): do the letters match? Pick the arrow (or click that glowing tile): ↖ on a match, otherwise the bigger of ↑ and ←.`);
        choiceEl = UI.choices([{ label: '↖ diagonal + 1', value: 'd' }, { label: '↑ up', value: 'u' }, { label: '← left', value: 'l' }], v => pickArrow(v));
        extra.append(choiceEl);
      } else {
        f.innerHTML = `${cmp} → c[${i}][${j}] = <b>?</b>`;
        task(`Fill \\(c[${i}][${j}]\\). Match → diagonal + 1; no match → \\(\\max\\)(up, left).`);
        askEl = UI.ask(`\\(c[${i}][${j}] = \\)`, v => answer(v));
        extra.append(askEl);
      }
    };
    const commit = a => {
      const i = ci, j = cj; arrow[i][j] = a;
      g.set(i, j, `<span class="lcs-a">${AR[a]}</span>${c[i][j]}`, match(i, j) ? 'lcs-m' : null);
      head(i, j, false); B.put(i, j, c[i][j], match(i, j), 420);
      ctx.good(why(i, j), 5);
      if (++cj > n) { cj = 1; ci++; }
      if (ci > m) return startTrace();
      activate();
    };
    const pickArrow = a => {
      if (phase !== 'fill') return;
      const i = ci, j = cj;
      if (!okArrows(i, j).includes(a)) {
        if (a === 'd') return ctx.bad(`↖ is only for a <b>match</b>, and '${esc(X[i - 1])}' ≠ '${esc(Y[j - 1])}'. Take the bigger of ↑ \\(c[${i - 1}][${j}] = ${c[i - 1][j]}\\) and ← \\(c[${i}][${j - 1}] = ${c[i][j - 1]}\\).`);
        if (match(i, j)) return ctx.bad(`The letters match ('${esc(X[i - 1])}' = '${esc(Y[j - 1])}'), so extend the diagonal: ↖ \\(c[${i - 1}][${j - 1}] + 1 = ${c[i][j]}\\).`);
        return ctx.bad(`No match, so take the <b>bigger</b> neighbour: ↑ is ${c[i - 1][j]}, ← is ${c[i][j - 1]}. Pick ${c[i - 1][j] > c[i][j - 1] ? '↑' : '←'}.`);
      }
      commit(a);
    };
    const answer = v => {
      if (phase !== 'fill') return;
      if (!UI.same(v, c[ci][cj])) return ctx.bad(why(ci, cj));
      commit(courseArrow(ci, cj));
    };

    /* ---- trace back ---- */
    const startTrace = () => {
      phase = 'trace'; g.clear('hi src'); extra.innerHTML = ''; ti = m; tj = n;
      g.cls(ti, tj, 'sel'); B.mark(null); B.roll(ti, tj, true);
      ctx.say(`Table done: LCS length \\(c[${m}][${n}] = ${L}\\). Now rebuild the string.`);
      traceTask();
    };
    const traceTask = () => {
      if (ti === 0 || tj === 0) return finish();
      f.innerHTML = `At c[${ti}][${tj}] = ${c[ti][tj]}, arrow ${AR[arrow[ti][tj]]} · X<sub>${ti}</sub> = '${esc(X[ti - 1])}', Y<sub>${tj}</sub> = '${esc(Y[tj - 1])}' · LCS so far: <b>${esc(lcs.join(' '))}</b>`;
      task(`Trace back: click the tile (or table cell) the arrow at \\(c[${ti}][${tj}]\\) points to. ↖ on a match gives a letter. (When ↑ and ← are equal, either way works.)`);
    };
    const cellClick = (r, cc) => {
      if (phase !== 'trace') return;
      const i = ti, j = tj, v = c[i][j];
      const ok = match(i, j) ? r === i - 1 && cc === j - 1
        : (r === i - 1 && cc === j && c[i - 1][j] === v) || (r === i && cc === j - 1 && c[i][j - 1] === v);
      if (!ok) {
        if (match(i, j)) return ctx.bad(`\\(X_{${i}} = Y_{${j}} = \\)'${esc(X[i - 1])}' is a match (↖), so this letter is in the LCS and you go diagonally to \\(c[${i - 1}][${j - 1}]\\).`);
        return ctx.bad(`No match here. Move to a neighbour with the <b>same value</b> ${v}: ↑ \\(c[${i - 1}][${j}] = ${c[i - 1][j]}\\), ← \\(c[${i}][${j - 1}] = ${c[i][j - 1]}\\). ${c[i - 1][j] >= c[i][j - 1] ? '↑' : '←'} works.`);
      }
      if (match(i, j)) {
        lcs[pos] = X[i - 1]; B.collect(i, j, pos); pos--;
        ctx.good(`Match '${esc(X[i - 1])}' → it goes in the LCS. Go ↖.`);
      } else ctx.good(`No match: ${r === i - 1 ? '↑' : '←'} keeps the value ${v}.`, 4);
      ti = r; tj = cc; g.cls(ti, tj, 'sel'); B.roll(ti, tj);
      traceTask();
    };
    /* a click on a tile in 3D: on Easy the three neighbours of the open cell are the arrow buttons; in the trace it is the next step */
    const cell3d = (r, cc) => {
      const before = ctx._st.mistakes;
      if (phase === 'fill' && d === 1) {
        const a = r === ci - 1 && cc === cj - 1 ? 'd' : r === ci - 1 && cc === cj ? 'u' : r === ci && cc === cj - 1 ? 'l' : null;
        if (!a) return; pickArrow(a);
      } else cellClick(r, cc);
      if (ctx._st.mistakes > before) B.shake(r, cc);
    };
    const finish = () => {
      phase = 'end';
      const s = lcs.join('');
      f.innerHTML = `LCS = "${esc(s)}" (length ${L})`;
      ctx.done(`LCS length \\(c[${m}][${n}] = ${L}\\)<br>One LCS: <b class="mono">${esc(s)}</b><br>Time \\(O(mn) = ${m} \\cdot ${n} = ${m * n}\\) cell fills, trace-back \\(O(m+n)\\), space \\(O(mn)\\).`);
    };

    activate();
    return {
      hint() {
        if (phase === 'fill') return match(ci, cj) ? `'${esc(X[ci - 1])}' matches: diagonal + 1.` : `No match: compare up (${c[ci - 1][cj]}) and left (${c[ci][cj - 1]}).`;
        if (phase === 'trace') return match(ti, tj) ? 'Match: go ↖.' : `Go to the neighbour (↑ or ←) holding ${c[ti][tj]}.`;
        return null;
      },
      demoStep() {
        if (phase === 'fill') { if (choiceEl) choiceEl.pick(courseArrow(ci, cj)); else askEl.submit(String(c[ci][cj])); }
        else if (phase === 'trace') {
          const a = courseArrow(ti, tj);
          cellClick(a === 'l' ? ti : ti - 1, a === 'u' ? tj : tj - 1);
        }
      },
    };
  },
});

Game.level({
  id: 'mcm', unit: 5, order: 40, icon: '⛓️', title: 'Matrix Chain', tag: 'DP · try every split k, keep the cheapest', scene: 'Bracket a row of matrix slabs so the multiplying costs the least',
  intro: `<p>\\(A_i\\) is \\(p_{i-1} \\times p_i\\); multiplying \\((a \\times b)(b \\times c)\\) costs \\(a \\cdot b \\cdot c\\). The bracketing changes the cost, not the answer.</p>
<ul><li>\\(m[i,i] = 0\\). Fill chains of length 2, 3, … (diagonal by diagonal).</li>
<li>For \\(m[i,j]\\) try every split \\(k\\): left part + right part + \\(p_{i-1} p_k p_j\\). Keep the minimum, store the winning \\(k\\) in \\(s[i,j]\\).</li>
<li>Read the brackets from \\(s\\): split \\(1..n\\) at \\(s[1,n]\\), then each half the same way.</li></ul>`,
  formula: `\\[\\begin{aligned} m[i,j] = \\min_{i \\le k &lt; j} \\big\\{\\, & m[i,k] + m[k+1,j] \\\\ & + p_{i-1}\\, p_k\\, p_j \\,\\big\\} \\end{aligned}\\]<p>with \\(m[i,i] = 0\\).</p><p>Time \\(O(n^3)\\), space \\(O(n^2)\\). Brute force tries Catalan-many bracketings (exponential).</p>`,
  exam: { p: [6, 12, 8, 16, 10] },
  examSrc: '2024 Final Q5a · p = {6, 12, 8, 16, 10}; M[1,3], M[2,4], M[1,4]',
  make(r, d) {
    const n = [3, 4, 5][d - 1], pool = [2, 3, 4, 5, 6, 8, 10, 12, 15, 20];
    return { p: Array.from({ length: n + 1 }, () => r.pick(pool)) };
  },
  solve(p) {
    const n = p.length - 1, m = Array.from({ length: n + 2 }, () => new Array(n + 2).fill(0)), s = Array.from({ length: n + 2 }, () => new Array(n + 2).fill(0));
    const q = (i, k, j) => m[i][k] + m[k + 1][j] + p[i - 1] * p[k] * p[j];
    for (let L = 2; L <= n; L++) for (let i = 1; i + L - 1 <= n; i++) {
      const j = i + L - 1; m[i][j] = Infinity;
      for (let k = i; k < j; k++) { const v = q(i, k, j); if (v < m[i][j]) { m[i][j] = v; s[i][j] = k; } }
    }
    return { m, s, q };
  },
  /* 3D workbench: every matrix is a slab (depth = rows, width = columns); dividers stand in the gaps (split k);
     a tried split pushes the two groups apart onto two trays. Pure view: all x positions live in plain arrays here. */
  yard(W, p, { onGap } = {}) {
    const n = p.length - 1, N = 'ABCDEFGH', C = World.C, PAL = World.PAL, mp = Math.max(...p), u = v => .7 + 2.1 * v / mp, GAP = 1.15, TH = .3, Y0 = .17;
    const wd = [], dp = [], X0 = [], gx = [], off = new Array(n + 2).fill(0);
    let x = 0; for (let t = 1; t <= n; t++) { wd[t] = u(p[t]); dp[t] = u(p[t - 1]); X0[t] = x + wd[t] / 2; x += wd[t] + GAP; }
    const tot = x - GAP, maxD = Math.max(...dp.slice(1)); for (let t = 1; t <= n; t++) X0[t] -= tot / 2;
    for (let k = 1; k < n; k++) gx[k] = (X0[k] + wd[k] / 2 + X0[k + 1] - wd[k + 1] / 2) / 2;
    W.slab({ w: tot + 3.6, d: maxD + 2.2, color: C.wood, h: .4 });
    const mats = [], posts = [];
    for (let t = 1; t <= n; t++) {
      mats[t] = W.box({ w: wd[t], h: TH, d: dp[t], x: X0[t], y: Y0 + TH / 2, color: PAL[(t - 1) % PAL.length], r: .07, label: N[t - 1], labelOpts: { size: .72, dy: .5 } });
      W.text(`${p[t - 1]}×${p[t]}`, { parent: mats[t], x: 0, y: .1, z: dp[t] / 2 + .42, size: .5, bg: '#ffffff', color: '#12283a' });
    }
    for (let k = 1; k < n; k++) posts[k] = W.box({ w: .16, h: .9, d: maxD + .5, x: gx[k], color: C.steel, r: .06, label: `k=${k}`, labelOpts: { size: .5, dy: .38 }, onClick: onGap && (() => onGap(k)) });
    const sign = W.text('', { x: 0, y: 3.05, z: 0, size: .68, bg: '#12283a', color: '#ffffff' });
    W.fit({ dir: [.1, .8, 1], pad: .78 });
    let temps = [];
    const wipe = () => { temps.forEach(o => W.remove(o)); temps = []; };
    const tray = (i, j, color, label, lvl = 0, topY = .14) => {
      const xl = X0[i] + off[i] - wd[i] / 2 - .18 - lvl * .15, xr = X0[j] + off[j] + wd[j] / 2 + .18 + lvl * .15, d = Math.max(...dp.slice(i, j + 1)) + .45 + lvl * .34;
      temps.push(W.slab({ w: xr - xl, d, x: (xl + xr) / 2, y: topY, h: topY, color }));
      if (label) temps.push(W.text(label, { x: (xl + xr) / 2, y: 1.95, z: 0, size: .55, bg: color, color: '#12283a' }));
    };
    /* only start a tween when the target really changes (was[] / op[] remember the last target) */
    const was = off.slice(), op = new Array(n + 2).fill(1);
    const place = ms => {
      for (let t = 1; t <= n; t++) if (was[t] !== off[t]) W.move(mats[t], { x: X0[t] + off[t] }, ms);
      for (let k = 1; k < n; k++) if (was[k] + was[k + 1] !== off[k] + off[k + 1]) W.move(posts[k], { x: gx[k] + (off[k] + off[k + 1]) / 2 }, ms);
      for (let t = 1; t <= n; t++) was[t] = off[t];
    };
    const focus = (i, j) => {
      for (let t = 1; t <= n; t++) { const o = t >= i && t <= j ? 1 : .2; if (op[t] !== o) W.fade(mats[t], op[t] = o, 250); }
      for (let k = 1; k < n; k++) { posts[k].visible = k >= i && k < j; W.paint(posts[k], C.steel, 0); }
    };
    return {
      mats, posts, u, n, cx: t => X0[t] + off[t],
      sign: t => W.setText(sign, t),
      /* the chain i..j is the job: everything else fades */
      focus(i, j, text) { wipe(); off.fill(0); place(300); focus(i, j); W.setText(sign, text || ''); },
      /* try split k: two groups on two trays, the divider between them lit */
      split(i, j, k, text, lt, rt) {
        wipe(); for (let t = 1; t <= n; t++) off[t] = t <= k ? -.5 : .5;
        place(300); focus(i, j); W.paint(posts[k], C.hi, 0); tray(i, k, '#cfe0ff', lt); tray(k + 1, j, '#ffe1c2', rt); W.setText(sign, text || '');
      },
      /* the best split won: one tray under the whole chain */
      fuse(i, j, text) { wipe(); off.fill(0); place(250); focus(i, j); for (let k = i; k < j; k++) posts[k].visible = false; tray(i, j, '#bfe8cf'); W.setText(sign, text || ''); },
      /* bracket phase: every decided cut widens its gap for good */
      cuts(ks, grp, text) {
        wipe(); off.fill(0); for (const k of ks) for (let t = 1; t <= n; t++) off[t] += t <= k ? -.28 : .28;
        place(350); focus(grp ? grp[0] : 1, grp ? grp[1] : n);
        for (const k of ks) { posts[k].visible = true; W.paint(posts[k], PAL[8], 0); }
        W.setText(sign, text || '');
      },
      /* final: nested trays are the brackets. groups = [{i, j, lvl}] (lvl 0 = innermost) */
      final(ks, groups, text) {
        wipe(); off.fill(0); for (const k of ks) for (let t = 1; t <= n; t++) off[t] += t <= k ? -.28 : .28;
        place(350); focus(1, n); for (let k = 1; k < n; k++) posts[k].visible = false;
        for (const g of groups) tray(g.i, g.j, ['#bfe8cf', '#cfe0ff', '#ffe1c2', '#f6d1e4'][g.lvl % 4], null, g.lvl, .14 - g.lvl * .03);
        W.setText(sign, text || '');
      },
      shake(k) { W.shake(posts[k]); },
    };
  },
  /* the story: three matrices, two ways to bracket them */
  story(W) {
    const p = [5, 2, 4, 3], Y = this.yard(W, p), C = World.C;
    for (let t = 1; t <= 3; t++) Y.mats[t].visible = false;
    for (let k = 1; k <= 2; k++) Y.posts[k].visible = false;
    return [
      { text: 'Zoya\'s game engine multiplies three matrices every frame: A is 5×2, B is 2×4, C is 4×3. Each slab is as <b>deep as its rows</b> and as <b>wide as its columns</b>.',
        run: async () => { for (let t = 1; t <= 3; t++) { Y.mats[t].visible = true; await W.drop(Y.mats[t], 4, 420); await Game.wait(150); } } },
      { text: 'Multiplying an \\(a \\times b\\) matrix by a \\(b \\times c\\) matrix costs \\(a \\cdot b \\cdot c\\) scalar multiplications and leaves an \\(a \\times c\\) matrix. So A·B costs \\(5 \\cdot 2 \\cdot 4 = 40\\) and becomes 5×4.',
        run: async () => {
          Y.split(1, 2, 1, 'A · B = 5·2·4 = 40'); Y.posts[1].visible = false; await Game.wait(900);
          const ab = W.box({ w: Y.u(4), h: .3, d: Y.u(5), x: (Y.cx(1) + Y.cx(2)) / 2, y: 1.6, color: C.ok, r: .07, label: 'AB  5×4', labelOpts: { size: .6 } });
          await W.drop(ab, 3, 450); await Game.wait(1300); W.remove(ab); Y.focus(1, 3, ''); Y.posts[1].visible = Y.posts[2].visible = false;
        } },
      { text: 'Any bracketing gives the same product, but not the same cost. DP starts small: one matrix costs 0, then every pair. \\(m[1,2] = 40\\) and \\(m[2,3] = 2 \\cdot 4 \\cdot 3 = 24\\).',
        run: async () => { Y.fuse(1, 2, 'm[1,2] = 5·2·4 = 40'); await Game.wait(1400); Y.fuse(2, 3, 'm[2,3] = 2·4·3 = 24'); await Game.wait(1200); } },
      { text: 'Now the whole chain, \\(m[1,3]\\). Try the split \\(k = 1\\): A | BC. Cost = left + right + the last multiply \\(= 0 + 24 + 5 \\cdot 2 \\cdot 3 = 54\\).',
        run: async () => { Y.split(1, 3, 1, 'k=1:  0 + 24 + 5·2·3 = 54', 'A: 0', 'BC: 24'); await Game.wait(900); } },
      { text: 'Try the split \\(k = 2\\): AB | C. Cost \\(= 40 + 0 + 5 \\cdot 4 \\cdot 3 = 100\\). Almost double the work for the same answer.',
        run: async () => { Y.split(1, 3, 2, 'k=2:  40 + 0 + 5·4·3 = 100', 'AB: 40', 'C: 0'); await Game.wait(900); } },
      { text: 'Keep the minimum, \\(m[1,3] = 54\\), and write down the winning split, \\(s[1,3] = 1\\). Reading \\(s\\) back gives the brackets: <b>A(BC)</b>.',
        run: async () => { Y.split(1, 3, 1, 'k=1:  0 + 24 + 5·2·3 = 54', 'A: 0', 'BC: 24'); await Game.wait(900); Y.final([1, 2], [{ i: 2, j: 3, lvl: 0 }, { i: 1, j: 3, lvl: 1 }], 'A(BC) = 54'); await Game.wait(500); } },
      { text: 'In general \\(m[i,j] = \\min_k \\{ m[i,k] + m[k+1,j] + p_{i-1}\\,p_k\\,p_j \\}\\), filled by chain length. \\(O(n^2)\\) cells with up to \\(n\\) splits each: \\(O(n^3)\\) time, \\(O(n^2)\\) space.',
        run: async () => { for (let t = 1; t <= 3; t++) await W.pop(Y.mats[t]); } },
    ];
  },
  mount(ctx) {
    const task = html => ctx.task(`<span>${html}</span>`);   // one flex child, so inline math does not split the line
    const { p } = ctx.inst, n = p.length - 1, H = UI.h, d = ctx.diff, { m, q } = this.solve(p);
    const N = 'ABCDEFGH', s = Array.from({ length: n + 2 }, () => new Array(n + 2).fill(0));   // s = the player's chosen splits
    const idx = [...Array(n).keys()].map(x => x + 1);
    const gm = UI.grid(n, n, { corner: 'm[i,j]', rows: idx, cols: idx }), gs = UI.grid(n, n, { corner: 's[i,j]', rows: idx, cols: idx });
    for (let i = 1; i <= n; i++) for (let j = 1; j <= n; j++) {
      if (i === j) { gm.set(i - 1, j - 1, 0); gs.cls(i - 1, j - 1, 'dim'); }
      if (i > j) { gm.cls(i - 1, j - 1, 'dim'); gs.cls(i - 1, j - 1, 'dim'); }
    }
    const sp = H('div', { class: 'mcm-sp' }), extra = H('div'), ex = H('div', { class: 'mcm-ex' });
    ctx.el.append(H('div', { class: 'mcm-tabs' }, H('div', {}, H('div', { class: 'lab' }, 'cost table m'), gm.el), H('div', {}, H('div', { class: 'lab' }, 'split table s'), gs.el)),
      sp, extra, ex);
    /* 3D: the chain as slabs. show() plays view steps (functions) with pauses (numbers); a newer call cancels an older one,
       and every view step sets the whole scene, so game state never waits for an animation. */
    const Y = this.yard(ctx.world, p, { onGap: k => gap3d(k) });
    let gen = 0, view = null;
    const show = async (...steps) => { const g = ++gen; for (const st of steps) { if (typeof st === 'number') { await Game.wait(st); if (g !== gen) return; } else st(); } };
    const play3d = (...pre) => show(...pre, () => view && view());
    const splitView = (i, j, k) => () => Y.split(i, j, k, `k=${k}:  ${m[i][k]} + ${m[k + 1][j]} + ${p[i - 1]}·${p[k]}·${p[j]}` + (d === 3 ? '' : ` = ${q(i, k, j)}`), `${name(i, k)}: ${m[i][k]}`, `${name(k + 1, j)}: ${m[k + 1][j]}`);

    const cells = [];
    for (let L = 2; L <= n; L++) for (let i = 1; i + L - 1 <= n; i++) cells.push([i, i + L - 1]);
    let at = 0, phase = 'fill', choiceBtns = null, askEl = null, cur = null;
    const name = (i, j) => N.slice(i - 1, j);
    const terms = (i, k, j) => `m[${i},${k}] + m[${k + 1},${j}] + p<sub>${i - 1}</sub>·p<sub>${k}</sub>·p<sub>${j}</sub>`;
    const nums = (i, k, j) => `${m[i][k]} + ${m[k + 1][j]} + ${p[i - 1]}·${p[k]}·${p[j]}`;
    const ks = (i, j) => { const a = []; for (let k = i; k < j; k++) a.push(k); return a; };
    const best = (i, j) => ks(i, j).filter(k => q(i, k, j) === m[i][j]);
    const whyTex = (i, j) => `\\(m[${i},${j}] = \\min\\)` + ks(i, j).map(k => `<br>&nbsp;&nbsp;\\(k=${k}:\\ ${m[i][k]} + ${m[k + 1][j]} + ${p[i - 1]}\\cdot${p[k]}\\cdot${p[j]} = ${q(i, k, j)}\\)`).join('') + `<br>\\(\\Rightarrow m[${i},${j}] = ${m[i][j]}\\)`;
    const asked = (i, j) => n >= 3 && ((i === 1 && j === n - 1) || (i === 2 && j === n) || (i === 1 && j === n));

    const activate = () => {
      const [i, j] = cur = cells[at];
      gm.clear('hi src sel'); gs.clear('hi'); gm.cls(i - 1, j - 1, 'hi'); gs.cls(i - 1, j - 1, 'hi');
      ks(i, j).forEach(k => { gm.cls(i - 1, k - 1, 'src'); gm.cls(k, j - 1, 'src'); });   // its row to the left, its column below
      view = () => Y.focus(i, j, `m[${i},${j}]: cheapest way to multiply ${name(i, j)}?`);
      sp.innerHTML = ''; extra.innerHTML = ''; choiceBtns = null; askEl = null;
      choiceBtns = ks(i, j).map(k => {
        const kids = [H('b', {}, `k=${k}`), ': ', H('span', { html: terms(i, k, j) }), ` = ${nums(i, k, j)}`, d === 3 ? ' = ?' : H('span', {}, ' = ', H('b', {}, q(i, k, j)))];
        const row = H(d === 1 ? 'button' : 'div', { class: 'mcm-k', onclick: d === 1 ? () => pick(k) : () => show(splitView(i, j, k)),
          onmouseenter: () => { gm.cls(i - 1, k - 1, 'sel'); gm.cls(k, j - 1, 'sel'); if (phase === 'fill' && cur[0] === i && cur[1] === j) show(splitView(i, j, k)); }, onmouseleave: () => gm.clear('sel') }, ...kids);
        sp.append(row); return row;
      });
      const head = `\\(m[${i},${j}]\\): chain ${name(i, j)} (\\(${p[i - 1]} \\times ${p[j]}\\) result), ${j - i} split${j - i > 1 ? 's' : ''}.`;
      if (d === 1) task(`${head} Click the divider (or the row) of the split \\(k\\) with the <b>smallest</b> cost.`);
      else {
        task(`${head} Click a divider to try that split, then type the <b>minimum</b> cost` + (d === 3 ? ' (work out each split first).' : '.'));
        askEl = UI.ask(`\\(m[${i},${j}] = \\)`, v => answer(v)); extra.append(askEl);
      }
    };
    const commit = k => {
      const [i, j] = cur; s[i][j] = k;
      gm.set(i - 1, j - 1, m[i][j]); gs.set(i - 1, j - 1, k);
      choiceBtns[k - i].classList.add('best');
      ctx.good(whyTex(i, j) + `, \\(s[${i},${j}] = ${k}\\).` + (ctx.diff === 'exam' && asked(i, j) ? ` <b>\\(M[${i},${j}]\\) is asked in the exam.</b>` : ''), 8);
      const pre = [splitView(i, j, k), 480, () => Y.fuse(i, j, `m[${i},${j}] = ${m[i][j]}:  (${name(i, k)})(${name(k + 1, j)})`), 400];
      if (++at < cells.length) activate(); else startParen();
      play3d(...pre);
    };
    const pick = k => {
      if (phase !== 'fill') return;
      const [i, j] = cur, b = best(i, j);
      if (!b.includes(k)) { show(splitView(i, j, k)); Y.shake(k); }
      if (!b.includes(k)) return ctx.bad(`Split \\(k=${k}\\) costs \\(${q(i, k, j)}\\), but \\(k=${b[0]}\\) costs only \\(${m[i][j]}\\). \\(m[${i},${j}]\\) keeps the <b>minimum</b> over all splits.`);
      commit(k);
    };
    const answer = v => {
      if (phase !== 'fill') return;
      const [i, j] = cur;
      if (!UI.same(v, m[i][j])) return ctx.bad(whyTex(i, j) + `. Each split costs left part + right part + \\(p_{${i - 1}} p_k p_{${j}}\\) for the final multiply; keep the smallest.`);
      commit(best(i, j)[0]);
    };

    /* ---- brackets from s ---- */
    const cut = {}, stack = [[1, n]];
    const expr = (i, j, dep, plain) => {
      if (i === j) return N[i - 1];
      const k = cut[i + ',' + j];
      if (!k) return plain === 2 ? `[${name(i, j)}]` : plain ? name(i, j) : `<span class="pend">${name(i, j)}</span>`;
      const col = ['var(--acc)', 'var(--acc2)', 'var(--pink)', 'var(--warn)', 'var(--ok)'][dep % 5];
      const br = x => plain ? x : `<span style="color:${col}">${x}</span>`;
      return br('(') + expr(i, k, dep + 1, plain) + expr(k + 1, j, dep + 1, plain) + br(')');
    };
    const startParen = () => {
      phase = 'paren'; gm.clear('hi src sel'); gs.clear('hi'); sp.innerHTML = ''; extra.innerHTML = '';
      ctx.say(`Table done: minimum cost \\(m[1,${n}] = ${m[1][n]}\\). Now read the brackets from the s-table.`);
      parenTask();
    };
    const parenTask = () => {
      ex.innerHTML = expr(1, n, 0);
      gs.clear('sel'); extra.innerHTML = '';
      const done = Object.values(cut);
      if (!stack.length) return finish();
      const [i, j] = stack[stack.length - 1];
      gs.cls(i - 1, j - 1, 'sel');
      view = () => Y.cuts(done, [i, j], expr(1, n, 0, 2));
      task(`Bracket ${name(i, j)}: the last multiplication happens at \\(k = s[${i},${j}]\\) (yellow cell). Click the <b>divider</b> after that matrix (or pick the split below).`);
      extra.append(UI.choices(ks(i, j).map(k => ({ label: `(${name(i, k)})(${name(k + 1, j)})`, value: k })), k => gapClick(k)));
    };
    const gapClick = k => {
      if (phase !== 'paren') return;
      const [i, j] = stack[stack.length - 1];
      if (k < i || k >= j) return ctx.bad(`That gap is outside the group ${name(i, j)} you're splitting now. Look at \\(s[${i},${j}] = ${s[i][j]}\\).`);
      if (q(i, k, j) !== m[i][j]) return ctx.bad(`\\(s[${i},${j}] = ${s[i][j]}\\): the cheapest last multiply is \\((${name(i, s[i][j])})(${name(s[i][j] + 1, j)})\\). Splitting after ${N[k - 1]} costs \\(${q(i, k, j)} &gt; ${m[i][j]}\\).`);
      stack.pop(); cut[i + ',' + j] = k;
      if (k + 1 < j) stack.push([k + 1, j]);
      if (k > i) stack.push([i, k]);
      ctx.good(`${name(i, j)} → \\((${name(i, k)})(${name(k + 1, j)})\\)`);
      parenTask(); play3d();
    };
    /* a click on a divider in 3D: try / pick that split while filling, cut there while bracketing */
    const gap3d = k => {
      const before = ctx._st.mistakes;
      if (phase === 'fill') { const [i, j] = cur; if (k < i || k >= j) return; if (d === 1) pick(k); else show(splitView(i, j, k)); }
      else if (phase === 'paren') { gapClick(k); if (ctx._st.mistakes > before) Y.shake(k); }
    };
    const finish = () => {
      phase = 'end'; gs.clear('sel');
      const order = expr(1, n, 0, true), groups = [];
      const lvl = (i, j) => { if (i === j) return -1; const k = cut[i + ',' + j], l = 1 + Math.max(lvl(i, k), lvl(k + 1, j)); groups.push({ i, j, lvl: l }); return l; };
      lvl(1, n);
      view = () => Y.final(Object.values(cut), groups, `${order} = ${m[1][n]}`);
      const askedTxt = n >= 3 ? `\\(M[1,${n - 1}] = ${m[1][n - 1]},\\ M[2,${n}] = ${m[2][n]},\\ M[1,${n}] = ${m[1][n]}\\)` : `\\(M[1,${n}] = ${m[1][n]}\\)`;
      ctx.done(`${askedTxt}<br>Optimal order: <b class="mono">${order}</b> with \\(${m[1][n]}\\) scalar multiplications.<br>Time \\(O(n^3)\\), space \\(O(n^2)\\).`);
    };

    activate(); play3d();
    return {
      hint() {
        if (phase === 'fill') { const [i, j] = cur; return `Cheapest split: \\(k = ${best(i, j)[0]}\\), cost \\(${m[i][j]}\\).`; }
        if (phase === 'paren') { const [i, j] = stack[stack.length - 1]; return `\\(s[${i},${j}] = ${s[i][j]}\\): click the gap after ${N[s[i][j] - 1]}.`; }
        return null;
      },
      demoStep() {
        if (phase === 'fill') { const [i, j] = cur; if (d === 1) pick(best(i, j)[0]); else askEl.submit(String(m[i][j])); }
        else if (phase === 'paren') { const [i, j] = stack[stack.length - 1]; gapClick(s[i][j]); }
      },
    };
  },
});

Game.level({
  id: 'color', unit: 6, order: 30, icon: '🎨', title: 'Graph Colouring', tag: 'Backtracking · smallest legal colour, back up when stuck', scene: 'Paint the island map so that no bridge joins two islands of the same colour',
  intro: `<ol><li>Colour the vertices <b>in order</b> \\(1, 2, \\dots, n\\), trying colours \\(1, 2, \\dots, m\\).</li>
<li>A colour is <b>allowed</b> if no <b>earlier</b> neighbour already has it (bounding function). Take the <b>smallest</b> allowed one.</li>

      (findChi ? `Minimum number of colours \\(\\chi(G) = \\boxed{${m}}\\).` : `Coloured with the given \\(m = ${m}\\).`) + ' Time \\(O(n \\cdot m^n)\\).';
    const solved = () => {
      if (!findChi) { phase = 'end'; return ctx.done(summary()); }
      phase = 'chi';
      ctx.task('Colouring found. What is the <b>chromatic number</b> \\(\\chi(G)\\)?');
      extra.innerHTML = ''; extra.append(UI.ask('\\(\\chi(G) = \\)', v => {
        if (!UI.same(v, m)) return ctx.bad(`Every smaller m failed (${hist.map(h => 'm=' + h.m).join(', ')}) and m = ${m} succeeded, so \\(\\chi(G) = ${m}\\).`);
        ctx.good(`\\(\\chi(G) = ${m}\\).`, 15); extra.innerHTML = ''; phase = 'end'; ctx.done(summary());
      }));
    };
    newTree(); paint(); setTask();
    if (findChi) ctx.say('Start with \\(m = 1\\) and raise \\(m\\) each time the search backtracks past the first vertex.');
    else ctx.say(`You have \\(m = ${m}\\) colours.`);
    return {
      hint: () => {
        if (phase === 'chi') return 'The first m that produced a colouring is the chromatic number.';
        const fl = firstLegal();
        return fl ? `Earlier neighbours of ${names[k]}: ${adj[k].filter(j => j < k).map(j => names[j] + '=' + x[j]).join(', ') || 'none'}. Smallest free colour from ${nextTry[k]}: ${fl}.` : `Every colour ${nextTry[k]}..${m} clashes. Backtrack.`;
      },
      demoStep() {
        if (phase === 'chi') return extra.querySelector('.ask').submit(String(m));
        if (phase !== 'color') return;
        const fl = firstLegal(); if (fl) pick(fl); else backtrack();
      },
    };
  },
});

  { unit: 6, q: 'Backtracking explores the state-space tree in which order?', a: ['Depth-first', 'Breadth-first', 'Least-cost first', 'Random'], why: 'Backtracking is DFS that abandons a node as soon as the bounding function fails.' },
  { unit: 6, q: 'Branch and bound differs from backtracking mainly because it…', a: ['expands a whole E-node at once (BFS / least-cost) and is used for optimisation', 'never prunes nodes', 'always uses DFS', 'only works for decision problems'], why: 'B&B generates all children of the E-node, keeps live nodes in a queue/heap and prunes by a bound on the best cost; backtracking is DFS.' },
  { unit: 6, q: 'A <b>live node</b> is a node that…', a: ['has been generated but not all of its children have been generated yet', 'is currently being expanded', 'has been pruned', 'is a solution leaf'], why: 'Live = generated, still has unexplored children.' },
  { unit: 6, q: 'The <b>E-node</b> is…', a: ['the live node whose children are currently being generated', 'any leaf', 'the root only', 'a node killed by the bounding function'], why: 'E = being Expanded.' },

  { unit: 6, q: 'N-Queens: queens at (row \\(r_1\\), col \\(c_1\\)) and (row \\(r_2\\), col \\(c_2\\)) are on the same diagonal iff…', a: ['\\(|r_1 - r_2| = |c_1 - c_2|\\)', '\\(r_1 + r_2 = c_1 + c_2\\)', '\\(r_1 - c_1 = 0\\)', '\\(|r_1 - c_1| = |r_2 - c_2|\\) only'], why: 'Equal row gap and column gap means same diagonal (either direction).' },

Game.level({
  id: 'nqueens', unit: 6, order: 10, icon: '♛', title: 'N-Queens', tag: 'Backtracking · place, check, back up', scene: 'Seat rival queens on the palace chessboard so that none can attack another',
  intro: `<ol><li>One queen per column, left to right. In each column try rows <b>1, 2, …, n</b> and take the <b>first safe</b> one.</li>
<li>Safe = no earlier queen in the same row or on a diagonal (the bounding function).</li>
<li>No safe row in a column? <b>Backtrack</b>: lift the previous queen and move her to her next row.</li>
<li>All \\(n\\) columns filled = a solution. For 4-queens keep backtracking to find both.</li></ol>`,
  formula: `<p>\\(x_k\\) = row of the queen in column \\(k\\). \\(Q_k\\) at row \\(x_k\\) is <b>safe</b> iff for every \\(j \\lt k\\):</p>\\[x_j \\ne x_k \\quad\\text{and}\\quad |x_j - x_k| \\ne |j - k|\\]<p>Worst case \\(O(n!)\\) time, \\(O(n)\\) space. 4-queens: 61 nodes visited (17 kept, 44 bounded), solutions \\((2,4,1,3)\\) and \\((3,1,4,2)\\).</p>`,
  exam: { n: 4 },
  examSrc: '2022-23 Re-exam Q7a · 4-queens with its state-space tree',
  make(r, d) { return { n: d === 1 ? 4 : d === 2 ? r.pick([5, 6]) : 8 }; },
  /* square colours: [light, dark] per state */
  SQ: { base: ['#f6ead2', '#a67c52'], cur: ['#c9efe6', '#4fa79c'], hot: ['#f4b2a6', '#c65a4b'], tried: ['#c3ccd3', '#8d99a3'] },
  /* the 3D chessboard, shared by the story and the level. Row 1 is the far edge, column 1 the left edge. */
  board(W, n, S, onSq) {
    const half = n * S / 2, X = c => (c - (n - 1) / 2) * S, Z = r => (r - (n - 1) / 2) * S, SQ = this.SQ;
    W.slab({ w: n * S + .8, d: n * S + .8, h: .4, color: World.C.woodDark });
    const sq = [];
    for (let r = 0; r < n; r++) {
      sq.push([]);
      for (let c = 0; c < n; c++) sq[r].push(W.box({ w: S * .96, h: .14, d: S * .96, r: .03, x: X(c), z: Z(r), color: SQ.base[(r + c) % 2], shadow: false, onClick: onSq ? () => onSq(r, c) : null }));
    }
    for (let i = 0; i < n; i++) {
      W.text('row ' + (i + 1), { x: -half - 1.15, y: .3, z: Z(i), size: .52, color: '#3d5468' });
      W.text('c' + (i + 1), { x: X(i), y: .3, z: half + .8, size: .55, color: '#3d5468' });
    }
    /* a queen: base disc, cone body, collar, flared crown and a jewel */
    const queen = (c, r, label) => {
      const k = S / 1.6, g = W.group({ x: X(c), y: .14, z: Z(r) }), col = '#ffc53d';
      W.cyl({ parent: g, r: .46 * k, h: .18 * k, color: col });
      W.cone({ parent: g, r: .38 * k, h: 1.5 * k, y: .93 * k, color: col });
      W.cyl({ parent: g, r: .27 * k, h: .1 * k, y: .95 * k, color: col });
      W.cyl({ parent: g, r: .13 * k, rTop: .3 * k, h: .32 * k, y: 1.5 * k, color: col });
      W.ball({ parent: g, r: .14 * k, y: 1.78 * k, color: col });
      W.tag(g, label, { dy: 1.95 * k + .4, size: .55 });
      return g;
    };
    const beam = (c0, r0, c1, r1) => W.link({ x: X(c0), y: .75, z: Z(r0) }, { x: X(c1), y: .75, z: Z(r1) }, { color: World.C.bad, r: .06 });
    return { sq, X, Z, half, queen, beam };
  },
  /* the story: 4 queens on a 4x4 board, told beat by beat */
  story(W) {
    const n = 4, S = 1.6, C = World.C, SQ = this.SQ, B = this.board(W, n, S), GOLD = '#ffc53d';
    const x = [-1, -1, -1, -1], wz = -B.half - 1.5;
    const q = x.map((_, i) => { const g = B.queen(0, 0, 'Q' + (i + 1)); g.position.set(B.X(i), 0, wz); g.visible = false; return g; });
    const note = W.text('', { x: 0, y: .5, z: B.half + 2, size: .7, bg: '#12283a', color: '#ffffff' });
    W.fit({ dir: [.15, .8, 1], pad: .82 });
    const hit = (r, c) => x.some((v, j) => v >= 0 && j !== c && (v === r || Math.abs(v - r) === Math.abs(j - c)));
    const heat = () => { for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) W.paint(B.sq[r][c], (x[c] < 0 && hit(r, c) ? SQ.hot : SQ.base)[(r + c) % 2], 0); };
    const seat = async (i, r) => { x[i] = r; await W.hop(q[i], { x: B.X(i), y: .14, z: B.Z(r) }, 620, 1.8); heat(); await Game.wait(250); };
    const home = async i => { x[i] = -1; await W.hop(q[i], { x: B.X(i), y: 0, z: wz }, 560, 2); heat(); };
    /* queen i hovers over row r of her column, the attacking queen j fires a beam, the square flashes */
    const tryRow = async (i, r, j, ms = 520) => {
      await W.hop(q[i], { x: B.X(i), y: 1, z: B.Z(r) }, 380, .8);
      const b = B.beam(j, x[j], i, r); W.paint(B.sq[r][i], C.bad, 0);
      await Game.wait(ms); W.remove(b); heat();
    };
    const say = s => W.setText(note, s);
    return [
      { text: 'Four proud queens visit Raja Vikram\'s palace. A queen attacks anyone in her <b>row</b>, <b>column</b> or <b>diagonal</b>, so he must seat all four on his 4×4 board with no two in sight of each other.',
        run: async () => { for (let i = 0; i < n; i++) { q[i].visible = true; await W.drop(q[i], 5, 380); } } },
      { text: 'His plan: one queen per column, left to right, always the <b>first safe row</b> from the top. \\(Q_1\\) takes row 1. The red squares are the ones she now attacks.',
        run: async () => { say('x = (1, ·, ·, ·)'); await seat(0, 0); const bs = [B.beam(0, 0, 3, 0), B.beam(0, 0, 3, 3)]; await Game.wait(900); bs.forEach(b => W.remove(b)); } },
      { text: '\\(Q_2\\) tries row 1: same row as \\(Q_1\\). Row 2: same diagonal, because \\(|1-2| = |1-2|\\). Row 3 is safe, so she sits there.',
        run: async () => { await tryRow(1, 0, 0); await tryRow(1, 1, 0); await seat(1, 2); say('x = (1, 3, ·, ·)'); } },
      { text: '\\(Q_3\\) finds every row of column 3 attacked. A dead end, so Vikram <b>backtracks</b>: he lifts \\(Q_2\\) and moves her to her next row, row 4.',
        run: async () => { for (const [r, j] of [[0, 0], [1, 1], [2, 1], [3, 1]]) await tryRow(2, r, j, 330); await home(2); say('column 3: no safe row'); await Game.wait(400); await seat(1, 3); say('x = (1, 4, ·, ·)'); } },
      { text: 'Now \\(Q_3\\) fits in row 2, but \\(Q_4\\) has no safe row. \\(Q_3\\) and \\(Q_2\\) have no rows left either, so he backtracks all the way: \\(Q_1\\) moves down to row 2.',
        run: async () => {
          await seat(2, 1); say('x = (1, 4, 2, ·)');
          for (const [r, j] of [[0, 0], [1, 2], [2, 2], [3, 1]]) await tryRow(3, r, j, 300);
          await home(3); say('dead end: backtrack'); await home(2); await home(1); await seat(0, 1); say('x = (2, ·, ·, ·)');
        } },
      { text: 'From there it flows: \\(Q_2\\) row 4, \\(Q_3\\) row 1, \\(Q_4\\) row 3. Nobody attacks anybody. The answer is \\(x = (2, 4, 1, 3)\\).',
        run: async () => { await seat(1, 3); await seat(2, 0); await seat(3, 2); say('x = (2, 4, 1, 3)'); for (const g of q) { W.paint(g, C.ok, 300); W.pop(g); } await Game.wait(400); } },
      { text: 'Keep backtracking and the mirror image \\((3, 1, 4, 2)\\) turns up too. Each column tries up to \\(n\\) rows, then \\(n-1\\), …: worst case \\(O(n!)\\) time and \\(O(n)\\) space.',
        run: async () => { for (const g of q) W.paint(g, GOLD, 200); await Promise.all([2, 0, 3, 1].map((r, i) => { x[i] = r; return W.hop(q[i], { z: B.Z(r) }, 700, 1.2 + i * .25); })); heat(); say('x = (3, 1, 4, 2)'); for (const g of q) { W.paint(g, C.ok, 300); W.pop(g); } } },
    ];
  },
  mount(ctx) {
    { const t0 = ctx.task; ctx.task = html => t0("<span>" + html + "</span>"); }   // one flex item, so inline math does not split the line
    const H = UI.h, W = ctx.world, flat = !W.real, n = ctx.inst.n, easy = ctx.diff === 1;
    const all = n === 4;                          // 4-queens: find both solutions (the exam tree); bigger boards: first solution
    const showDead = n <= 4, collapse = n >= 7;
    const x = new Array(n).fill(-1), start = new Array(n).fill(0);
    let k = 0, phase = 'place', visited = 1, kept = 1, bounded = 0, nodeId = 0;
    const sols = [];
    const root = { label: 'S', kids: [], id: 'r', cls: 'root' };
    const path = [root];

    /* ---- 3D scene: the chessboard, a pointer over the column being filled, queens that drop in and lift off ---- */
    const S = n <= 4 ? 1.6 : n <= 6 ? 1.3 : 1.05, SQ = this.SQ, GOLD = '#ffc53d';
    const B = this.board(W, n, S, (r, c) => click(r, c));
    const marker = W.group({ x: B.X(0), z: B.half + 1.75 });
    const mcone = W.cone({ parent: marker, r: .24, h: .5, y: .2, z: -.55, color: '#0f8b8d' }); mcone.rotation.x = -Math.PI / 2;
    W.tag(marker, 'Q1 here', { dy: .2, size: .6, bg: '#0f8b8d', color: '#ffffff' });
    W.fit({ dir: [.15, .8, 1], pad: .92 });
    const qm = new Array(n).fill(null), last = [];
    const lift = async g => { W.click(g, null); W.fade(g, 0, 480); await W.move(g, { y: 5 }, 480); W.remove(g); };
    const qclick = c => {
      if (ctx.busy || phase === 'end') return;
      if (c === k - 1) return backtrack();
      ctx.say(`Only the <b>last</b> queen placed (\\(Q_${k}\\)) can be lifted: backtracking always undoes the most recent choice.`);
    };

    /* ---- workbench: Backtrack, the solution vector and the exam-style state-space tree (plus a flat board when 3D is off) ---- */
    const q = n <= 4 ? 56 : n <= 6 ? 48 : 40;
    const board = H('div', { class: 'u6q-board', style: `grid-template-columns:repeat(${n},${q}px);--q:${q}px` });
    const sq = [];
    if (flat) for (let r = 0; r < n; r++) { sq.push([]); for (let c = 0; c < n; c++) { const d = H('div', { class: 'u6q-sq ' + ((r + c) % 2 ? 'dk' : 'lt'), onclick: () => click(r, c) }); sq[r].push(d); board.append(d); } }
    const colLab = H('div', { class: 'u6q-lab', style: `--q:${q}px;margin-left:22px` }, Array.from({ length: n }, (_, c) => H('span', {}, 'c' + (c + 1))));
    const rowLab = H('div', { style: `display:grid;grid-template-rows:repeat(${n},${q}px);width:20px;font:600 11px var(--mono);color:var(--mut);align-items:center` }, Array.from({ length: n }, (_, r) => H('span', {}, r + 1)));
    const btnBack = H('button', { class: 'btn', onclick: () => backtrack() }, '↩ Backtrack');
    const vec = H('div', { class: 'mono', style: 'margin-top:8px;font-size:14px' });
    const stats = H('div', { class: 'note' });
    const tree = UI.tree({ r: 12, levelH: 56, gap: showDead ? 28 : 34 });
    const treeBox = H('div', { class: 'u6q-tree' },
      H('div', { class: 'note' }, 'State-space tree (level k = column k, node = row of \\(Q_k\\))'),
      H('div', { class: 'u6q-leg' }, H('span', {}, H('i', { style: 'border-color:var(--acc)' }), 'current'), H('span', {}, H('i', { style: 'border-color:var(--warn)' }), 'placed, next column stuck'),
        H('span', {}, H('i', { style: 'border-color:var(--bad)' }), showDead ? '✗r = row r bounded' : '✗k tag = k rows bounded'), H('span', {}, H('i', { style: 'border-color:var(--ok)' }), 'solution')),
      tree.el);
    ctx.el.append(H('div', { class: 'u6q-wrap' }, H('div', { class: 'u6q-left' }, flat ? [colLab, H('div', { style: 'display:flex' }, rowLab, board)] : null, btnBack,
      flat ? null : H('div', { class: 'note', style: 'max-width:210px;margin-top:6px' }, 'Clicking the last queen on the board also backtracks.'), vec, stats), treeBox));
    UI.tex(treeBox);

    const attackers = (r, c) => { const out = []; for (let j = 0; j < c; j++) if (x[j] >= 0 && (x[j] === r || Math.abs(x[j] - r) === c - j)) out.push(j); return out; };
    const safe = (r, c) => attackers(r, c).length === 0;
    const firstSafe = () => { for (let r = start[k]; r < n; r++) if (safe(r, k)) return r; return -1; };
    const why = (r, c) => {
      const j = attackers(r, c)[0];
      if (x[j] === r) return `\\(Q_${j + 1}\\) at (row ${x[j] + 1}, col ${j + 1}) is in the <b>same row</b> ${r + 1}.`;
      return `\\(Q_${j + 1}\\) at (row ${x[j] + 1}, col ${j + 1}) is on the <b>same diagonal</b>: \\(|${x[j] + 1} - ${r + 1}| = ${Math.abs(x[j] - r)} = |${j + 1} - ${c + 1}|\\).`;
    };
    /* the attacking queen fires a beam at the square and shakes */
    const flash = async (j, r, c) => {
      if (flat) { const d = sq[x[j]][j]; d.classList.remove('att'); void d.offsetWidth; d.classList.add('att'); return; }
      const b = B.beam(j, x[j], c, r); if (qm[j]) W.shake(qm[j]);
      W.paint(B.sq[r][c], World.C.bad, 0); last[r * n + c] = '';
      await Game.wait(950); W.remove(b); sync3d();
    };
    const tint = (r, c) => {
      const p = (r + c) % 2;
      if (phase !== 'place') return SQ.base[p];
      if (c === k && r < start[k]) return SQ.tried[p];
      if (easy && c >= k && attackers(r, c).length) return SQ.hot[p];
      return (c === k ? SQ.cur : SQ.base)[p];
    };
    const sync3d = () => {
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const col = tint(r, c); if (last[r * n + c] !== col) { last[r * n + c] = col; W.paint(B.sq[r][c], col, 0); } }
      marker.visible = phase === 'place';
      if (phase === 'place') { marker.position.x = B.X(k); W.tag(marker, `Q${k + 1} here`); }
    };

    const paint = () => {
      if (flat) for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const d = sq[r][c]; d.innerHTML = ''; d.classList.toggle('cur', phase === 'place' && c === k); d.classList.remove('sol');
        if (x[c] === r) { d.append(H('span', { class: 'qn' }, '♛')); if (phase === 'sol') d.classList.add('sol'); continue; }
        if (c === k && phase === 'place' && r < start[k]) { d.append(H('span', { class: 'tried' }, '–')); continue; }
        if (easy && c >= k && phase === 'place') {
          const a = attackers(r, c).length;
          if (a) d.append(H('div', { class: 'heat', style: `opacity:${Math.min(.18 + .16 * a, .6)}` }), H('span', { class: 'x' }, '×'));
        }
      }
      sync3d();
      vec.innerHTML = 'x = (' + x.map(v => v < 0 ? '·' : v + 1).join(', ') + ')';
      stats.textContent = `nodes visited ${visited} · kept ${kept} · bounded ${bounded}` + (sols.length ? ` · solutions ${sols.length}` : '');
      drawTree();
    };
    /* tree rendering: a view copy of the model */
    const view = (nd, onPath) => {
      const v = { label: nd.label, id: nd.id, cls: nd.cls || '', ecls: nd.ecls || '', tag: !showDead && nd.dead ? '✗' + nd.dead : '' };
      if (nd === path[path.length - 1] && phase === 'place') v.cls += ' hi';
      if (collapse && nd.closed) { v.cls += ' dim'; v.kids = []; }
      else v.kids = nd.kids.map(c => view(c));

      return v;
    };

      const g = tree.render(view(root));
      const cur = path[path.length - 1], N = g.N[cur.id];
      if (N && !ctx.test) {
        const bx = N.g.getBBox ? N.g.getBBox() : null;
        if (bx) { const w = tree.el.clientWidth; tree.el.scrollLeft = Math.max(0, bx.x - w / 2); }

    };
    const addDead = (parent, r0, r1) => {
      for (let r = r0; r < r1; r++) {
        visited++; bounded++;

        else parent.dead = (parent.dead || 0) + 1;
      }
    };

    const setTask = () => {
      if (phase === 'sol') return ctx.task(`Solution ${sols.length} found! Press <b>Backtrack</b> to lift \\(Q_${n}\\) off the board and keep searching for more.`);
      const fs = firstSafe();
      ctx.task(fs >= 0 || !easy
        ? `Column ${k + 1}: click the <b>first safe row</b> for \\(Q_${k + 1}\\) (rows are tried top to bottom${start[k] ? `, from row ${start[k] + 1}` : ''}). If none is safe, press <b>Backtrack</b>.`
        : `Column ${k + 1} has <b>no safe row left</b>. Press <b>Backtrack</b>.`);
    };

    const click = (r, c) => {
      if (ctx.busy) return;
      if (phase === 'sol') return ctx.say('This board is a solution. Press <b>Backtrack</b> to look for the next one.');
      if (c !== k) return ctx.say(`Queens go column by column: you are placing \\(Q_${k + 1}\\) in <b>column ${k + 1}</b>.`);
      if (r < start[k]) return ctx.bad(`Row ${r + 1} of column ${k + 1} was already tried in this branch (its subtree is finished). Continue from row ${start[k] + 1} downwards.`);
      const fs = firstSafe();
      if (!safe(r, c)) {
        attackers(r, c).forEach(j => flash(j, r, c));
        return ctx.bad(`Row ${r + 1} is attacked: ${why(r, c)} ` + (fs >= 0 ? `The first safe row in column ${k + 1} is row ${fs + 1}.` : `No row from ${start[k] + 1} to ${n} is safe here, so the node is dead: press <b>Backtrack</b>.`));
      }
      if (r !== fs) return ctx.bad(`Row ${r + 1} is safe, but row ${fs + 1} is safe too and comes first. Backtracking tries rows in order 1, 2, …, so it takes row ${fs + 1}.`);
      /* place */
      const parent = path[path.length - 1];
      addDead(parent, start[k], r);
      const nd = { label: String(r + 1), id: 'n' + nodeId++, kids: [] };
      parent.kids.push(nd); path.push(nd); visited++; kept++;

      qm[k] = B.queen(k, r, ''); { const g = qm[k], c0 = k; W.click(g, () => qclick(c0)); W.drop(g, 4, 380); }
      start[k] = r + 1; k++;
      if (k === n) {
        sols.push(x.map(v => v + 1));
        nd.cls = 'ok';
        for (const g of qm) if (g) { W.paint(g, World.C.ok, 300); W.pop(g); }
        path.forEach(p => { if (p !== root) { p.cls = 'ok'; p.ecls = 'ok'; } });
        ctx.good(`\\(Q_${n}\\) in row ${r + 1}: all ${n} queens placed. <b>Solution</b> \\(x = (${sols[sols.length - 1].join(', ')})\\).`, 20);
        if (!all) { phase = 'end'; paint(); return finish(); }
        phase = 'sol'; paint(); return setTask();
      }
      start[k] = 0;
      ctx.good(`\\(Q_${k}\\) → row ${r + 1}` + (skipped ? ` (${skipped} row${skipped > 1 ? 's' : ''} above bounded).` : '.'));
      paint(); setTask();
    };

    const backtrack = () => {
      if (ctx.busy) return;
      if (phase === 'place') {
        const fs = firstSafe();
        if (fs >= 0) return ctx.bad(`Not yet: row ${fs + 1} of column ${k + 1} is still safe (no earlier queen shares its row or diagonal). Backtrack only when every remaining row of the column is attacked.`);
        const parent = path[path.length - 1];
        addDead(parent, start[k], n);
        if (parent !== root && !parent.kids.some(c => c.cls !== 'bad')) parent.cls = 'sel';   // placed, but every child bounded
      }

      const wasSol = phase === 'sol';

      if (qm[k]) lift(qm[k]); qm[k] = null;
      if (wasSol) for (const g of qm) if (g) W.paint(g, GOLD, 300);
      const nd = path.pop(); nd.closed = true;
      phase = 'place';
      if (wasSol) ctx.good(`Removed \\(Q_${n}\\) from row ${r + 1}; the search goes on in column ${n}.`, 5);
      else ctx.good(`Column ${k + 2} is a dead end → <b>backtrack</b>: remove \\(Q_${k + 1}\\) from row ${r + 1} and try her next row.`, 8);
      /* column k exhausted at the root level: search over */
      if (k === 0 && start[0] >= n) { paint(); return finish(); }
      paint(); setTask();
    };

    const finish = () => {
      phase = 'end'; paint();
      const sv = sols.map(s => `\\((${s.join(', ')})\\)`).join(' and ');
      const boards = sols.map(s => '<pre style="margin:4px 0;line-height:1.2">' + Array.from({ length: n }, (_, r) => s.map(v => v - 1 === r ? 'Q' : '.').join(' ')).join('\n') + '</pre>');
      ctx.done(all
        ? `${n}-queens: solutions ${sv} (mirror images).<div style="display:flex;gap:18px">${boards.join('')}</div>State-space tree: ${visited} nodes visited (${kept} kept incl. the root, ${bounded} bounded ✗); the full tree has 341 nodes. Time \\(O(n!)\\).`
        : `First solution for ${n}-queens: ${sv}.${boards[0]}Nodes visited: ${visited} (${kept} kept, ${bounded} bounded).`);
    };

    paint(); setTask();
    const one = () => { if (phase === 'sol') return backtrack(); const fs = firstSafe(); if (fs < 0) backtrack(); else click(fs, k); };
    return {
      hint: () => {
        if (phase === 'sol') return 'A full board is a leaf. Backtrack to search the rest of the tree.';
        const fs = firstSafe();
        return fs >= 0 ? `Check rows ${start[k] + 1}…${n} of column ${k + 1} against every earlier queen (same row, or \\(|\\Delta r| = |\\Delta c|\\)). Row ${fs + 1} is the first safe one.` : `Every remaining row of column ${k + 1} is attacked. Press Backtrack.`;
      },
      async demoStep() {
        /* 8-queens is long: outside the self-test, one demo tick plays a few moves quickly */
        const reps = !ctx.test && n >= 7 ? 4 : 1;
        for (let i = 0; i < reps && !ctx.busy; i++) { one(); if (reps > 1) await Game.wait(120); }
      },
    };
  },
});

Game.level({
  id: 'sos', unit: 6, order: 20, icon: '🪙', title: 'Sum of Subsets', tag: 'Backtracking · include/exclude, prune early', scene: 'Balance the shop scale: which brass weights add up to exactly the order?',

<li>At every node test the <b>bounding function</b>. Fails? <b>Bound!</b> (dead node, its subtree is skipped).</li>
<li>\\(s = W\\)? An <b>answer node</b>: record the subset, don't go deeper.</li>
<li>Otherwise go <b>left first: include</b> \\(w_{k+1}\\) (on the pan), then <b>right: exclude</b> it (set aside). Report <b>all</b> subsets.</li></ol>`,
  formula: `<p>Node \\((s, k, r)\\): sum chosen so far, items decided, total of the undecided items. It is <b>promising</b> iff</p>\\[s + r \\ge W \\quad\\text{and}\\quad \\big(s = W \\ \\text{or}\\ s + w_{k+1} \\le W\\big)\\]<p>Include: \\((s + w_{k+1},\\, k+1,\\, r - w_{k+1})\\); exclude: \\((s,\\, k+1,\\, r - w_{k+1})\\). Worst case \\(O(2^n)\\) (full tree \\(2^{n+1}-1\\) nodes).</p>`,
  exam: { w: [3, 5, 6, 7], W: 15 },

  make(r, d) {

    W.box({ w: 2 * half + .3, h: top - .25, d: .14, x: tx, y: (top + .25) / 2, z: TZ - .3, color: '#f7f3e6', r: .05, shadow: false });
    for (const dx of [-half, half]) W.box({ w: .2, h: top + .1, d: .2, x: tx + dx, y: (top + .1) / 2, z: TZ - .3, color: C.woodDark, r: .04 });
    W.box({ w: 2 * half + .4, h: .2, d: .22, x: tx, y: top + .05, z: TZ - .3, color: C.woodDark, r: .04 });
    W.text('(s, k, r)', { x: tx, y: Y0 + .78, z: TZ, size: .52, color: '#3d5468' });

    const slots = [[-.62, .4], [0, .4], [.62, .4], [-.62, -.4], [0, -.4], [.62, -.4]];

  story(W) {
    const w = [2, 3, 5], S = this.shop(W, w, 5);
    S.wt.forEach(m => { m.visible = false; });
    const T = ms => Game.wait(ms);
    return [
      { text: 'A customer asks Meena for exactly <b>5 g</b> of saffron. The sack sits on the left pan, and she owns brass weights of 2, 3 and 5 g. Which sets of weights balance the scale <b>exactly</b>?',
        run: async () => { for (const m of S.wt) { m.visible = true; await W.drop(m, 4, 350); } } },
      { text: 'She takes the weights smallest first and decides each one: <b>on the pan</b> or <b>set aside</b>. Every decision is a branch, and each node notes \\((s, k, r)\\): \\(s\\) on the pan, \\(k\\) weights decided, \\(r\\) still on the counter.',
        run: async () => { await S.node('r', null, 0, '0,0,10'); S.next(0); await T(500); } },
      { text: 'Include 2, then include 3: \\(s = 2 + 3 = 5 = W\\). The scale balances, so \\(\\{2, 3\\}\\) is an <b>answer</b>. She stops there, more weight could only overshoot.',
        run: async () => {
          S.style('r', 'live'); await S.put(0, 'pan'); await S.node('a', 'r', 1, '2,1,8'); S.next(1); await T(350);
          S.style('a', 'live'); await S.put(1, 'pan'); await S.node('b', 'a', 1, '5,2,5'); S.next(-1); await T(300); S.style('b', 'ans'); await S.answer('{2, 3}');
        } },
      { text: 'Back up and set 3 aside instead: \\(s = 2\\). The next weight is 5 and \\(2 + 5 = 7 \\gt 5\\). Even the smallest weight left overshoots, so this branch is <b>cut</b>.',
        run: async () => { await S.put(1, 'rack'); await S.put(1, 'aside'); await S.node('c', 'a', 0, '2,2,5'); S.next(2); await T(700); await S.drop('c', 600); await T(500); } },
      { text: 'Back to the start: set 2 aside and take 3. Again \\(3 + 5 = 8 \\gt 5\\): cut.',
        run: async () => {
          await S.put(1, 'rack', 400); S.close('a', true); await S.put(0, 'rack', 400); await S.put(0, 'aside'); await S.node('d', 'r', 0, '0,1,8'); S.next(1); await T(300);
          S.style('d', 'live'); await S.put(1, 'pan'); await S.node('e', 'd', 1, '3,2,5'); S.next(2); await T(700); await S.drop('e', 600); await T(400);
        } },
      { text: 'Set 3 aside too and take the 5: \\(s = 5\\). A second answer, \\(\\{5\\}\\).',
        run: async () => {
          await S.put(1, 'rack', 400); await S.put(1, 'aside'); await S.node('f', 'd', 0, '0,2,5'); S.next(2); await T(300);
          S.style('f', 'live'); await S.put(2, 'pan'); await S.node('g', 'f', 1, '5,3,0'); S.next(-1); await T(300); S.style('g', 'ans'); await S.answer('{5}');
        } },
      { text: 'Set all three aside: \\(s + r = 0 + 0 \\lt 5\\), it can never reach 5: cut. Those two tests are the bounding function: \\(s + r \\ge W\\) and \\(s + w_{k+1} \\le W\\).',
        run: async () => { await S.put(2, 'rack', 400); await S.put(2, 'aside'); await S.node('h', 'f', 0, '0,3,0'); await T(700); await S.drop('h', 600); await T(400); } },
      { text: 'Done: \\(\\{2, 3\\}\\) and \\(\\{5\\}\\). Sorting ascending is what makes the overshoot test safe. Without cutting, \\(n\\) weights give \\(2^{n+1} - 1\\) nodes: worst case \\(O(2^n)\\).',
        run: async () => { S.close('f', true); S.close('d', true); S.close('r', true); for (const i of [2, 1, 0]) await S.put(i, 'rack', 380); for (const m of S.wt) W.pop(m); } },
    ];
  },
  mount(ctx) {
    { const t0 = ctx.task; ctx.task = html => t0("<span>" + html + "</span>"); }   // one flex item, so inline math does not split the line
    const H = UI.h, W3 = ctx.world, flat = !W3.real, { w, W } = ctx.inst, n = w.length, easy = ctx.diff === 1, typeS = ctx.diff === 3;
    const total = w.reduce((a, b) => a + b, 0);
    let nid = 0, phase = 'judge', visited = 1, pruned = 0;
    const sols = [];
    const mk = (s, k, r, parent, inc) => ({ s, k, r, parent, inc, kids: [], id: 'n' + nid++, judged: false, incDone: false, excDone: false, state: 'live', shown: !typeS || !parent });
    const root = mk(0, 0, total, null, null);
    let cur = root;

    /* ---- 3D scene: every move is mirrored in the shop through a small animation queue (the game never waits for it) ---- */
    const S = this.shop(W3, w, W, { inc: () => act('inc'), exc: () => act('exc'), sol: () => act('sol'), bound: () => act('bound') }, .72);
    let pend = 0, vq = Promise.resolve();
    const V = flat ? () => {} : fn => { pend++; vq = vq.then(fn).catch(e => console.error(e)).then(() => { pend--; }); };
    const ms = () => pend > 3 ? 170 : 480;
    W3.target.y += 1.2; W3.cam.position.y += 1.2;   // the play view has no caption box: sit the scene lower in the frame
    V(async () => { await S.node(root.id, null, 0, `0,0,${total}`); S.next(0); });

    const arr = flat ? UI.arr(w, { label: 'weights (sorted ascending)', idx: w.map((_, i) => 'w' + (i + 1)) }) : null;   // the 3D rack replaces this row
    const info = H('div', { class: 'mono', style: 'font-size:14px;margin-top:6px' });
    const chk = H('div', { class: 'u6s-chk' });
    const btns = UI.choices([
      { label: '✅ Include \\(x_{k+1}=1\\)', value: 'inc' }, { label: '⛔ Exclude \\(x_{k+1}=0\\)', value: 'exc' },
      { label: '✂️ Bound!', value: 'bound' }, { label: '🎯 Solution', value: 'sol' }], v => act(v));
    const extra = H('div');
    const solsEl = H('div', { class: 'u6s-sols' });
    const tree = UI.tree({ r: 17, levelH: 64, gap: 80 });
    ctx.el.append(H('div', { class: 'note' }, `Weights \\((${w.join(', ')})\\) sorted ascending · target \\(W = ${W}\\) · total \\(= ${total}\\)`), arr ? arr.el : '', info, chk, btns,
      flat ? '' : H('div', { class: 'note' }, 'In the shop: click the right pan to include, the dark tray to exclude, the bell for a solution, the red button to bound.'), extra, solsEl,
      H('div', { class: 'note', style: 'margin-top:10px' }, 'State-space tree: node = (s, k, r) · left edge = include, right edge = exclude · red = bounded, green = answer'),
      H('div', { class: 'u6s-tree' }, tree.el));
    UI.tex(ctx.el);

    const chosen = nd => { const out = []; for (let p = nd; p.parent; p = p.parent) if (p.inc) out.unshift(w[p.k - 1]); return out; };
    const prom = nd => nd.s + nd.r >= W && (nd.s === W || (nd.k < n && nd.s + w[nd.k] <= W));
    const expect = () => !cur.judged ? (!prom(cur) ? 'bound' : cur.s === W ? 'sol' : 'inc') : !cur.incDone ? 'inc' : 'exc';
    const boundWhy = nd => nd.s + nd.r < W
      ? `\\(s + r = ${nd.s} + ${nd.r} = ${nd.s + nd.r} \\lt ${W}\\): even taking every remaining item cannot reach \\(W\\).`
      : `\\(s + w_{${nd.k + 1}} = ${nd.s} + ${w[nd.k]} = ${nd.s + w[nd.k]} \\gt ${W}\\): adding even the smallest next weight overshoots (weights are sorted, so all later ones overshoot too).`;
    const lab = nd => nd.shown ? `${nd.s},${nd.k},${nd.r}` : '?';
    const view = nd => ({
      label: lab(nd), id: nd.id, rect: true, rw: 36, edge: nd.parent ? (nd.inc ? 'in ' : 'out ') + w[nd.k - 1] : '',
      cls: [nd.state === 'dead' ? 'bad' : nd.state === 'ans' ? 'ok' : '', nd === cur && phase !== 'end' ? 'hi' : ''].filter(Boolean).join(' ') || null,
      ecls: nd.state === 'ans' ? 'ok' : nd.state === 'dead' ? 'dim' : null,
      kids: nd.kids.map(view),
    });
    const paint = () => {
      if (arr) {
        arr.clear('ok hi dim sel');
        const ch = []; for (let p = cur; p.parent; p = p.parent) ch.push(p);
        ch.forEach(p => arr.cls(p.k - 1, p.inc ? 'ok' : 'dim'));
        if (cur.k < n) arr.cls(cur.k, 'hi');
        arr.ptr('next', cur.k < n ? cur.k : -1);
      }
      info.innerHTML = cur.shown ? `node: \\(s = ${cur.s},\\ k = ${cur.k},\\ r = ${cur.r}\\)  chosen = {${chosen(cur).join(', ')}}` + (cur.k < n ? `  next \\(w_{${cur.k + 1}} = ${w[cur.k]}\\)` : '  (no items left)') : 'new node: compute its \\(s\\)';
      chk.innerHTML = '';
      if (easy && cur.shown && phase === 'judge' && !cur.judged) {
        const a = cur.s + cur.r >= W, b = cur.s === W || (cur.k < n && cur.s + w[cur.k] <= W);
        chk.append(H('span', { class: 'kv ' + (a ? 'ok' : 'bad'), html: `\\(s + r = ${cur.s + cur.r} ${a ? '\\ge' : '\\lt'} ${W}\\)` }),
          H('span', { class: 'kv ' + (b ? 'ok' : 'bad'), html: cur.s === W ? `\\(s = W\\)` : cur.k < n ? `\\(s + w_{${cur.k + 1}} = ${cur.s + w[cur.k]} ${cur.s + w[cur.k] <= W ? '\\le' : '\\gt'} ${W}\\)` : 'no next item' }));
      }
      solsEl.textContent = sols.length ? 'Solutions so far: ' + sols.map(s => '{' + s.join(', ') + '}').join('  ') : '';
      const g = tree.render(view(root));
      if (!ctx.test) { const N = g.N[cur.id]; if (N && N.g.getBBox) { const bx = N.g.getBBox(); tree.el.scrollLeft = Math.max(0, bx.x - tree.el.clientWidth / 2); } }
      UI.tex(info); UI.tex(chk);
    };
    const setTask = () => {
      if (phase === 'type') return ctx.task(`New node after ${cur.inc ? 'including' : 'excluding'} \\(w_{${cur.k}} = ${w[cur.k - 1]}\\): what is its sum \\(s\\)?`);
      ctx.task(!cur.judged
        ? `Node \\((s, k, r) = (${cur.s}, ${cur.k}, ${cur.r})\\): is it promising? <b>Bound!</b> it, record a <b>Solution</b>, or branch (include first).`
        : `The include branch of \\((${cur.s}, ${cur.k}, ${cur.r})\\) is finished. Next move?`);
    };
    /* go back up while the current node is finished */
    const climb = () => {
      for (;;) {
        const done = cur.state !== 'live' || (cur.incDone && cur.excDone);
        if (!done) break;
        if (!cur.parent) return finish();
        const c = cur; cur = cur.parent;
        if (c.inc) cur.incDone = true; else cur.excDone = true;
        V(async () => { if (c.state === 'live') S.close(c.id, c.hasAns); await S.put(c.k - 1, 'rack', ms() * .8); });   // the weight goes back on the rack
      }
      { const id = cur.id, nx = cur.k < n ? cur.k : -1; V(() => { S.style(id, 'cur'); S.next(nx); }); }
      phase = 'judge'; paint(); setTask();
    };
    const child = inc => {
      const k = cur.k, s = cur.s + (inc ? w[k] : 0), r = cur.r - w[k];
      const nd = mk(s, k + 1, r, cur, inc), pid = cur.id; cur.kids.push(nd); cur = nd; visited++;
      { const id = nd.id, str = nd.shown ? lab(nd) : `?,${nd.k},${nd.r}`, hide = !nd.shown, nx = k + 1 < n ? k + 1 : -1;
        V(async () => { S.style(pid, 'live'); S.hide = hide; await S.put(k, inc ? 'pan' : 'aside', ms()); await S.node(id, pid, inc, str, ms() / 2); S.next(nx); }); }
      if (typeS) { phase = 'type'; paint(); setTask(); extra.innerHTML = ''; extra.append(UI.ask('\\(s = \\)', v => typed(v))); }
      else { phase = 'judge'; paint(); setTask(); }
    };
    const typed = v => {
      const p = cur.parent;
      if (!UI.same(v, cur.s)) return ctx.bad(cur.inc ? `Including \\(w_{${cur.k}}\\) adds it: \\(s = ${p.s} + ${w[cur.k - 1]} = ${cur.s}\\).` : `Excluding \\(w_{${cur.k}}\\) keeps the sum: \\(s = ${p.s}\\). Only \\(r\\) drops to \\(${p.r} - ${w[cur.k - 1]} = ${cur.r}\\).`);
      cur.shown = true; extra.innerHTML = ''; phase = 'judge';
      { const id = cur.id, str = lab(cur); V(() => { S.hide = false; S.signs(); S.style(id, 'cur', str); }); }
      ctx.good(`\\(s = ${cur.s}\\), \\(r = ${p.r} - ${w[cur.k - 1]} = ${cur.r}\\).`, 4);
      paint(); setTask();
    };
    const act = v => {
      if (ctx.busy || phase !== 'judge') return;
      const e = expect(), nd = cur;
      if (v !== e) {
        if (e === 'bound') return ctx.bad(`This node is not promising: ${boundWhy(nd)} Press <b>Bound!</b>, its whole subtree is skipped.`);
        if (e === 'sol') return ctx.bad(`\\(s = ${nd.s} = W\\): this is an <b>answer node</b>. Record {${chosen(nd).join(', ')}} and stop here (going deeper can only add more weight).`);
        if (v === 'bound') return ctx.bad(`Both tests pass: \\(s + r = ${nd.s + nd.r} \\ge ${W}\\) and \\(s + w_{${nd.k + 1}} = ${nd.s + w[nd.k]} \\le ${W}\\). The node is promising, so it must be expanded.`);
        if (v === 'sol') return ctx.bad(`\\(s = ${nd.s} \\ne ${W}\\), so this is not an answer node yet.`);
        if (e === 'inc') return ctx.bad(`Depth-first order: the <b>left child (include \\(w_{${nd.k + 1}} = ${w[nd.k]}\\))</b> is explored first, the exclude branch after it.`);
        return ctx.bad(`The include branch of this node is already done. Now take the <b>right child</b>: exclude \\(w_{${nd.k + 1}} = ${w[nd.k]}\\).`);
      }
      if (v === 'bound') {
        nd.state = 'dead'; pruned++;
        V(() => S.drop(nd.id, ms() * .8));
        ctx.good(`Bounded \\((${nd.s}, ${nd.k}, ${nd.r})\\): ${boundWhy(nd)}`);
        return climb();
      }
      if (v === 'sol') {
        nd.state = 'ans'; sols.push(chosen(nd));
        for (let p = nd; p; p = p.parent) p.hasAns = true;
        { const str = '{' + chosen(nd).join(', ') + '}'; V(async () => { S.style(nd.id, 'ans'); await S.answer(str); }); }
        ctx.good(`Answer node: {${chosen(nd).join(', ')}} sums to ${W}.`, 20);
        return climb();
      }
      nd.judged = true;
      if (v === 'inc') { ctx.good(`Include \\(w_{${nd.k + 1}} = ${w[nd.k]}\\) → \\(s = ${nd.s + w[nd.k]}\\).`, 6); child(true); }
      else { ctx.good(`Exclude \\(w_{${nd.k + 1}} = ${w[nd.k]}\\) → \\(s\\) stays ${nd.s}.`, 6); child(false); }
    };
    const finish = () => {
      phase = 'end'; cur = root; paint();
      V(() => { S.close(root.id, root.hasAns); S.next(-1); });
      ctx.task('Search finished: the whole state-space tree has been explored.');
      const ss = sols.map(s => `\\(\\{${s.join(', ')}\\}\\)`).join(', ');
      ctx.done(`\\(S = (${w.join(', ')})\\), \\(W = ${W}\\) (sorted ascending, total ${total}).<br>Solution subset${sols.length > 1 ? 's' : ''}: <b>${ss || 'none'}</b>` +
        `<br>Nodes visited: ${visited} of ${2 ** (n + 1) - 1} in the full tree (${pruned} bounded). Worst case \\(O(2^n)\\).`);
    };
    paint(); setTask();
    return {
      hint: () => {
        if (phase === 'type') return cur.inc ? 'Include: add the weight to the parent\'s s.' : 'Exclude: s is unchanged.';
        const e = expect();
        return e === 'bound' ? `Test \\(s + r \\ge W\\) and \\(s + w_{next} \\le W\\). One of them fails.` : e === 'sol' ? '\\(s = W\\). What kind of node is that?' : e === 'inc' ? 'Promising node: go left first.' : 'Left subtree done: go right.';
      },
      demoStep() {
        if (phase === 'type') extra.querySelector('.ask').submit(String(cur.s));
        else if (phase === 'judge') btns.pick(expect());
      },
    };
  },
});

window.__texReady=()=>tex(document.body);if(window.renderMathInElement)tex(document.body);
</script>
</body>
</html>
