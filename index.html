      let locked = true;
      const F = floor3d(W, labels.map((l, k) => k === g ? l + ' ?' : l), Math.max(1, ...cnts), { q: g, board: `N = ${N}` });
      W.click(F.bot, () => { if (!locked) runTo(pos + 1, 0); });
      W.fit({ pad: .88 });

      let pos = 0, runId = 0, phase = 'inner';
      const apply = (e, ms) => {
        lines.forEach((l, k) => l.classList.toggle('cur', k === e.ln));
        vars.innerHTML = ''; for (const [k, v] of Object.entries(e.v)) vars.append(H('span', { class: 'kv' }, k + ' = ', H('b', {}, v)));
        vars.append(H('span', { class: 'kv' }, 'N = ', H('b', {}, N)));
        cntEl.textContent = e.c;
        W.setText(F.say, Object.entries(e.v).map(([k, v]) => k + '=' + v).join('  '));
        if (e.body) { const r = fill[e.grp]++; F.light(e.grp, r, e.grp === g ? QLIT : LIT); F.goto(e.grp, r, ms); W.setText(F.board, `yellow line ran ${e.c}×`); }
      };
      const label = k => {
        if (labeled.has(k)) return; labeled.add(k);
        W.setText(F.rowCnt[k], String(cnts[k])); W.setText(F.rowLab[k], labels[k]);
        doneEl.innerHTML = [...labeled].sort((x, y) => x - y).map(x => `${labels[x]}: <b>${cnts[x]}</b>`).join(' · ');
      };
      const reset = () => {
        runId++; pos = 0; cntEl.textContent = '0'; vars.innerHTML = '';
        fill.fill(0); labeled.clear(); doneEl.innerHTML = ''; F.clear(); F.goto(0, 0, 0); W.setText(F.board, `N = ${N}`);
        lines.forEach(l => l.classList.remove('cur'));
        runTo(trace.length);
      };
      async function runTo(to, ms) {
        const id = ++runId; to = Math.min(to, trace.length);
        if (ms == null) ms = Math.max(12, Math.min(200, 1600 / Math.max(1, to - pos)));
        while (pos < to) {
          if (id !== runId) return;
          const e = trace[pos++]; apply(e, ms);
          if (e.grp >= 0 && (pos === trace.length || trace[pos].grp !== e.grp)) label(e.grp);
          if (!ctx.test && ms) await Game.wait(ms);
        }
      }
      const lockFree = on => { locked = on; [bStep, bRun, bReset].forEach(b => b.disabled = on); };

      const numPick = (x, onPick) => {
        const set = new Set([x]); const cand = [x + 1, x - 1, x + 2, x * 2, x - 2, Math.round(x / 2)].filter(v => v >= 0);
        for (const v of cand) { if (set.size >= 4) break; set.add(v); }
        return UI.choices(R.shuffle([...set]).map(v => ({ label: String(v), value: String(v) })), onPick);
      };
      const askNum = (label, x, onSubmit) => { extra.innerHTML = ''; extra.append(easy ? numPick(x, v => onSubmit(v)) : UI.ask(label, onSubmit)); };
      const askPick = (opts, right, onPick) => {
        extra.innerHTML = '';
        extra.append(UI.choices(R.shuffle(opts).map(o => ({ label: T(o), value: o })), v => onPick(v === right, v)));
      };
      const lab = labels[g];
      const step = () => {
        lockFree(phase === 'inner' || phase === 'total');
        if (phase === 'inner') {
          ctx.task(P.seq ? `Loop 1 has run. Predict: how many times will the yellow line of <b>loop 2</b> run? (N = ${N})`
            : `The first ${g} row${g > 1 ? 's are' : ' is'} done. Predict: when \\(${lab.replace('=', ' = ')}\\), how many times does the yellow line run?`);
          askNum('runs =', cnts[g], v => {
            if (!UI.same(v, cnts[g])) return ctx.bad(`Not ${v}. ${P.why(N, g)}`);
            ctx.good(`Yes, ${cnts[g]} runs. Watch it happen.`);
            runTo(endOf(g)); phase = 'gen'; step();
          });
        } else if (phase === 'gen') {
          ctx.task(P.seq ? 'In terms of \\(N\\), loop 2 runs how many times?' : 'In general, for any \\(i\\), the inner loop runs how many times?');
          askPick(P.gen, P.gen[0], (ok, v) => {
            if (!ok) return ctx.bad(`\\(${v}\\) does not fit. ${P.why(N, g)} In general: \\(${P.gen[0]}\\).`);
            ctx.good(`Right: \\(${P.gen[0]}\\).`); phase = 'total'; step();
          });
        } else if (phase === 'total') {
          ctx.task(`Predict the counter at the end: how many times does the yellow line run <b>in total</b> for \\(N = ${N}\\)?`);
          askNum('total =', total, v => {
            if (!UI.same(v, total)) return ctx.bad(`Add the rows: \\(${cnts.join(' + ')} = ${total}\\). ${P.sumWhy}`);
            ctx.good(`Total \\(= ${cnts.join(' + ')} = ${total}\\). Running the rest…`);
            runTo(trace.length); phase = 'sum'; step();
          });
        } else if (phase === 'sum') {
          ctx.task('Which formula gives that total for <b>any</b> \\(N\\)?');
          askPick(P.sum, P.sum[0], (ok, v) => {
            if (!ok) return ctx.bad(`${P.sumWhy} So the total is \\(${P.sum[0]}\\). (Check: with \\(N = ${N}\\) it gives ${total}.)`);
            ctx.good(`\\(${P.sum[0]}\\). ${P.sumWhy}`); phase = 'theta'; step();
          });
        } else if (phase === 'theta') {
          ctx.task('So the <b>time</b> complexity is…');
          extra.innerHTML = ''; extra.append(UI.choices(THETA, v => {
            if (v !== P.th) return ctx.bad(`Keep only the biggest term of \\(${P.sum[0]}\\) and drop constants: it is <b>${P.th}</b>.`);
            ctx.good(`${P.th}: the biggest term of the count wins.`); phase = 'space'; step();
          }));
        } else if (phase === 'space') {
          ctx.task('And the <b>space</b> complexity (extra memory)?');
          extra.innerHTML = ''; extra.append(UI.choices(['O(1)', 'O(log N)', 'O(N)', 'O(N²)'], v => {
            if (v !== 'O(1)') return ctx.bad(`Space counts memory, not steps. The code only uses a few single variables (${t === 'tridown' ? 'a' : 's'}, i, j, N), whatever \\(N\\) is, so it is <b>O(1)</b>.`);
            ctx.good('O(1): a fixed handful of variables, no arrays.'); finish();
          }));
        }
      };
      const finish = () => {
        phase = 'end'; extra.innerHTML = ''; lockFree(false); runTo(trace.length, 0);
        const per = P.seq ? `Loop 1 runs \\(N\\) times, loop 2 runs \\(${P.gen[0]}\\) times.` : `For each outer value the inner line runs \\(${P.gen[0]}\\) times.`;
        ctx.done(`${per}<br>Total \\(= ${P.sum[0]}\\) (for \\(N = ${N}\\): ${total}).<br><b>Time ${P.th.replace('Θ', 'O')}</b>, i.e. ${P.th}; <b>space O(1)</b>.`);
      };

      runTo(startOf(g), ctx.test ? 0 : undefined);
      step();
      return {
        hint: () => ({
          inner: P.why(N, g), gen: P.why(N, g), total: `Add the row counts: \\(${cnts.join(' + ')}\\).`,
          sum: P.sumWhy, theta: `Biggest term of \\(${P.sum[0]}\\).`, space: 'Are there any arrays that grow with N?',
        })[phase],
        demoStep() {
          const ch = extra.querySelector('.choices'), ask = extra.querySelector('.ask');
          const ans = { inner: cnts[g], gen: P.gen[0], total, sum: P.sum[0], theta: P.th, space: 'O(1)' }[phase];
          if (ans == null) return;
          if (ask) ask.submit(String(ans)); else if (ch) ch.pick(String(ans));
        },
      };
    },
  });
})();

/* ==== u2_master.js ==== */
/* Unit 2 · Master Theorem (a, b, k, p form taught in the course) with a per-level cost picture */
(() => {
  const H = UI.h;
  document.head.append(H('style', {}, `
.master-rec{font-size:20px;margin-bottom:6px}
.master-params{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.master-params .kv{min-width:70px;justify-content:center}
.master-params .kv.q b{color:var(--mut)}
.master-cap{margin-top:8px;font-size:14px}
`));
  const lgb = (a, b) => Math.log(a) / Math.log(b);
  const isInt = x => Math.abs(x - Math.round(x)) < 1e-9;
  const nk = k => k === 0 ? '' : k === 1 ? 'n' : `n^{${k}}`;
  const logp = p => p === 0 ? '' : `\\log${p === 1 ? '' : '^{' + p + '}'} n`;
  const poly = (k, p) => {          // n^k log^p n  (p may be negative)
    if (p >= 0) { const s = [nk(k), logp(p)].filter(Boolean).join(' '); return s || '1'; }
    return `\\frac{${nk(k) || '1'}}{${logp(-p)}}`;
  };
  const expTex = (a, b) => { const L = lgb(a, b); return isInt(L) ? (Math.round(L) === 0 ? '1' : nk(Math.round(L))) : `n^{\\log_{${b}} ${a}}`; };
  const answer = ({ a, b, k, p }) => {
    const L = lgb(a, b), eq = Math.abs(L - k) < 1e-9;
    if (!eq && L > k) return { cs: 1, cmp: 'gt', tex: `\\Theta(${expTex(a, b)})`, why: `\\(\\Theta(n^{\\log_b a})\\)` };
    if (eq) {
      if (p > -1) return { cs: 2, cmp: 'eq', tex: `\\Theta(${poly(k, p + 1)})`, why: `\\(p = ${p} \\gt -1\\) → \\(\\Theta(n^k \\log^{p+1} n)\\)` };
      if (p === -1) return { cs: 2, cmp: 'eq', tex: `\\Theta(${[nk(k), '\\log \\log n'].filter(Boolean).join(' ')})`, why: '\\(p = -1\\) → \\(\\Theta(n^k \\log\\log n)\\)' };
      return { cs: 2, cmp: 'eq', tex: `\\Theta(${nk(k) || '1'})`, why: `\\(p = ${p} \\lt -1\\) → \\(\\Theta(n^k)\\)` };
    }
    if (p >= 0) return { cs: 3, cmp: 'lt', tex: `\\Theta(${poly(k, p)})`, why: `\\(p = ${p} \\ge 0\\) → \\(\\Theta(n^k \\log^p n)\\)` };
    return { cs: 3, cmp: 'lt', tex: `O(${nk(k) || '1'})`, why: `\\(p = ${p} \\lt 0\\) → \\(O(n^k)\\)` };
  };

  /* ---- 3D: the company on a staircase. Step i holds the a^i people of level i (boss on top, leaves at the bottom);
     the bar on the right of each step is the total work done on that level. ---- */
  const LVC = ['#5b6ee1', '#2fa8a0', '#e8962e', '#b56bd6', '#3d9be9', '#7cc25b'];
  const office3d = (W, rows, o = {}) => {
    const Rn = rows.length, SD = 1.6, RH = .8, SW = 9, BL = 5.5, MAXF = 10;
    const topY = i => (Rn - 1 - i) * RH + .3, Z = i => (i - (Rn - 1) / 2) * SD;
    const left = -SW / 2 - .4, bx = SW / 2 + .9, right = bx + BL + .6;
    const O = { figs: [], links: [], bars: [], barLab: [], rowLab: [], steps: [] };
    let prevX = [];
    rows.forEach((r, i) => {
      const onClick = o.onRow ? () => o.onRow(i) : null;
      O.steps[i] = W.box({ w: right - left, h: topY(i), d: SD, x: (left + right) / 2, z: Z(i), color: i % 2 ? '#d3dfe7' : '#e6edf2', r: .05, onClick });
      const shown = Math.min(r.count, MAXF), sp = Math.min(1.3, (SW - 1.6) / shown), sc = Math.max(.9, 1.5 - .12 * i), col = r.leaf ? '#e2557a' : LVC[i % LVC.length];
      const xs = [], figs = [], links = [];
      for (let j = 0; j < shown; j++) {
        const x = (j - (shown - 1) / 2) * sp - (r.count > shown ? .5 : 0); xs.push(x);
        const g = W.group({ x, y: topY(i), z: Z(i) }); g.scale.set(sc, sc, sc);
        W.cyl({ parent: g, r: .25, rTop: .17, h: .62, y: .31, color: col });
        W.ball({ parent: g, r: .2, y: .8, color: '#f2c9a0' });
        if (i === 0) W.cone({ parent: g, r: .17, h: .24, y: 1.1, color: '#ffc53d' });
        if (onClick) W.click(g, onClick);
        figs.push(g);
        if (i > 0) { const p = Math.min(prevX.length - 1, Math.floor(j / (o.a || 2))); links.push(W.link({ x: prevX[p], y: topY(i - 1) + .25, z: Z(i - 1) + .45 }, { x, y: topY(i) + 1.02 * sc, z: Z(i) }, { r: .03, color: '#7d93a5' })); }
      }
      if (r.count > shown) W.text('+' + (r.count - shown), { x: xs[shown - 1] + 1.15, y: topY(i) + .5, z: Z(i), size: .62, color: '#12283a' });
      prevX = xs; O.figs[i] = figs; O.links[i] = links;
      O.rowLab[i] = W.text(r.label, { x: left - 2.6, y: topY(i) + .5, z: Z(i), size: .72, bg: '#ffffff', color: '#12283a' });
      const b = O.bars[i] = W.group({ x: bx, y: topY(i), z: Z(i) }); b.scale.x = .02; b.visible = false;
      W.box({ parent: b, w: 1, h: .55, d: 1, x: .5, y: .275, color: r.leaf ? '#e2557a' : '#2fa8a0', r: .02 });
      O.barLab[i] = W.text('', { x: bx + 2.2, y: topY(i) + 1.15, z: Z(i), size: .66, bg: '#ffffff', color: '#12283a' });
    });
    O.board = W.text(o.board || '', { x: 0, y: topY(0) + 3.1, z: Z(0), size: .85, bg: '#12283a', color: '#ffffff' });
    O.setBar = (i, frac, txt, ms = 600) => { O.bars[i].visible = true; W.setText(O.barLab[i], txt); return W.to(O.bars[i].scale, { x: Math.max(.03, frac * BL) }, ms); };
    O.win = (i, on) => W.paint(O.bars[i], on ? '#ffc53d' : rows[i].leaf ? '#e2557a' : '#2fa8a0', 200);
    O.showRow = (i, on) => { for (const g of O.figs[i]) g.visible = on; for (const l of O.links[i]) l.visible = on; O.rowLab[i].visible = on; };
    return O;
  };

  Game.level({
    id: 'master', unit: 2, order: 40, icon: '👑', title: 'Master Theorem', tag: 'Recurrences · compare log_b a with k',
    scene: 'A boss splits the job among helpers: which level of the company does most of the work?',
    intro: `<ol><li>Match \\(T(n) = aT(n/b) + f(n)\\): read \\(a\\) and \\(b\\).</li><li>Write \\(f(n) = \\Theta(n^k \\log^p n)\\): read \\(k\\) and \\(p\\).</li><li>Compute \\(\\log_b a\\) and compare with \\(k\\) (test "=" first).</li><li>Case 1: leaves win. Case 2: every level equal, add a log. Case 3: root wins.</li></ol>`,
    story(W) {
      const O = office3d(W, [{ count: 1, label: 'Priya: 1 job of 8' }, { count: 2, label: '2 helpers × 4' }, { count: 4, label: '4 helpers × 2' }, { count: 8, label: '8 cooks × 1', leaf: 1 }], { a: 2, board: 'T(n) = 2T(n/2) + n' });
      for (let i = 1; i < 4; i++) O.showRow(i, false);
      W.fit({ pad: 1.05 });
      const reveal = async i => { O.showRow(i, true); for (const g of O.figs[i]) W.drop(g, 3, 400); await Game.wait(500); };
      const bars = async (vals, txt) => { const m = Math.max(...vals); for (let i = 0; i < 4; i++) { O.win(i, false); O.setBar(i, vals[i] / m, txt(i, vals[i]), 600); } await Game.wait(750); };
      const cnt = [1, 2, 4, 8], size = [8, 4, 2, 1];
      return [
        { text: 'Priya runs a catering team. An order for \\(n = 8\\) dishes arrives. She splits it between \\(a = 2\\) helpers, who get \\(n/b = 8/2 = 4\\) dishes each, and the splitting costs her \\(f(n) = n = 8\\) minutes: \\(T(n) = 2T(n/2) + n\\).',
          run: async () => { await W.pop(O.figs[0][0]); await reveal(1); await O.setBar(0, 1, '1 × 8 = 8'); } },
        { text: 'Every helper does the same with their share. Level 1 costs \\(2 \\times 4 = 8\\) minutes, level 2 costs \\(4 \\times 2 = 8\\), and the 8 cooks at the bottom just cook: \\(8 \\times 1 = 8\\).',
          run: async () => { O.setBar(1, 1, '2 × 4 = 8'); await reveal(2); O.setBar(2, 1, '4 × 2 = 8'); await reveal(3); await O.setBar(3, 1, '8 × 1 = 8'); } },
        { text: 'Every level costs the same. That happens when \\(\\log_b a = k\\): here \\(\\log_2 2 = 1\\) and \\(f(n) = n^1\\). This is <b>Case 2</b>: one level × number of levels \\(= n \\times \\log n\\), so \\(T(n) = \\Theta(n \\log n)\\).',
          run: async () => { W.setText(O.board, 'log₂2 = 1 = k   →   Case 2: Θ(n log n)'); for (let i = 0; i < 4; i++) { O.win(i, true); await Game.wait(200); } } },
        { text: 'Now make splitting quick: \\(f(n) = 1\\), so \\(k = 0\\). The levels cost \\(1, 2, 4, 8\\): the crowd of <b>leaves</b> does most of the work. \\(\\log_b a = 1 \\gt k = 0\\) is <b>Case 1</b>: \\(T(n) = \\Theta(n^{\\log_b a}) = \\Theta(n)\\).',
          run: async () => { W.setText(O.board, 'T(n) = 2T(n/2) + 1'); await bars([1, 2, 4, 8], (i, v) => `${cnt[i]} × 1 = ${v}`); O.win(3, true); W.setText(O.board, 'log₂2 = 1 > k = 0   →   Case 1: Θ(n)'); } },
        { text: 'Now make splitting slow: \\(f(n) = n^2\\), so \\(k = 2\\). The levels cost \\(64, 32, 16, 8\\): the <b>root</b> does most of the work. \\(\\log_b a = 1 \\lt k = 2\\) is <b>Case 3</b>: \\(T(n) = \\Theta(n^k) = \\Theta(n^2)\\).',
          run: async () => { W.setText(O.board, 'T(n) = 2T(n/2) + n²'); await bars([64, 32, 16, 8], (i, v) => i < 3 ? `${cnt[i]} × ${size[i]}² = ${v}` : '8 × 1 = 8'); O.win(0, true); W.setText(O.board, 'log₂2 = 1 < k = 2   →   Case 3: Θ(n²)'); } },
        { text: 'The recipe: read \\(a, b\\) and write \\(f(n) = n^k \\log^p n\\). Compare \\(\\log_b a\\) with \\(k\\). Greater: \\(\\Theta(n^{\\log_b a})\\). Equal: \\(\\Theta(n^k \\log^{p+1} n)\\). Smaller: \\(\\Theta(n^k \\log^p n)\\).',
          run: async () => { W.setText(O.board, 'compare  log_b a  with  k'); await W.pop(O.figs[0][0]); } },
      ];
    },
    formula: `\\[T(n) = aT(n/b) + \\Theta(n^k \\log^p n)\\]<ul><li>\\(\\log_b a \\gt k\\): \\(\\Theta(n^{\\log_b a})\\)</li><li>\\(\\log_b a = k\\): \\(p \\gt -1\\): \\(\\Theta(n^k\\log^{p+1} n)\\); \\(p = -1\\): \\(\\Theta(n^k \\log\\log n)\\); \\(p \\lt -1\\): \\(\\Theta(n^k)\\)</li><li>\\(\\log_b a \\lt k\\): \\(p \\ge 0\\): \\(\\Theta(n^k \\log^p n)\\); \\(p \\lt 0\\): \\(O(n^k)\\)</li></ul>`,
    exam: { a: 3, b: 4, k: 2, p: 0 },
    examSrc: '2025 Final Q2a · T(n) = 3T(n/4) + n²',
    make(r, d) {
      for (let t = 0; t < 300; t++) {
        const cs = r.pick([1, 2, 3]), b = r.pick([2, 2, 3, 4]);
        const p = d === 3 ? r.pick([0, 0, 1, -1, -2]) : d === 2 ? r.pick([0, 0, 0, 1]) : 0;
        let a, k;
        if (cs === 2) { k = r.int(0, 2); a = b ** k; }
        else if (cs === 1) { k = r.int(0, d === 1 ? 1 : 2); a = r.int(b ** k + 1, b ** k + 6); }
        else { k = r.int(1, d === 1 ? 2 : 3); a = r.int(1, Math.min(9, b ** k - 1)); }
        if (a > 16 || a < 1 || (cs === 1 && p !== 0)) continue;
        return { a, b, k, p };
      }
      return { a: 2, b: 2, k: 1, p: 0 };
    },
    mount(ctx) {
      const { a, b, k, p } = ctx.inst, R = ctx.rng, easy = ctx.diff === 1;
      const L = lgb(a, b), ans = answer(ctx.inst), ft = poly(k, p);
      const rec = `T(n) = ${a === 1 ? '' : a}T(n/${b}) + ${ft}`;
      const pv = { a: '?', b: '?', k: '?', p: '?', L: '?' };
      const params = H('div', { class: 'master-params' });
      const paintP = () => {
        params.innerHTML = '';
        [['a', 'a'], ['b', 'b'], ['k', 'k'], ['p', 'p'], ['L', 'log_b a']].forEach(([key, lab]) => params.append(H('span', { class: 'kv' + (pv[key] === '?' ? ' q' : '') }, lab + ' = ', H('b', {}, pv[key]))));
      };
      /* per-level costs for n = b^D */
      const D = 5, nn = b ** D, fv = m => m ** k * (p ? Math.log2(m) ** p : 1);
      const lev = []; for (let i = 0; i < D; i++) lev.push({ nodes: a ** i, size: b ** (D - i), cost: a ** i * fv(b ** (D - i)) });
      lev.push({ nodes: a ** D, size: 1, cost: a ** D, leaf: 1 });
      const maxC = Math.max(...lev.map(x => x.cost));
      /* 3D company staircase */
      const W = ctx.world;
      const O = office3d(W, lev.map((lv, i) => ({ count: lv.nodes, leaf: lv.leaf, label: lv.leaf ? `leaves: ${lv.nodes} × 1` : `L${i}: ${lv.nodes} × size ${lv.size}` })),
        { a, board: `n = ${b}^${D} = ${nn}`.replace('^5', '⁵'), onRow: i => { if (phase !== 'case') return; const ch = extra.querySelector('.choices'); ch && ch.pick(i === 0 ? '3' : i === lev.length - 1 ? '1' : '2'); } });
      W.fit({ pad: .92 });
      const cap = H('div', { class: 'master-cap' });
      const showBars = () => lev.forEach((lv, i) => {
        O.setBar(i, lv.cost / maxC, UI.fmt(lv.cost, 0) + (i ? `  (×${(r => r >= .001 ? UI.fmt(r, 3) : r.toExponential(1))(lv.cost / lev[0].cost)})` : '  (root)'));
      });
      const extra = H('div');
      ctx.el.append(H('div', { class: 'master-rec', html: `\\(${rec}\\)` }), params, extra, cap);
      UI.tex(ctx.el); paintP();
      if (easy) showBars();

      let phase = 'a';
      const ratio = a / b ** k;
      const ask = (label, right, onOk, wrongMsg, choices) => {
        extra.innerHTML = '';
        const cb = v => { if (!UI.same(v, right)) return ctx.bad(wrongMsg(v)); onOk(); };
        extra.append(choices ? UI.choices(choices.map(c => ({ label: String(c), value: String(c) })), cb) : UI.ask(label, cb));
      };
      const step = () => {
        if (phase === 'a') {
          ctx.task('Match \\(T(n) = aT(n/b) + f(n)\\). How many recursive calls, \\(a\\)?');
          ask('\\(a =\\)', a, () => { pv.a = a; paintP(); ctx.good(`\\(a = ${a}\\): ${a} subproblem${a > 1 ? 's' : ''} per call (count the helpers one step below the boss).`); phase = 'b'; step(); },
            v => `\\(a\\) is the number in front of \\(T\\): \\(${a === 1 ? '1 (nothing written means 1)' : a}\\), not ${v}.`, easy ? R.shuffle([a, b, a + 1, k + 1].filter((x, i, s) => s.indexOf(x) === i)) : null);
        } else if (phase === 'b') {
          ctx.task('By what factor does the input shrink, \\(b\\)?');
          ask('\\(b =\\)', b, () => { pv.b = b; paintP(); ctx.good(`\\(b = ${b}\\): each subproblem has size \\(n/${b}\\).`); phase = 'k'; step(); },
            v => `\\(b\\) is the divisor inside: \\(T(n/${b})\\), so \\(b = ${b}\\).`, easy ? R.shuffle([b, a, b + 1, 2 * b].filter((x, i, s) => s.indexOf(x) === i)) : null);
        } else if (phase === 'k') {
          ctx.task(`Write \\(f(n) = ${ft}\\) as \\(n^k \\log^p n\\). What is \\(k\\)?`);
          ask('\\(k =\\)', k, () => { pv.k = k; paintP(); ctx.good(`\\(k = ${k}\\)${k === 0 ? ' (a constant is \\(n^0\\))' : ''}.`); phase = 'p'; step(); },
            () => `\\(k\\) is the power of \\(n\\) in \\(f(n) = ${ft}\\): \\(k = ${k}\\).${k === 0 ? ' A constant is \\(n^0\\).' : ''}`, easy ? [0, 1, 2, 3] : null);
        } else if (phase === 'p') {
          ctx.task(`And \\(p\\), the power of \\(\\log n\\) in \\(f(n) = ${ft}\\)?`);
          ask('\\(p =\\)', p, () => { pv.p = p; paintP(); ctx.good(`\\(p = ${p}\\)${p === 0 ? ' (no log factor)' : p < 0 ? ' (the log is in the denominator)' : ''}.`); phase = 'L'; step(); },
            () => `No \\(\\log\\) means \\(p = 0\\); \\(\\log n\\) on top means \\(p = 1\\); \\(1/\\log n\\) means \\(p = -1\\). Here \\(p = ${p}\\).`, easy ? [0, 1, -1, 2] : null);
        } else if (phase === 'L') {
          ctx.task(`Compute \\(\\log_b a = \\log_{${b}} ${a}\\) (2 decimals are fine).`);
          ask('\\(\\log_b a =\\)', L, () => {
            pv.L = UI.fmt(L, 3); paintP(); showBars();
            ctx.good(`\\(\\log_{${b}} ${a} = ${isInt(L) ? Math.round(L) : `\\frac{\\ln ${a}}{\\ln ${b}} \\approx ${UI.fmt(L, 3)}`}\\). Look at the bars beside the steps: each level is \\(a/b^k = ${a}/${b ** k}${isInt(ratio) ? '' : ' \\approx ' + UI.fmt(ratio, 3)}\\) times the one above.`);
            phase = 'cmp'; step();
          }, () => `\\(\\log_{${b}} ${a} = \\frac{\\ln ${a}}{\\ln ${b}} = ${UI.fmt(L, 3)}\\)${isInt(L) ? ` because \\(${b}^{${Math.round(L)}} = ${a}\\)` : ''}.`,
            easy ? R.shuffle([UI.fmt(L, 3), UI.fmt(L + 1, 3), UI.fmt(b / a, 3), UI.fmt(L / 2 + .25, 3)].filter((x, i, s) => s.indexOf(x) === i)) : null);
        } else if (phase === 'cmp') {
          ctx.task(`Compare \\(\\log_b a = ${UI.fmt(L, 3)}\\) with \\(k = ${k}\\).`);
          extra.innerHTML = '';
          extra.append(UI.choices([{ label: '\\(\\log_b a \\gt k\\)', value: 'gt' }, { label: '\\(\\log_b a = k\\)', value: 'eq' }, { label: '\\(\\log_b a \\lt k\\)', value: 'lt' }], v => {
            if (v !== ans.cmp) return ctx.bad(`\\(${UI.fmt(L, 3)}\\) vs \\(${k}\\): it is <b>${{ gt: 'greater', eq: 'equal', lt: 'smaller' }[ans.cmp]}</b>. ${ans.cmp === 'eq' ? 'Always test "=" before "&gt;": the notes once wrote \\(2 \\gt 2\\) and had to correct it.' : ''}`);
            ctx.good(`\\(${UI.fmt(L, 3)} ${{ gt: '\\gt', eq: '=', lt: '\\lt' }[ans.cmp]} ${k}\\).`); phase = 'case'; step();
          }));
        } else if (phase === 'case') {
          ctx.task('Which case is it? The bars show who does the most work. (You can also click the top step, a middle step or the bottom step.)');
          extra.innerHTML = '';
          extra.append(UI.choices([{ label: 'Case 1: leaves dominate', value: '1' }, { label: 'Case 2: every level equal', value: '2' }, { label: 'Case 3: root dominates', value: '3' }], v => {
            if (+v !== ans.cs) return ctx.bad(`\\(\\log_b a ${{ gt: '\\gt', eq: '=', lt: '\\lt' }[ans.cmp]} k\\) is <b>Case ${ans.cs}</b>. Each level is \\(a/b^k = ${UI.fmt(ratio, 3)}\\) times the level above: ${ratio > 1 ? 'growing, so the leaves win' : ratio === 1 ? 'the same on every level, so (number of levels) × (one level)' : 'shrinking, so the root wins'}.`);
            const win = ans.cs === 1 ? lev.length - 1 : ans.cs === 3 ? 0 : -1;
            lev.forEach((_, i) => O.win(i, win < 0 || i === win));
            cap.innerHTML = ans.cs === 1 ? '🍃 The <b>leaves</b> do most of the work: the cost grows level after level, so the bottom (\\(n^{\\log_b a}\\) leaves) dominates.'
              : ans.cs === 2 ? '⚖️ <b>Every level</b> costs about the same, so the total is one level × the number of levels (\\(\\log n\\)): that is the extra log.'
                : '🌳 The <b>root</b> does most of the work: each level is a fraction of the one above, so the top term \\(f(n)\\) dominates (a shrinking geometric series).';
            UI.tex(cap);
            ctx.good(`Case ${ans.cs}.`); phase = 'ans'; step();
          }));
        } else if (phase === 'ans') {
          ctx.task(`So \\(T(n) = \\;?\\)${ans.cs > 1 ? ' (check the sign of \\(p\\))' : ''}`);
          const pool = [ans.tex, `\\Theta(${poly(k, 0)})`, `\\Theta(${poly(k, 1)})`, `\\Theta(${expTex(a, b)})`, `\\Theta(${poly(k, p + 1)})`, `\\Theta(${poly(k + 1, 0)})`, `\\Theta(${poly(k, p)})`, `\\Theta(n \\log n)`];
          const opts = [...new Set(pool)].slice(0, 4);
          extra.innerHTML = '';
          extra.append(UI.choices(R.shuffle(opts).map(o => ({ label: `\\(${o}\\)`, value: o })), v => {
            if (v !== ans.tex) return ctx.bad(`Case ${ans.cs}: ${ans.why}. Plug in \\(k = ${k}\\), \\(p = ${p}\\)${ans.cs === 1 ? `, \\(\\log_b a = ${UI.fmt(L, 3)}\\)` : ''}: \\(T(n) = ${ans.tex}\\).`);
            ctx.good(`\\(T(n) = ${ans.tex}\\).`); finish();
          }));
        }
      };
      const finish = () => {
        phase = 'end'; extra.innerHTML = '';
        const sym = { gt: '\\gt', eq: '=', lt: '\\lt' }[ans.cmp];
        ctx.done(`\\(${rec}\\)<br>\\(a = ${a},\\ b = ${b},\\ k = ${k},\\ p = ${p}\\)<br>\\(\\log_{${b}} ${a} = ${UI.fmt(L, 3)} ${sym} ${k} = k\\) → <b>Case ${ans.cs}</b>${ans.cs > 1 ? ', ' + ans.why : ''}<br>\\(\\boxed{T(n) = ${ans.tex}}\\)`);
      };
      step();
      return {
        hint: () => ({ a: 'The number in front of T.', b: 'The divisor inside T( ).', k: 'Power of n in f(n).', p: 'Power of log n in f(n); none means 0.', L: `\\(\\ln ${a} / \\ln ${b}\\)`, cmp: `\\(${UI.fmt(L, 3)}\\) vs \\(${k}\\)`, case: 'Greater → 1, equal → 2, smaller → 3.', ans: ans.why })[phase],
        demoStep() {
          const v = { a, b, k, p, L: UI.fmt(L, 3), cmp: ans.cmp, case: String(ans.cs), ans: ans.tex }[phase];
          if (v == null) return;
          const ch = extra.querySelector('.choices'), as = extra.querySelector('.ask');
          if (as) as.submit(String(v)); else if (ch) ch.pick(String(v));
        },
      };
    },
  });
})();

/* ==== u2_rtree.js ==== */
/* Unit 2 · Recursion Tree: grow T(n) = aT(n/b) + n^k level by level and add up the levels */
(() => {
  const H = UI.h;
  document.head.append(H('style', {}, `
.rtree-wrap{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rtree-tbl{min-width:0;overflow-x:auto}
.rtree-tbl .grid td{min-width:58px;font-size:14px}
.rtree-tbl .grid td.sym{font-weight:500;min-width:84px}
.rtree-rec{font-size:19px;margin-bottom:8px}
`));
  const gcd = (x, y) => y ? gcd(y, x % y) : x;
  const nk = k => k === 0 ? '1' : k === 1 ? 'n' : `n^{${k}}`;
  /* level i total in terms of n: (a^i / b^{ik}) n^k */
  const symLevel = (a, b, k, i) => {
    const num = a ** i, den = b ** (i * k), g = gcd(num, den), N = num / g, Dn = den / g;
    const coef = Dn === 1 ? (N === 1 ? '' : String(N)) : `\\tfrac{${N}}{${Dn}}`;
    return k === 0 ? (Dn === 1 ? String(N) : `\\tfrac{${N}}{${Dn}}`) : coef + nk(k);
  };
  const theta = ({ a, b, k }) => {
    if (a < b ** k) return `\\Theta(${nk(k)})`;
    if (a === b ** k) return k === 0 ? '\\Theta(\\log n)' : `\\Theta(${k === 1 ? 'n' : nk(k)} \\log n)`;
    const L = Math.log(a) / Math.log(b);
    return Number.isInteger(Math.round(L * 1e9) / 1e9) ? `\\Theta(${nk(Math.round(L))})` : `\\Theta(n^{\\log_{${b}} ${a}})`;
  };

  /* ---- 3D: the recursion tree laid out on a counter. Row i = level i (root at the back); a block is one subproblem,
     labelled with its size. The bar on the right of a row is that level's total cost. ---- */
  const LVC = ['#5b6ee1', '#2fa8a0', '#e8962e', '#b56bd6', '#3d9be9'];
  const tree3d = (W, a, D, lab, o = {}) => {
    const leaves = a ** D, px = leaves > 16 ? .9 : leaves > 8 ? 1.05 : 1.7, LZ = leaves > 8 ? 1.9 : 2.3, BL = 4.5;
    const width = Math.max(3, (leaves - 1) * px), Z = i => (i - D / 2) * LZ;
    const side = i => .62 + (D ? .8 * (D - i) / D : .5);
    const X = (i, j) => { const span = a ** (D - i); return (j * span + (span - 1) / 2 - (leaves - 1) / 2) * px; };
    const left = -width / 2 - 3.4, bx = width / 2 + 1.5, right = bx + BL + .5;
    W.slab({ w: right - left, d: (D + 1) * LZ + .2, x: (left + right) / 2, color: '#e9d2b0', h: .3 });
    const T = { blocks: [], links: [], bars: [], barLab: [] };
    for (let i = 0; i <= D; i++) {
      const s = side(i), col = i === D ? '#e2557a' : LVC[i % LVC.length];
      T.blocks[i] = []; T.links[i] = [];
      for (let j = 0; j < a ** i; j++) {
        const b = W.box({ w: s, h: s * .6, d: s, x: X(i, j), z: Z(i), color: col, r: .08, label: lab(i), labelOpts: { size: leaves > 8 && i === D ? .56 : .7, dy: .42 } });
        b.visible = false; T.blocks[i].push(b);
        if (i > 0) { const l = W.link({ x: X(i - 1, Math.floor(j / a)), y: .07, z: Z(i - 1) }, { x: X(i, j), y: .07, z: Z(i) }, { r: .045, color: '#9a7648' }); l.visible = false; T.links[i].push(l); }
      }
      W.text(i === D ? `L${i} leaves` : 'L' + i, { x: left + 1.3, y: .45, z: Z(i), size: .75, bg: '#12283a', color: '#ffffff' });
      const g = T.bars[i] = W.group({ x: bx, z: Z(i) }); g.scale.x = .02; g.visible = false;
      W.box({ parent: g, w: 1, h: .55, d: 1.1, x: .5, y: .275, color: col, r: .02 });
      T.barLab[i] = W.text('', { x: bx + 2.2, y: 1.2, z: Z(i), size: .75, bg: '#ffffff', color: '#12283a' });
    }
    T.board = W.text(o.board || '', { x: 0, y: 3.2, z: Z(0) - .6, size: .85, bg: '#12283a', color: '#ffffff' });

        ctx.done(`Level costs: ${per}, …; depth \\(\\log_${b} n\\) (= ${D}), leaves \\(${a ** D}\\) × \\(T(1)\\).<br>${exact}\\(\\boxed{T(n) = ${TH}}\\)`);
      };

      return {
        hint: () => phase === 'levels' ? `Level ${asks[ai][0]}: ${lev[asks[ai][0]].nodes} nodes × ${lev[asks[ai][0]].cost} each.` : phase === 'depth' ? `How many times can you divide ${n} by ${b}?` : phase === 'sum' ? 'Add the "level total" column.' : 'Compare a with b^k.',
        demoStep() {
          const v = phase === 'levels' ? UI.fmt(cellVal(...asks[ai])) : phase === 'depth' ? String(D) : phase === 'sum' ? String(total) : phase === 'theta' ? TH : null;
          if (v == null) return;

          if (as) as.submit(v); else if (ch) ch.pick(v);
        },
      };
    },
  });
})();

  const stairs3d = (W, S, o) => {

    for (let j = 0; j <= S; j++) {
      if (j < S) W.box({ w: SP, h: top(j), d: DP, x: X(j), color: j % 2 ? '#d3dfe7' : '#e6edf2', r: .04 });
      W.text(o.arg(j), { x: X(j), y: j < S ? top(j) - .42 : .34, z: DP / 2 + (j < S ? .1 : .55), size: .62, bg: j < S ? '#12283a' : '#e2557a', color: '#ffffff' });
      const v = j < S ? o.terms[j] : o.base, h = hgt(v);
      const c = W.box({ w: 1.05, h, d: 1.05, x: X(j), y: top(j) + h / 2, z: -.6, color: j < S ? PAL[(j + 1) % PAL.length] : '#e2557a', r: .08, label: (j < S ? '+' : '') + UI.fmt(v), labelOpts: { size: .62, dy: .42 } });

    W.ball({ parent: man, r: .22, y: .92, color: '#f2c9a0' });
    W.box({ parent: man, w: .3, h: .36, d: .2, y: .42, z: -.26, color: C3.woodDark, r: .05 });
    R.board = W.text(o.board || '', { x: 0, y: top(0) + 3, z: -DP / 2, size: .72, bg: '#ffffff', color: '#12283a' });

    return R;
  };

  Game.level({
    id: 'subst', unit: 2, order: 60, icon: '🪜', title: 'Substitution', tag: 'Recurrences · unroll until the base case',
    scene: 'Walk down the staircase one substitution at a time until you reach the base case',

    story(W) {

        { text: 'Use the rule once: \\(T(4) = T(3) + 4\\). He pays 4 and steps down. \\(T(3)\\) is still unknown.',
          run: async () => { await down(0, 'T(4) = T(3) + 4'); } },
        { text: '<b>Substitute</b> the same rule for the smaller input, \\(T(3) = T(2) + 3\\). Now \\(T(4) = T(2) + 3 + 4\\).',
          run: async () => { await down(1, 'T(4) = T(2) + 3 + 4'); } },
        { text: 'Once more: \\(T(4) = T(1) + 2 + 3 + 4\\). Spot the pattern after \\(k\\) steps: \\(T(n) = T(n-k) + (n-k+1) + \\dots + (n-1) + n\\).',

          run: async () => { W.setText(R.board, '1 + 1 + 2 + 3 + 4 = 11   →   Θ(n²)'); for (let j = 4; j >= 0; j--) { W.pop(R.crates[j]); await Game.wait(160); } } },

    },
    formula: `\\[T(n) = T(n-1) + n\\]\\[= T(n-k) + \\sum_{i=0}^{k-1}(n-i)\\]<p>With \\(k = n\\) and \\(T(0) = 1\\): \\(T(n) = 1 + \\frac{n(n+1)}{2} = \\Theta(n^2)\\).</p>`,
    exam: { t: 'addn', cn: 4 },
    examSrc: '2024 Final Q1b · T(n) = T(n−1) + n',
    make(r, d) {

    mount(ctx) {
      const { t, cn } = ctx.inst, P = TPL[t], R = ctx.rng, easy = ctx.diff === 1;

          choose(P.k, () => {
            push('= ' + P.after, P.k[0].replace(/\\/g, '').replace('log_2', 'log₂ '));
            rows.forEach(showRow); showRow(bRow); shownSum();
            ctx.good(`\\(${P.kq} \\Rightarrow ${P.k[0]}\\). Every step is now on the right: ${rows.length} steps plus the base case.`);
            phase = 'closed'; step();
          }, () => `\\(${P.kq} \\Rightarrow ${P.k[0]}\\).${P.log ? ' Halving \\(k\\) times reaches 1 when \\(2^k = n\\).' : ' Subtracting 1 each step reaches 0 after \\(n\\) steps.'}`);
        } else if (phase === 'closed') {
          ctx.task('Add up the series. Closed form \\(T(n) = \\;?\\)');
          choose(P.closed, () => { push('= ' + P.closed[0], 'closed form', 'fin'); ctx.good(`\\(T(n) = ${P.closed[0]}\\).`); phase = 'check'; step(); },
            v => `\\(${P.after}\\) simplifies to \\(${P.closed[0]}\\). Check with \\(n = ${cn}\\): the crates add to ${tv}, ${UI.fmt(P.cf(cn))} from the right formula.`);
        } else if (phase === 'check') {
          ctx.task(`Check it: use your closed form for \\(n = ${cn}\\). \\(T(${cn}) = \\;?\\)`);
          extra.innerHTML = '';
          const on = v => {
            if (!UI.same(v, tv)) return ctx.bad(`Plug \\(n = ${cn}\\) into \\(${P.closed[0]}\\): ${tv}. The crates on the stairs add to the same number.`);
            ctx.good(`\\(T(${cn}) = ${tv}\\), same as running the recurrence.`); phase = 'theta'; step();
          };
          extra.append(easy ? UI.choices(R.shuffle([...new Set([tv, tv + 1, tv - 1, tv * 2])]).map(v => ({ label: String(v), value: String(v) })), on) : UI.ask(`\\(T(${cn}) =\\)`, on));
        } else if (phase === 'theta') {
          ctx.task('Order of growth?');
          extra.innerHTML = '';
          extra.append(UI.choices(THETA, v => {
            if (v !== P.th) return ctx.bad(`Keep the biggest term of \\(${P.closed[0]}\\): <b>${P.th}</b>.`);
            ctx.good(P.th + '.'); finish();
          }));
        }
      };
      const finish = () => {
        phase = 'end'; extra.innerHTML = '';
        ctx.done(`\\(${P.rec}\\), \\(${P.base}\\)<br>After \\(k\\) steps: \\(T(n) = ${P.pat[0]}\\)<br>\\(${P.kq} \\Rightarrow ${P.k[0]}\\): \\(T(n) = ${P.after} = \\boxed{${P.closed[0]}}\\)<br>Check: \\(T(${cn}) = ${tv}\\). \\(\\therefore T(n) = ${P.th.replace('Θ', '\\Theta').replace('ⁿ', '^n').replace('²', '^2').replace('log', '\\log ')}\\)`);
      };
      step();
      return {
        hint: () => ({ e0: `\\(${P.side[0]}\\)`, e1: `\\(${P.side[1]}\\)`, pat: 'Compare step 1, 2, 3 and replace the step number by k.', k: `Solve \\(${P.kq}\\) for k.`, closed: `Simplify \\(${P.after}\\).`, check: `Plug n = ${cn} into the closed form.`, theta: 'Biggest term.' })[phase],
        demoStep() {
          const v = { e0: P.e[0][0], e1: P.e[1][0], pat: P.pat[0], k: P.k[0], closed: P.closed[0], check: String(tv), theta: P.th }[phase];
          if (v == null) return;
          const ch = extra.querySelector('.choices'), as = extra.querySelector('.ask');
          if (as) as.submit(v); else if (ch) ch.pick(v);
        },
      };
    },
  });
})();

(() => {

  };
  const CLS = [
    ['Merge sort', true, 'Splits into two halves, sorts each recursively, merges: divide, conquer, combine.'],
    ['Quick sort', true, 'Partition divides the array around a pivot; both sides are sorted recursively.'],
    ['Binary search', true, 'Discards half the array each step and recurses on the other half: \\(T(n/2) + 1\\).'],
    ['Recursive Min-Max', true, 'Splits at mid, solves both halves, combines with 2 comparisons.'],
    ['Strassen\'s matrix multiplication', true, 'Splits the matrices into quarters: 7 recursive multiplications, \\(T(n) = 7T(n/2) + n^2\\).'],
    ['Straightforward Min-Max (one loop)', false, 'A single left-to-right scan: no sub-problems, no recursion.'],
    ['Fractional knapsack', false, 'Greedy: sort by \\(p/w\\) and take the best ratio first. No splitting into sub-problems.'],

  /* the course's first-pivot partition, returns {pv | leaf, size, kids} */
  function qsTree(a0) {
    const A = a0.concat([Infinity]);
    const rec = (l, h) => {
      if (h - l <= 0) return null;
      if (h - l === 1) return { leaf: A[l], size: 1 };
      const piv = A[l]; let i = l, j = h;

    intro: `<p>D&amp;C splits a problem into independent smaller copies, solves them recursively and combines: \\(T(n) = aT(n/b) + f(n)\\).</p>

<p>A single loop, a greedy pick or a DP table is <b>not</b> D&amp;C.</p>`,
    formula: `\\[T(n) = aT(n/b) + \\Theta(n^k \\log^p n)\\]<p>Case 1: \\(\\log_b a \\gt k \\Rightarrow \\Theta(n^{\\log_b a})\\). Case 2: \\(\\log_b a = k,\\ p \\gt -1 \\Rightarrow \\Theta(n^k \\log^{p+1} n)\\). Case 3: \\(\\log_b a \\lt k \\Rightarrow \\Theta(n^k \\log^p n)\\).</p><p>\\(T(n-1) + n\\): Master's does not apply.</p>`,

document.head.append(UI.h('style', {}, `
.u3mm .bar3{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}

(() => {
  const GOLD = '#ffc53d', BLUE = '#3d9be9';
  const build = (i, j) => {
    if (i === j) return { i, j, kind: 'one' };
    if (j === i + 1) return { i, j, kind: 'pair' };
    const mid = Math.floor((i + j) / 2);
    return { i, j, mid, kind: 'comb', kids: [build(i, mid), build(mid + 1, j)] };
  };
  /* animations run one after another in a queue; the game never waits for them */
  const mkQ = () => { let q = Promise.resolve(); return fn => { const sp = window.__FAST || window.__TEST ? 0 : 1; return q = q.then(() => fn(sp)).catch(e => console.error(e)); }; };

  /* the 3D sports ground: players in the front row (height = value), one terrace per round behind them.
     o: {X(i), hide, noIdx, onPlayer(i), onClone(node, what)} */
  function arena(W, a, root, o = {}) {
    const C = World.C, PAL = World.PAL, n = a.length, Q = mkQ();
    const X = o.X || (i => (i - (n - 1) / 2) * 1.5);
    const lo = Math.min(...a), hi = Math.max(...a), rel = v => hi === lo ? .5 : (v - lo) / (hi - lo);
    const ht = x => x.ht ?? (x.ht = x.kids ? 1 + Math.max(...x.kids.map(ht)) : 1);
    const TOP = ht(root), ZS = 1.7, YS = .7, Z0 = TOP * ZS / 2, ZP = Z0 + .9, span = X(n - 1) - X(0) + 2.4;
    const all = []; (function walk(x) { (x.kids || []).forEach(walk); all.push(x); })(root);
    const key = x => x.i + '-' + x.j, zOf = x => Z0 - ht(x) * ZS, yOf = x => ht(x) * YS + .1, cx = x => (X(x.i) + X(x.j)) / 2;
    W.slab({ w: span + 5.4, x: (X(0) + X(n - 1)) / 2 - 1.9, d: (TOP + 1) * ZS + 2.6, z: .5, color: C.grass, h: .3 });
    W.box({ w: span + 1.2, h: .03, d: .12, z: Z0 - ZS / 2 - .1, y: .02, color: '#ffffff', r: 0, shadow: false });   // chalk line
    for (let L = 1; L <= TOP; L++) W.box({ w: span, h: L * YS - .1, d: ZS, z: Z0 - L * ZS, color: L % 2 ? '#e6ecf0' : '#d5dfe6', r: .04 });
    const pawn = (v, color, r, h, p, head) => {
      const g = W.group(p);
      W.cyl({ parent: g, r, rTop: r * .78, h, color });
      W.ball({ parent: g, r: r * .72, y: h + r * .5, color: head || '#f6d2b0' });
      W.tag(g, v, { dy: h + r * 1.25 + .42, size: .6 });
      return g;
    };
    const players = a.map((v, i) => {
      const g = pawn(v, PAL[i % PAL.length], .42, .7 + 1.3 * rel(v), { x: X(i), z: ZP });
      if (o.onPlayer) W.click(g, () => o.onPlayer(i));
      if (!o.noIdx) W.text(`[${i}]`, { x: X(i), y: .3, z: ZP + 1, size: .5, color: '#3d5a70' });
      return g;
    });
    const plat = {}, clones = {};
    for (const x of all) {
      const g = W.group({ x: cx(x), z: zOf(x) });
      W.slab({ parent: g, w: X(x.j) - X(x.i) + 1.2, d: ZS - .4, y: yOf(x), h: .2, color: '#ffffff' });
      W.text(`[${x.i}..${x.j}]`, { parent: g, x: x.kids ? (X(x.mid) + X(x.mid + 1)) / 2 - cx(x) : 0, y: yOf(x) - .45, z: ZS / 2 + .06, size: .5, color: '#12283a', depthTest: !x.kids });
      g.visible = !o.hide; plat[key(x)] = g;
    }
    /* scoreboard on the top terrace */
    const bx = X(0) - 3.2, by = 2.2, bz = 0;
    for (const dx of [-1, 1]) W.cyl({ r: .09, h: 1.4, x: bx + dx, z: bz, color: C.steel });
    W.box({ w: 3, h: 1.9, d: .2, x: bx, y: by, z: bz, color: C.ink, r: .12 });
    const num = W.text('0', { x: bx, y: by + .3, z: bz + .2, size: 1, color: GOLD });
    W.text('comparisons', { x: bx, y: by - .55, z: bz + .2, size: .5, color: '#ffffff', stroke: 'rgba(18,40,58,.9)' });
    W.fit({ dir: [.1, .72, 1], pad: .9 });
    const pos = (x, what) => ({ x: cx(x) + (x.kind === 'one' ? 0 : what === 'mx' ? -.5 : .5), y: yOf(x), z: zOf(x) });
    const get = (x, what) => clones[key(x) + (x.kind === 'one' ? 'both' : what)];
    let lit = [];
    return {
      Q, X, players, pos, at: i => ({ x: X(i), y: 0, z: ZP }),
      score: t => Q(() => { W.setText(num, t); }),
      show: x => Q(async sp => { const g = plat[key(x)]; g.visible = true; await W.drop(g, 4, 380 * sp); }),
      /* mark the node being solved: its platform and its players light up */
      focus: x => Q(async sp => {
        lit.forEach(p => W.glow(p, null)); lit = [];
        if (x && x.kind !== 'comb') for (let t = x.i; t <= x.j; t++) { W.glow(players[t], GOLD); lit.push(players[t]); }
        await Promise.all(all.map(y => W.paint(plat[key(y)].children[0], y === x ? GOLD : y.shown ? '#bfe8cf' : '#ffffff', 160 * sp)));
      }),
      /* a winner (what = 'mx'), a loser ('mn') or a lone player ('both') walks from src up to node x's platform */
      spawn: (x, what, v, src) => Q(async sp => {
        const g = pawn(v, what === 'mn' ? BLUE : GOLD, .3, .45 + .6 * rel(v), src, what === 'both' ? BLUE : null);

      clone: get,
      shake: g => Q(() => { g && W.shake(g); }),
      crown: (iMax, iMin) => Q(async sp => {
        lit.forEach(p => W.glow(p, null)); lit = [];
        await Promise.all(all.map(y => W.paint(plat[key(y)].children[0], '#bfe8cf', 160 * sp)));
        W.glow(players[iMax], GOLD); W.glow(players[iMin], BLUE); W.pop(players[iMax]); W.pop(players[iMin]);
        const r = [get(root, 'mx'), get(root, 'mn')]; r.forEach(g => g && W.pop(g));
        await Game.wait(300 * sp);
      }),
    };
  }

  Game.level({
    id: 'maxmin', unit: 3, order: 10, icon: '🏆', title: 'Max-Min Tournament', tag: 'D&C · halves fight, winners meet', scene: 'Find the tallest and shortest player at sports day with the fewest face-offs',
    intro: `<p>Split \\(a[i..j]\\) at \\(\\text{mid} = \\lfloor (i+j)/2 \\rfloor\\) and solve each half.</p>
<p><b>One element</b>: Max = Min, 0 comparisons. <b>Two elements</b>: 1 comparison gives both.</p>
<p><b>Combine</b>: max(Max1, Max2) and min(Min1, Min2): 2 comparisons.</p>
<p>Total for \\(n = 2^k\\): \\(3n/2 - 2\\), against \\(2(n-1)\\) for the plain scan.</p>`,
    formula: `\\[T(n) = 2T(n/2) + 2,\\quad T(2) = 1,\\ T(1) = 0\\]\\[T(n) = \\tfrac{3n}{2} - 2 = O(n)\\]<p>Straightforward scan: \\(2(n-1)\\) worst. Space \\(O(\\log n)\\) (stack).</p>`,
    exam: { a: [23, 45, 12, 67, 34, 89, 54, 31, 89] },
    examSrc: '2025 Final Q7a · A = [23,45,12,67,34,89,54,31,89], count comparisons',
    make(r, d) {
      const n = [r.int(5, 6), r.int(8, 9), r.int(11, 13)][d - 1];
      const a = Array.from({ length: n }, () => r.int(1, 99));
      if (d > 1 && r() < 0.6) a[r.int(0, n - 1)] = Math.max(...a);   // sometimes a tied maximum, like the exam
      return { a };
    },
    build,
    /* story: coach Meera and four players */
    story(W) {
      const a = [14, 9, 17, 12], root = build(0, 3), [L, R] = root.kids;
      const xs = [-3.3, -1.8, 1.8, 3.3], x0 = [-2.25, -.75, .75, 2.25];
      const S = arena(W, a, root, { X: i => xs[i], hide: true, noIdx: true });
      S.players.forEach((p, i) => { p.position.x = x0[i]; p.visible = false; });
      let c = 0;
      const pair = async (x) => {
        const hiI = a[x.i] >= a[x.j] ? x.i : x.j, loI = hiI === x.i ? x.j : x.i;
        await S.show(x); S.focus(x); await S.duel(S.players[x.i], S.players[x.j]);
        S.spawn(x, 'mx', a[hiI], S.at(hiI)); await S.spawn(x, 'mn', a[loI], S.at(loI));
        x.mx = a[hiI]; x.mn = a[loI]; await S.score(++c); S.focus(null);
      };
      return [
        { text: 'Coach Meera must find the <b>tallest</b> and the <b>shortest</b> of her players. Checking everyone against both records costs \\(2(n-1) = 6\\) comparisons for 4 players. She wants fewer.',
          run: async () => { for (const p of S.players) { p.visible = true; await W.drop(p, 5, 380); } } },
        { text: '<b>Divide.</b> She splits the line at \\(\\text{mid} = \\lfloor (0+3)/2 \\rfloor = 1\\). Each half is the same problem, only smaller.',
          run: async () => { await Promise.all(S.players.map((p, i) => W.move(p, { x: xs[i] }, 600))); } },
        { text: '<b>Two players need one comparison.</b> 14 against 9: the winner 14 is the Max (gold), the loser 9 is the Min (blue). \\(T(2) = 1\\).',
          run: () => pair(L) },
        { text: 'Same on the right: 17 beats 12. Two comparisons so far. (A player left alone would be both Max and Min for free: \\(T(1) = 0\\).)',
          run: () => pair(R) },
        { text: '<b>Combine.</b> Only the two winners meet: \\(\\max(14, 17) = 17\\). Only the two losers meet: \\(\\min(9, 12) = 9\\). Exactly <b>2</b> more comparisons.',
          run: async () => {
            await S.show(root); S.focus(root);
            await S.duel(S.clone(L, 'mx'), S.clone(R, 'mx')); await S.spawn(root, 'mx', 17, S.pos(R, 'mx')); await S.score(++c);
            await S.duel(S.clone(L, 'mn'), S.clone(R, 'mn')); await S.spawn(root, 'mn', 9, S.pos(L, 'mn')); await S.score(++c);
          } },
        { text: 'Total \\(1 + 1 + 2 = 4 = \\frac{3 \\cdot 4}{2} - 2\\), not 6. The rule is \\(T(n) = 2T(n/2) + 2\\), which gives \\(\\frac{3n}{2} - 2 = O(n)\\).',
          run: async () => { await S.crown(2, 1); } },

    },
    mount(ctx) {
      const H = UI.h, W = ctx.world, a = ctx.inst.a, n = a.length, d = ctx.diff, showCnt = d !== 3;
      ctx.el.classList.add('u3mm');
      const root = this.build(0, n - 1);
      const post = []; (function walk(x) { (x.kids || []).forEach(walk); post.push(x); })(root);
      let k = 0, cmp = 0, phase = 'node', step = 0, cur = null;
      const S = arena(W, a, root, { onPlayer: i => pick(i), onClone: (x, what) => cloneClick(x, what) });
      const arr = W.real ? null : UI.arr(a, { idx: true, label: 'A', onClick: i => pick(i) });   // only when 3D is unavailable
      const cnt = H('span', { class: 'pill' });
      const paintCnt = () => { cnt.innerHTML = showCnt ? `Comparisons: <b>${cmp}</b>` : 'Comparisons: <b>hidden (Hard)</b>'; S.score(showCnt ? cmp : '?'); };
      const extra = H('div');
      const tbody = H('tbody');

      ctx.el.append(arr ? arr.el : '', H('div', { class: 'bar3' }, cnt, H('span', { class: 'note' }, 'Gold piece = Max of a range, blue piece = Min. Every solved range goes into the table.')), extra, table);

      };
      const row = (x, cs, c) => {
        tbody.append(H('tr', {}, [++step, `[${x.i}..${x.j}]`, cs, x.mx, x.mn, c].map(t => H('td', {}, t))));
      };
      const next = () => {
        extra.innerHTML = '';
        if (k >= post.length) return finish();
        const x = post[k]; phase = 'node'; draw();
        if (x.kind === 'one') ctx.task(`Range [${x.i}..${x.j}] has <b>one player</b>. Click that player: it is both Max and Min (0 comparisons).`);
        else if (x.kind === 'pair') ctx.task(`Range [${x.i}..${x.j}] = (${a[x.i]}, ${a[x.j]}): <b>two players</b>. One comparison \\(a[${x.i}] \\lt a[${x.j}]\\)? Click the <b>Max</b>.`);
        else combine(x, 'max');
      };
      const pick = i => {
        const x = post[k]; if (phase !== 'node' || !x || x.kind === 'comb') return;
        if (i < x.i || i > x.j) { S.shake(S.players[i]); return ctx.bad(`Index ${i} is outside the current range [${x.i}..${x.j}]. Work only on the highlighted part.`); }
        if (x.kind === 'one') {

        } else {
          const p = a[x.i], q = a[x.j], mx = Math.max(p, q);
          if (a[i] !== mx) { S.shake(S.players[i]); return ctx.bad(`Compare \\(a[${x.i}] = ${p}\\) with \\(a[${x.j}] = ${q}\\): the larger, ${mx}, is the Max. One comparison settles both Max and Min.`); }
          cmp++; x.mx = mx; x.mn = Math.min(p, q); row(x, 'pair', 1);
          S.spawn(x, 'mx', x.mx, S.at(i)); S.spawn(x, 'mn', x.mn, S.at(i === x.i ? x.j : x.i));
          ctx.good(`\\(${p} ${p < q ? '\\lt' : '\\ge'} ${q}\\): Max = ${x.mx}, Min = ${x.mn}. <b>1</b> comparison (\\(T(2) = 1\\)).`);
        }
        k++; next();
      };
      const combine = (x, what) => {
        phase = what; cur = x; const [L, R] = x.kids;
        const vals = what === 'max' ? [L.mx, R.mx] : [L.mn, R.mn], nm = what === 'max' ? 'Max' : 'Min';
        ctx.task(`Combine [${x.i}..${x.mid}] and [${x.mid + 1}..${x.j}] (mid = \\(\\lfloor(${x.i}+${x.j})/2\\rfloor = ${x.mid}\\)). Pick the overall <b>${nm}</b>${d === 1 ? ` (${what === 'max' ? 'larger' : 'smaller'} of the two)` : ''}: click the ${what === 'max' ? 'gold' : 'blue'} piece or a button.`);
        extra.innerHTML = '';
        const ch = UI.choices([{ label: `${nm}1 = ${vals[0]} <span class="note">(left)</span>`, value: 'L' }, { label: `${nm}2 = ${vals[1]} <span class="note">(right)</span>`, value: 'R' }], v => choose(v));
        extra.append(H('div', { class: 'cmb' }, H('b', {}, `${nm} = ${what}(${nm}1, ${nm}2):`), ch));
        extra.ch = ch;
      };
      const correct = () => {
        const [L, R] = cur.kids;
        if (phase === 'max') return L.mx > R.mx ? ['L'] : L.mx < R.mx ? ['R'] : ['L', 'R'];
        return L.mn < R.mn ? ['L'] : L.mn > R.mn ? ['R'] : ['L', 'R'];
      };
      /* a piece standing on a platform was clicked in 3D */
      const cloneClick = (x, what) => {
        if ((phase !== 'max' && phase !== 'min') || !cur) return;
        const side = x === cur.kids[0] ? 'L' : x === cur.kids[1] ? 'R' : null;
        if (!side) return;
        if (what !== 'both' && what !== (phase === 'max' ? 'mx' : 'mn')) return ctx.say(phase === 'max' ? 'For the overall Max, compare the two <b>gold</b> pieces.' : 'For the overall Min, compare the two <b>blue</b> pieces.');

          k++; next();
        }
      };

        draw(); S.crown(a.indexOf(root.mx), a.indexOf(root.mn));

        phase = 'total';
        ctx.task(`Max = ${root.mx}, Min = ${root.mn}. How many <b>comparisons</b> in total?`);
        extra.innerHTML = ''; extra.append(UI.ask('Total comparisons =', v => {
          if (!UI.same(v, cmp)) return ctx.bad(`Count them: ${pairs} pair-call${pairs === 1 ? '' : 's'} × 1 + ${combs} combine${combs === 1 ? '' : 's'} × 2 = ${pairs} + ${2 * combs} = ${cmp}. Single elements cost 0.`);
          ctx.good(`Right: ${pairs}×1 + ${combs}×2 = ${cmp}.`); end();
        }));
      };
      const end = () => {
        phase = 'end'; extra.innerHTML = ''; cnt.innerHTML = `Comparisons: <b>${cmp}</b>`; S.score(cmp);
        const f = 3 * n / 2 - 2;
        ctx.done(`Max \\(= ${root.mx}\\), Min \\(= ${root.mn}\\)<br>Comparisons \\(= ${pairs} \\times 1 + ${combs} \\times 2 = \\mathbf{${cmp}}\\)<br><span class="note">\\(3n/2 - 2 = ${UI.fmt(f)}\\) for \\(n = ${n}\\)${Number.isInteger(Math.log2(n)) ? ' (exact, n is a power of 2)' : '; \\(\\lceil 3n/2 \\rceil - 2 = ' + (Math.ceil(3 * n / 2) - 2) + '\\) (n not a power of 2)'}. Straightforward worst: \\(2(n-1) = ${2 * (n - 1)}\\).</span>`);
      };
      next();
      return {
        hint() {
          const x = post[k];
          if (phase === 'node') return x.kind === 'one' ? `Just click \\(a[${x.i}] = ${a[x.i]}\\).` : `Which is bigger, ${a[x.i]} or ${a[x.j]}?`;
          if (phase === 'max' || phase === 'min') return `Compare the two numbers on the buttons; take the ${phase === 'max' ? 'larger' : 'smaller'}.`;
          if (phase === 'total') return `Pairs cost 1 each (${pairs} of them), combines cost 2 each (${combs} of them).`;
        },
        demoStep() {
          const x = post[k];
          if (phase === 'node') pick(x.kind === 'one' ? x.i : (a[x.i] >= a[x.j] ? x.i : x.j));
          else if (phase === 'max' || phase === 'min') extra.ch.pick(correct()[0]);
          else if (phase === 'total') extra.querySelector('.ask').submit(String(cmp));
        },
      };
    },
  });
})();

/* Unit 3 · Merge sort (mid = ⌊(l+h)/2⌋, Merge takes the left on ties) */
document.head.append(UI.h('style', {}, `

@media (max-width:700px){.u3ms .mbox .c{width:32px;height:30px;font-size:12.5px}.u3ms .mtree,.u3ms .mbox{column-gap:5px;gap:5px}}
`));
(() => {
  const GOLD = '#ffc53d';
  /* recursion tree of segments [l..h] */
  const tree = n => {
    let id = 0;
    const build = (l, h, dep) => { const x = { id: id++, l, h, dep, open: false, sorted: false }; if (l < h) { x.mid = Math.floor((l + h) / 2); x.kids = [build(l, x.mid, dep + 1), build(x.mid + 1, h, dep + 1)]; } return x; };
    const root = build(0, n - 1, 0);
    const all = []; (function w(x) { all.push(x); (x.kids || []).forEach(w); })(root);
    return { root, all, D: Math.max(...all.map(x => x.dep)) };
  };
  /* animations run one after another in a queue; the game never waits for them */
  const mkQ = () => { let q = Promise.resolve(); return fn => { const sp = window.__FAST || window.__TEST ? 0 : 1; return q = q.then(() => fn(sp)).catch(e => console.error(e)); }; };

  /* the 3D library: a stepped bookcase. The whole row starts on the top shelf (depth 0), every split carries the
     halves one step down, every merge carries books back up in sorted order. Book height = value. */
  function library(W, vals, T, o = {}) {
    const C = World.C, PAL = World.PAL, n = vals.length, D = T.D, Q = mkQ(), SP = 1.3, ZS = 1.55, YS = .8;
    const X = t => (t - (n - 1) / 2) * SP, zOf = dep => (dep - D / 2) * ZS, yOf = dep => (D - dep) * YS + .12;
    const lo = Math.min(...vals), hi = Math.max(...vals), bh = v => .75 + 1.05 * (hi === lo ? .5 : (v - lo) / (hi - lo));
    const wide = n * SP + .9;
    W.slab({ w: wide + 5.2, x: -2, d: (D + 1) * ZS + 1.2, color: '#c9b79c', h: .3 });
    for (let dep = 0; dep < D; dep++) W.box({ w: wide, h: (D - dep) * YS, d: ZS, z: zOf(dep), color: dep % 2 ? C.woodDark : '#a8743c', r: .04 });
    const shelf = {};
    for (const x of T.all) {
      const s = W.slab({ w: (x.h - x.l) * SP + SP - .3, d: ZS - .45, x: (X(x.l) + X(x.h)) / 2, z: zOf(x.dep), y: yOf(x.dep), h: .12, color: '#fbf3e4' });
      s.visible = x === T.root; shelf[x.id] = s;
    }
    const books = vals.map((v, i) => W.box({ w: .66, h: bh(v), d: 1, x: X(i), y: yOf(0) + bh(v) / 2, z: zOf(0), color: PAL[i % PAL.length], r: .07,
      label: v, labelOpts: { size: .56, dy: .42 }, onClick: o.onBook ? () => o.onBook(i) : null }));
    if (!o.noIdx) for (let t = 0; t < n; t++) W.text(`[${t}]`, { x: X(t), y: .28, z: zOf(D) + ZS / 2 + .35, size: .5, color: '#3d5a70' });
    /* counter on the reading desk */
    const bx = X(0) - 3.4, bz = zOf(D) - .2;
    W.box({ w: 3.2, h: .9, d: 1.5, x: bx, z: bz, color: C.wood, r: .08 });
    W.box({ w: 2.9, h: 1.7, d: .16, x: bx, y: 1.85, z: bz - .3, color: C.ink, r: .1 });
    const num = W.text('0', { x: bx, y: 2.1, z: bz - .1, size: .95, color: GOLD });
    W.text('comparisons', { x: bx, y: 1.35, z: bz - .1, size: .5, color: '#ffffff', stroke: 'rgba(18,40,58,.9)' });
    W.fit({ dir: [.1, .7, 1], pad: o.pad || .8 });
    const spot = (id, t, dep) => ({ x: X(t), y: yOf(dep) + bh(vals[id]) / 2, z: zOf(dep) });
    let lit = [];
    return {
      Q, books,
      score: t => Q(() => { W.setText(num, t); }),
      /* colour a shelf: 'hi' current, 'src' the two runs being merged, 'ok' sorted, 'off' emptied */
      mark: (x, how) => Q(sp => W.paint(shelf[x.id], { hi: GOLD, src: '#b9b0ff', ok: '#8fdcae', off: '#d9cdb8', idle: '#fbf3e4' }[how], 120 * sp)),
      /* carry the books of x (ids in shelf order) one step down onto the two child shelves */
      split: (x, ids) => Q(async sp => {
        await W.paint(shelf[x.id], '#d9cdb8', 120 * sp);
        for (const k of x.kids) { shelf[k.id].visible = true; W.drop(shelf[k.id], 3, 300 * sp); }
        await Promise.all(ids.map((id, t) => Game.wait(60 * t * sp).then(() => W.hop(books[id], spot(id, x.l + t, x.dep + 1), 520 * sp, 1.1))));
      }),
      /* the two front books light up */
      fronts: ids => Q(() => { lit.forEach(b => W.glow(b, null)); lit = ids.map(id => books[id]); lit.forEach(b => W.glow(b, GOLD)); }),
      /* a book hops up to slot t of the shelf at depth dep */
      take: (id, t, dep, ms = 520) => Q(async sp => { W.glow(books[id], null); await W.hop(books[id], spot(id, t, dep), ms * sp, 1.5); }),
      shake: id => Q(() => { W.shake(books[id]); }),
      cheer: () => Q(async sp => { lit.forEach(b => W.glow(b, null)); lit = []; for (const b of books) W.pop(b); await Game.wait(300 * sp); }),
    };
  }

  Game.level({
    id: 'merge', unit: 3, order: 20, icon: '🧩', title: 'Merge Sort', tag: 'D&C · split cheap, merge smart', scene: 'Shelve the library books by height: halve the row, then merge the piles',
    intro: `<p><b>Divide</b> \\(A[l..h]\\) at \\(\\text{mid} = \\lfloor (l+h)/2 \\rfloor\\) until every piece has one element (already sorted).</p>
<p><b>Merge</b>: compare the two front elements, move the smaller to the output (left one on a tie). One look = one comparison.</p>
<p>When one run is empty, copy the rest of the other with no comparisons.</p>
<p>Merges happen in recursion order: left half fully, then right, then both together.</p>`,
    formula: `\\[T(n) = 2T(n/2) + n,\\quad T(1) = 1\\]\\[T(n) = n + n\\log_2 n = \\Theta(n \\log n)\\]<p>Best = average = worst. Space \\(O(n)\\) (merge array). Merging runs of total length \\(m\\): at most \\(m - 1\\) comparisons.</p>`,
    exam: { a: [78, 120, 95, 85, 60, 102, 75, 110] },
    examSrc: '2024 Final Q3a · marathon times 78,120,95,85,60,102,75,110, show passes',
    make(r, d) {
      const n = [r.int(5, 6), 8, r.int(10, 12)][d - 1];
      return { a: Array.from({ length: n }, () => r.int(d === 1 ? 1 : 10, d === 1 ? 50 : 150)) };
    },
    /* story: librarian Anaya and four books */
    story(W) {
      const vals = [7, 3, 5, 2], T = tree(4), V = library(W, vals, T, { pad: 1.05 }), root = T.root, [L, R] = root.kids;
      V.books.forEach(b => { b.visible = false; });
      let c = 0;
      const cmp = async (x, a, b, win, slot) => { V.fronts([a, b]); await V.Q(sp => Game.wait(650 * sp)); await V.take(win, slot, x.dep); await V.score(++c); };
      const copy = async (x, id, slot) => { V.fronts([id]); await V.Q(sp => Game.wait(350 * sp)); await V.take(id, slot, x.dep); V.fronts([]); };
      return [
        { text: 'Anaya the librarian must shelve these books <b>shortest to tallest</b>. Her trick: a single book is already sorted, so she keeps cutting the row in half.',
          run: async () => { for (const b of V.books) { b.visible = true; await W.drop(b, 5, 380); } V.mark(root, 'hi'); } },
        { text: '<b>Divide.</b> \\(\\text{mid} = \\lfloor (0+3)/2 \\rfloor = 1\\): books 0..1 go left, books 2..3 go right. She halves again until every book stands alone.',
          run: async () => { await V.split(root, [0, 1, 2, 3]); await V.Q(sp => Game.wait(350 * sp)); V.split(L, [0, 1]); await V.split(R, [2, 3]); } },
        { text: '<b>Merge</b> the first two: compare the fronts, 7 against 3. The smaller, 3, goes up first; then 7 is simply copied. <b>1 comparison.</b>',
          run: async () => { V.mark(L, 'hi'); await cmp(L, 0, 1, 1, 0); await copy(L, 0, 1); V.mark(L, 'ok'); } },
        { text: 'The same on the right: 2 is smaller than 5, so 2 goes first. Now there are two <b>sorted piles</b>: 3, 7 and 2, 5.',
          run: async () => { V.mark(R, 'hi'); await cmp(R, 2, 3, 3, 2); await copy(R, 2, 3); V.mark(R, 'ok'); } },
        { text: 'Final merge. She only ever looks at the <b>front book of each pile</b>: 3 vs 2 gives 2, 3 vs 5 gives 3, 7 vs 5 gives 5. The right pile is empty, so 7 is copied for free.',
          run: async () => { V.mark(root, 'hi'); V.mark(L, 'src'); V.mark(R, 'src'); await cmp(root, 1, 3, 3, 0); await cmp(root, 1, 2, 1, 1); await cmp(root, 0, 2, 2, 2); await copy(root, 0, 3); V.mark(root, 'ok'); V.mark(L, 'off'); V.mark(R, 'off'); } },
        { text: 'Sorted with \\(1 + 1 + 3 = 5\\) comparisons. Every level moves all \\(n\\) books and there are \\(\\log_2 n\\) levels: \\(T(n) = 2T(n/2) + n = \\Theta(n \\log n)\\), always. The spare shelf costs \\(O(n)\\) space.',
          run: async () => { await V.cheer(); } },
      ];
    },
    mount(ctx) {
      const H = UI.h, W = ctx.world, A = ctx.inst.a.slice(), n = A.length, d = ctx.diff;
      ctx.el.classList.add('u3ms');
      /* tree of segments */
      const T = tree(n), root = T.root, all = T.all;
      const height = x => x.kids ? 1 + Math.max(...x.kids.map(height)) : 0;
      all.forEach(x => x.ht = height(x));
      const splits = all.filter(x => x.kids).sort((p, q) => p.dep - q.dep || p.l - q.l);   // BFS order
      const merges = []; (function w(x) { if (x.kids) { x.kids.forEach(w); merges.push(x); } })(root);
      root.vis = true; root.bk = A.map((_, i) => i);   // bk = ids of the books standing on this node's shelf, in order
      let phase = 'split', si = 0, mi = 0, cmp = 0, total = 0;
      /* a book was clicked in 3D: translate it to the same moves the workbench uses */
      const V = library(W, A, T, { onBook: id => {
        if (phase === 'split') { const x = splits[si], t = x.bk.indexOf(id); if (t >= 0) split(x.l + t); }
        else if (phase === 'merge') {
          const a = Lb.indexOf(id), b = Rb.indexOf(id);
          if (a >= li) take('L', a); else if (b >= ri) take('R', b);
        }
      } });
      const cntEl = H('span', { class: 'pill' });
      const treeEl = H('div', { class: 'mtree', style: `grid-template-columns:repeat(${n},auto)` });
      const ws = H('div'), extra = H('div'), runs = H('div', { class: 'runs' });
      const tbody = H('tbody');
      const table = H('table', { class: 'st', style: 'display:none' }, H('thead', {}, H('tr', {}, ['#', 'Merge(l,mid,h)', 'Left', 'Right', 'Merged', 'Cmp', 'Whole array after'].map(t => H('th', {}, t)))), tbody);
      ctx.el.append(H('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px' }, cntEl, H('span', { class: 'note' }, 'Each shelf is one sub-array of the recursion tree (one step down = one level deeper). Green shelf = sorted.')));
      if (!W.real) ctx.el.append(H('div', { style: 'overflow-x:auto' }, treeEl), ws);   // flat fallback when 3D is unavailable
      ctx.el.append(runs, extra, H('div', { style: 'overflow-x:auto' }, table));
      const paintCnt = () => { cntEl.innerHTML = `Comparisons: <b>${total + cmp}</b>`; V.score(total + cmp); };
      const drawTree = (hiNode, srcNodes = []) => {
        treeEl.innerHTML = '';
        for (const x of all) {
          if (!x.vis) continue;
          const box = H('div', { class: 'mbox' + (x === hiNode ? ' hi' : '') + (srcNodes.includes(x) ? ' src' : '') + (x.sorted ? ' ok' : '') + (phase === 'split' && x === hiNode ? ' clk' : '') + (phase === 'merge' && x.merged ? ' dim' : ''),
            style: `grid-row:${x.dep + 1};grid-column:${x.l + 1}/${x.h + 2}` });
          for (let t = x.l; t <= x.h; t++) box.append(H('div', { class: 'c', onclick: () => split(t) }, x.vals ? x.vals[t - x.l] : A[t]));
          treeEl.append(box);
        }
        paintCnt();
      };
      /* ---- divide ---- */
      const nextSplit = () => {
        if (si >= splits.length) return startMerge();
        const x = splits[si]; drawTree(x); V.mark(x, 'hi');
        ctx.task(`Divide [${x.l}..${x.h}] (the gold shelf): click the <b>last book of the left half</b>${d === 1 ? ` (mid = \\(\\lfloor(${x.l}+${x.h})/2\\rfloor\\))` : ''}.`);
      };
      const split = t => {
        if (phase !== 'split') return;
        const x = splits[si];
        if (t < x.l || t > x.h) return;
        if (t !== x.mid) { V.shake(x.bk[t - x.l]); return ctx.bad(`mid = \\(\\lfloor(l+h)/2\\rfloor = \\lfloor(${x.l}+${x.h})/2\\rfloor = ${x.mid}\\), so the left half is [${x.l}..${x.mid}] and the right half is [${x.mid + 1}..${x.h}]. The left half gets the extra element when the length is odd.`); }
        x.kids.forEach(c => c.vis = true); si++;
        x.kids[0].bk = x.bk.slice(0, x.mid - x.l + 1); x.kids[1].bk = x.bk.slice(x.mid - x.l + 1);
        V.split(x, x.bk);
        ctx.good(`[${x.l}..${x.h}] → [${x.l}..${x.mid}] + [${x.mid + 1}..${x.h}]`, 5);
        nextSplit();
      };
      /* ---- merge ---- */
      let L, R, out, li, ri, cur, larr, rarr, oarr, Lb = [], Rb = [], outB;
      const startMerge = () => {
        phase = 'merge';
        all.filter(x => !x.kids).forEach(x => { x.sorted = true; x.vals = [A[x.l]]; V.mark(x, 'ok'); });
        ctx.say(`Divide done: ${all.filter(x => !x.kids).length} single books, each already sorted. Now merge back up in recursion order.`);
        nextMerge();
      };
      const nextMerge = () => {
        if (mi >= merges.length) return finish();
        cur = merges[mi]; const [p, q] = cur.kids;
        L = p.vals.slice(); R = q.vals.slice(); out = []; li = ri = 0; cmp = 0;
        Lb = p.bk.slice(); Rb = q.bk.slice(); outB = [];
        larr = UI.arr(L, { label: `Left run [${p.l}..${p.h}]`, onClick: i => take('L', i) });
        rarr = UI.arr(R, { label: `Right run [${q.l}..${q.h}]`, onClick: i => take('R', i) });
        oarr = UI.arr(Array(L.length + R.length).fill(''), { label: `Output → A[${cur.l}..${cur.h}]` });
        ws.innerHTML = ''; ws.append(H('div', { class: 'ws' }, larr.el, rarr.el), oarr.el);
        V.mark(cur, 'hi'); V.mark(p, 'src'); V.mark(q, 'src');
        paintRuns(); drawTree(cur, cur.kids); prompt();
      };
      const paintRuns = () => {
        [[larr, L, li], [rarr, R, ri]].forEach(([g, v, p]) => { v.forEach((_, i) => { g.cls(i, 'dim', i < p); g.cls(i, 'hi', i === p); }); g.ptr('▲', p < v.length ? p : -1); });
        const run = (v, p) => v.map((x, i) => i < p ? '' : i === p ? `<b>${x}</b>` : x).filter(x => x !== '').join(' ') || '(empty)';
        runs.innerHTML = `<span>Left pile: ${run(L, li)}</span><span>Right pile: ${run(R, ri)}</span><span>Output: ${out.join(' ') || '…'}</span>`;
        V.fronts([Lb[li], Rb[ri]].filter(x => x != null));
        paintCnt();
      };
      const prompt = () => {
        const a = L[li], b = R[ri];
        ctx.task(`Merge ${mi + 1}/${merges.length}: Merge(${cur.l}, ${cur.mid}, ${cur.h}) onto the gold shelf. Click the <b>smaller front book</b> of the two purple shelves` + (d === 1 ? `: ${a} vs ${b}?` : '.'));
      };
      const take = (side, i) => {
        if (phase !== 'merge') return;
        const p = side === 'L' ? li : ri, v = side === 'L' ? L : R, vb = side === 'L' ? Lb : Rb;
        if (i !== p) { V.shake(vb[i]); return ctx.bad(`Only the <b>front</b> of each run can move: the runs are already sorted, so the next output is ${L[li]} or ${R[ri]}, whichever is smaller.`); }
        const a = L[li], b = R[ri];
        if ((side === 'L' && a > b) || (side === 'R' && b > a)) { V.shake(vb[i]); return ctx.bad(`Compare the fronts: ${a} (left) vs ${b} (right). The smaller one, ${Math.min(a, b)}, goes out next. Taking ${v[i]} would put a bigger number before a smaller one.`); }
        cmp++;
        out.push(v[i]); oarr.set(out.length - 1, v[i], 'ok');
        outB.push(vb[i]); V.take(vb[i], cur.l + out.length - 1, cur.dep);
        if (side === 'L') li++; else ri++;
        ctx.good(`${a} vs ${b} → take ${v[i]}${a === b ? ' (tie: the course\'s Merge takes the left one, either is fine)' : ''}. Comparison ${cmp}.`, 6);
        paintRuns();
        if (li >= L.length || ri >= R.length) return flush();
        prompt();
      };
      const flush = () => {
        const rest = li < L.length ? L.slice(li) : R.slice(ri), from = li < L.length ? 'left' : 'right';
        const restB = li < L.length ? Lb.slice(li) : Rb.slice(ri);
        rest.forEach((v, t) => { out.push(v); oarr.set(out.length - 1, v, 'ok'); outB.push(restB[t]); V.take(restB[t], cur.l + out.length - 1, cur.dep, 380); });
        li = L.length; ri = R.length; paintRuns();
        if (rest.length) ctx.say(`The ${from === 'left' ? 'right' : 'left'} run is empty: copy ${rest.join(', ')} from the ${from} run with no comparisons.`);
        cur.vals = out.slice(); cur.bk = outB.slice(); cur.c = cmp; cur.sorted = true; cur.kids.forEach(c => { c.merged = true; V.mark(c, 'off'); });
        V.mark(cur, 'ok');
        out.forEach((v, t) => A[cur.l + t] = v);
        total += cmp;
        table.style.display = '';
        tbody.append(H('tr', {}, [mi + 1, `(${cur.l},${cur.mid},${cur.h})`, cur.kids[0].vals.join(' '), cur.kids[1].vals.join(' '), out.join(' '), cmp, A.join(' ')].map(t => H('td', {}, t))));
        ctx.good(`Merge(${cur.l}, ${cur.mid}, ${cur.h}) gives [${out.join(', ')}] with ${cmp} comparison${cmp === 1 ? '' : 's'}.`);
        cmp = 0; mi++; nextMerge();
      };
      const passes = () => {
        const hs = [...new Set(merges.map(x => x.ht))].sort((a, b) => a - b);
        return hs.map(hh => { const ms = merges.filter(x => x.ht === hh); return `Pass ${hh}: ${ms.map(x => x.vals.join(' ')).join(' ; ')} <span class="note">(${ms.reduce((s, x) => s + x.c, 0)} cmp)</span>`; }).join('<br>');
      };
      const finish = () => {
        ws.innerHTML = ''; runs.innerHTML = ''; drawTree(null); V.cheer();
        if (d === 1) return end();
        phase = 'total';
        ctx.task(`Sorted! How many <b>comparisons</b> did all the merges make in total?`);
        extra.innerHTML = ''; extra.append(UI.ask('Total comparisons =', v => {
          if (!UI.same(v, total)) return ctx.bad(`Add the Cmp column of the table: ${merges.map(x => x.c).join(' + ')} = ${total}.`);
          ctx.good(`Yes, ${total} comparisons \\(\\le n\\log_2 n = ${UI.fmt(n * Math.log2(n))}\\).`); end();
        }));
      };
      const end = () => {
        phase = 'end'; extra.innerHTML = '';
        ctx.done(`Sorted: <b>${A.join(' ')}</b><br>${passes()}<br>Total comparisons \\(= ${merges.map(x => x.c).join('+')} = \\mathbf{${total}}\\) \\(\\le n\\log_2 n = ${UI.fmt(n * Math.log2(n))}\\)<br>\\(T(n) = 2T(n/2) + n \\Rightarrow \\Theta(n\\log n)\\), space \\(O(n)\\).`);
      };
      nextSplit();
      return {
        hint() {
          if (phase === 'split') { const x = splits[si]; return `\\(\\lfloor(${x.l}+${x.h})/2\\rfloor = ${x.mid}\\): click the element at index ${x.mid}.`; }
          if (phase === 'merge') return `Fronts are ${L[li]} and ${R[ri]}. Take the smaller.`;
          if (phase === 'total') return `Sum the Cmp column.`;
        },
        demoStep() {
          if (phase === 'split') split(splits[si].mid);
          else if (phase === 'merge') { if (L[li] <= R[ri]) take('L', li); else take('R', ri); }
