<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAA Quest</title>
<meta name="description" content="Play the DAA algorithms: greedy, divide and conquer, DP and backtracking as interactive levels with real exam numericals.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffc53d'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%2312283a'%3E%CE%BB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="window.__texReady&&__texReady()"></script>
<style>/* DAA Quest: "tabletop" look. Daylight sky, white game pieces, chunky pressable buttons, one sunflower accent for actions. */
:root{
  --bg:#d7e9f1;--bg2:#f3f8fa;--card:#ffffff;--card2:#eef4f7;--line:#c5d6df;--tx:#12283a;--mut:#567086;
  --acc:#0f8b8d;--acc2:#4b4acf;--pink:#e2557a;--ok:#22975a;--bad:#d63a2c;--warn:#d99400;--orange:#e8742a;
  --sun:#ffc53d;--sund:#d49a06;--ink:#12283a;
  --sh:0 2px 0 var(--line),0 12px 28px rgba(18,40,58,.10);--r:16px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--head:'Fredoka',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;
  --sky1:#bfe3f2;--sky2:#eaf6f3;--sky3:#fdf3d9;
}
:root[data-theme="dark"]{
  --bg:#14202b;--bg2:#1a2936;--card:#1f2f3d;--card2:#283b4c;--line:#3a5266;--tx:#eaf3f8;--mut:#9cb4c6;
  --acc:#46cfc4;--acc2:#a5a4ff;--pink:#ff8fae;--ok:#58d68d;--bad:#ff7a6b;--warn:#ffc53d;--orange:#ff9d5c;
  --sh:0 2px 0 #0e1820,0 12px 28px rgba(0,0,0,.35);
  --sky1:#1c3550;--sky2:#24405a;--sky3:#3b4a63;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:600 16px/1.5 var(--body)}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2) 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:.2em 0 .4em;line-height:1.15}
a{color:var(--acc)}
b,strong{font-weight:800}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)}
#app{max-width:1320px;margin:0 auto;padding:14px 18px 40px}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-family:var(--head);font-weight:700;font-size:24px;cursor:pointer;display:flex;align-items:center;gap:9px}
.brand i{font-style:normal;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--sun);color:var(--ink);box-shadow:0 3px 0 var(--sund)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;white-space:nowrap;font-weight:700}
.btn{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:7px 14px;font-size:14.5px;font-weight:700;transition:transform .06s,background .15s,border-color .15s}
.btn:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.btn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.pri{background:var(--sun);color:var(--ink);border-color:var(--sund)}
.btn.pri:hover{background:#ffd363;border-color:var(--sund)}
.btn.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--tx)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* home */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:0;margin-bottom:22px;background:var(--card);border-radius:24px;box-shadow:var(--sh);overflow:hidden}
.hero .txt{padding:30px 32px}
.hero h1{font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-.5px;margin-bottom:12px}
.hero .txt p{max-width:52ch;color:var(--mut);font-size:16.5px}
.hero .ctrl{margin-top:18px}
.hero .btn.pri{font-size:17px;padding:11px 22px}
.hero .scene{position:relative;min-height:300px;background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%,var(--sky3))}
.hero .scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.panel{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.prog{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:2px dashed var(--line)}
.prog .stat b{font-family:var(--head);font-size:26px;display:block;line-height:1}
.prog .stat span{font-size:13px;color:var(--mut)}
.prog .rk{flex:1;min-width:180px;font-size:14px}
.bar{height:12px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:5px;border:2px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.world{background:var(--card);border-radius:20px;padding:0 0 12px;box-shadow:var(--sh);overflow:hidden}
.world h2{font-size:19px;display:flex;align-items:center;gap:8px;margin:0;padding:12px 16px;background:var(--wc,var(--acc));color:#fff}
.world h2 small{font:700 13px var(--body);margin-left:auto;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 9px}
.lvls{display:grid;gap:2px;margin-top:8px;padding:0 8px}
.lvl{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:8px 10px;text-align:left;width:100%}
.lvl:hover{background:var(--card2)}
.lvl .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--wc,var(--acc)) 18%,var(--card))}
.lvl .nm{flex:1;min-width:0}
.lvl .nm b{display:block;font-family:var(--head);font-weight:600;font-size:16.5px}
.lvl .nm span{font-size:13px;color:var(--mut);font-weight:600}
.stars{font-size:15px;letter-spacing:1px;color:var(--sun);white-space:nowrap;-webkit-text-stroke:1px var(--sund)}
.stars .off{color:var(--card2);-webkit-text-stroke:1px var(--line)}

/* play */
.lvhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lvhead h2{font-size:24px;margin:0 6px 0 0}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff .btn{padding:4px 11px;font-size:13.5px}
.w3d{position:relative;height:clamp(320px,52vh,560px);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%,var(--sky3));box-shadow:var(--sh);touch-action:none}
.w3d canvas{display:block;width:100%!important;height:100%!important}
.w3d.off{display:none}
.w3d .ov{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
.w3d .ov.tl{left:12px;top:12px}
.w3d .ov.tr{right:12px;top:12px;justify-content:flex-end}
.w3d .ov.bl{left:14px;bottom:10px;font-size:12.5px;color:var(--mut);pointer-events:none}
.hudbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.play.no3d .hudbar{margin-bottom:10px}
.hearts{font-size:20px;letter-spacing:2px;color:var(--bad);background:var(--card);border:2px solid var(--line);border-radius:99px;padding:0 11px;line-height:1.5}
.hearts .off{color:var(--line)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.task{background:var(--ink);color:#fff;border-radius:16px;padding:13px 18px 13px 46px;font-size:17.5px;font-weight:700;min-height:54px;position:relative;margin:12px 0}
:root[data-theme="dark"] .task{background:#0c151c;border:2px solid var(--line)}
.task::before{content:"";position:absolute;left:18px;top:19px;width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px rgba(255,197,61,.3)}
.task b{color:var(--sun)}
.under{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.stage{background:var(--card);border-radius:var(--r);padding:16px;min-height:120px;position:relative;overflow-x:auto;box-shadow:var(--sh)}
.stage:empty{display:none}
.stage.shake,.w3d.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.demoing .w3d,.demoing .stage{outline:3px dashed var(--acc2);outline-offset:-3px}
.sidecol{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.sidecol>*{min-width:0}
.sidecol h3{font-size:15px;color:var(--mut);margin:0 0 6px}
.intro{font-size:14.5px;font-weight:600;overflow-x:auto}
.intro ol,.intro ul{padding-left:20px;margin:.4em 0}
.intro p{margin:.4em 0}
details.panel summary{cursor:pointer;font-family:var(--head);font-size:16px}
.log{background:var(--card);border-radius:var(--r);padding:10px 14px;max-height:260px;overflow:auto;font-size:14px;box-shadow:var(--sh)}
.log:empty{display:none}
.log p{margin:5px 0;padding-left:24px;position:relative}
.log p::before{position:absolute;left:0;top:0;font-weight:800}
.log p.g::before{content:"✓";color:var(--ok)}
.log p.b{color:var(--bad)}
.log p.b::before{content:"✗"}
.log p.n::before{content:"•";color:var(--mut)}
.log p.h::before{content:"💡"}
.float{position:fixed;pointer-events:none;font:700 22px var(--head);color:var(--ok);animation:up .9s forwards;z-index:50;text-shadow:0 2px 0 #fff}
@keyframes up{to{transform:translateY(-60px);opacity:0}}

/* story mode */
.play.story .task,.play.story .under,.play.story .w3d .ov{display:none}
.play.story .w3d{height:clamp(420px,72vh,760px)}
.cap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(820px,calc(100% - 28px));background:var(--card);border-radius:20px;padding:16px 20px 12px;box-shadow:0 4px 0 var(--line),0 18px 40px rgba(18,40,58,.22);z-index:3}
.captxt{font-size:18.5px;font-weight:700;line-height:1.45;min-height:54px}
.captxt b{color:var(--acc)}
.caprow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.was{background:var(--acc)}
.dots i.on{background:var(--sun);box-shadow:0 0 0 3px rgba(255,197,61,.35)}

/* kit: arrays */
.arr{display:inline-flex;flex-direction:column;gap:4px;margin:6px 0}
.arr .lab{font-size:12.5px;color:var(--mut);font-family:var(--mono)}
.arr .row{display:flex;gap:6px}
.arr .cell{min-width:46px;height:46px;padding:0 6px;border-radius:11px;background:var(--card2);border:2px solid var(--line);border-bottom-width:4px;display:grid;place-items:center;font:700 17px var(--mono);transition:background .2s,border-color .2s,transform .15s;user-select:none}
.arr .idx{font:11px var(--mono);color:var(--mut);text-align:center;min-width:46px;padding:0 6px}
.arr .ptrs{display:flex;gap:6px;min-height:20px}
.arr .ptrs span{min-width:46px;padding:0 6px;text-align:center;font:700 12px var(--mono);color:var(--acc)}
.click .cell,.cell.click,.click.cell{cursor:pointer}
.click .cell:hover,.cell.click:hover{border-color:var(--acc);transform:translateY(-2px)}
.cell.hi{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--card))}
.cell.sel{border-color:var(--warn);background:color-mix(in srgb,var(--sun) 40%,var(--card))}
.cell.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.cell.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.cell.dim{opacity:.35}
.cell.piv{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 22%,var(--card))}
.cell.done{border-color:var(--ok);color:var(--ok)}

/* kit: grid */
.grid{border-collapse:separate;border-spacing:4px;font-family:var(--mono)}
.grid th{font-size:12.5px;color:var(--mut);font-weight:700;padding:2px 6px;white-space:nowrap}
.grid td{min-width:44px;height:40px;text-align:center;background:var(--card2);border:2px solid var(--line);border-radius:9px;font-weight:700;font-size:15px;transition:background .2s,border-color .2s;padding:0 4px}
.grid td.empty{color:transparent}
.grid td.hi{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--card))}
.grid td.src{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 20%,var(--card))}
.grid td.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.grid td.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.grid td.sel{border-color:var(--warn);background:color-mix(in srgb,var(--sun) 40%,var(--card))}
.grid td.dim{opacity:.4}
.grid.click td:not(.lock){cursor:pointer}

/* kit: svg graph/tree */
svg.g{max-width:100%;height:auto;overflow:visible;font-family:var(--mono)}
svg.g .node circle,svg.g .node rect{fill:var(--card);stroke:var(--line);stroke-width:2.5;transition:fill .2s,stroke .2s}
svg.g .node text{fill:var(--tx);font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.g .node .tag{fill:var(--acc);font-size:12px;font-weight:700}
svg.g .node.click{cursor:pointer}
svg.g .node.click:hover circle,svg.g .node.click:hover rect{stroke:var(--acc)}
svg.g .node.hi circle,svg.g .node.hi rect{stroke:var(--acc);fill:color-mix(in srgb,var(--acc) 22%,var(--card))}
svg.g .node.sel circle,svg.g .node.sel rect{stroke:var(--warn);fill:color-mix(in srgb,var(--sun) 40%,var(--card))}
svg.g .node.ok circle,svg.g .node.ok rect{stroke:var(--ok);fill:color-mix(in srgb,var(--ok) 20%,var(--card))}
svg.g .node.bad circle,svg.g .node.bad rect{stroke:var(--bad);fill:color-mix(in srgb,var(--bad) 20%,var(--card))}
svg.g .node.dim{opacity:.35}
svg.g .edge line,svg.g .edge path{stroke:var(--line);stroke-width:2.5;fill:none;transition:stroke .2s}
svg.g .edge text{fill:var(--mut);font-size:12.5px;font-weight:700;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--card);stroke-width:5px}
svg.g .edge.click{cursor:pointer}
svg.g .edge.click:hover line,svg.g .edge.click:hover path{stroke:var(--acc)}
svg.g .edge.hi line,svg.g .edge.hi path{stroke:var(--acc);stroke-width:4}
svg.g .edge.ok line,svg.g .edge.ok path{stroke:var(--ok);stroke-width:4}
svg.g .edge.bad line,svg.g .edge.bad path{stroke:var(--bad)}
svg.g .edge.dim{opacity:.3}
svg.g .edge.hi text,svg.g .edge.ok text{fill:var(--tx)}

/* kit: choices / input */
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.choices .btn{font-size:15.5px;padding:9px 16px}
.choices .btn.right{background:color-mix(in srgb,var(--ok) 25%,var(--card));border-color:var(--ok)}
.choices .btn.wrong{background:color-mix(in srgb,var(--bad) 25%,var(--card));border-color:var(--bad)}
.ask{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ask input{background:var(--card);border:2px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;font:700 17px var(--mono);width:150px}
.ask input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.note{font-size:13.5px;color:var(--mut)}
.row2{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.kv{display:inline-flex;gap:6px;align-items:center;background:var(--card2);border-radius:9px;padding:4px 10px;font:700 14px var(--mono);margin:3px}
.kv b{color:var(--acc)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(18,40,58,.45);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--card);border-radius:24px;padding:26px;max-width:560px;width:100%;box-shadow:0 6px 0 var(--line),0 30px 60px rgba(0,0,0,.25);text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.modal .big{font-size:50px;letter-spacing:6px}
.modal .big .stars{font-size:50px}
.modal .sum{text-align:left;background:var(--card2);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:14.5px;overflow-x:auto}
.modal .ctrl{justify-content:center}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* quiz */
.quiz{max-width:760px;margin:0 auto}
.quiz .q{font-size:21px;font-family:var(--head);margin:10px 0 14px}
.quiz .opts{display:grid;gap:10px}
.quiz .opts .btn{text-align:left;font-size:16px;padding:12px 16px}
.quiz .opts .btn.right{background:color-mix(in srgb,var(--ok) 25%,var(--card));border-color:var(--ok)}
.quiz .opts .btn.wrong{background:color-mix(in srgb,var(--bad) 25%,var(--card));border-color:var(--bad)}
.timer{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}
.timer i{display:block;height:100%;background:var(--sun);transition:width .1s linear}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}

@media (max-width:980px){
  .under{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:1fr}
  .hero .scene{min-height:220px;order:-1}
}
@media (max-width:560px){
  #app{padding:10px 16px 30px}
  .top{gap:6px}
  .top .btn{padding:5px 9px}
  .brand{font-size:20px}
  .hero .txt{padding:20px}
  .worlds{grid-template-columns:1fr}
  .w3d{height:300px;border-radius:16px}
  .arr .cell{min-width:36px;height:40px;font-size:15px}
  .arr .idx,.arr .ptrs span{min-width:36px}
  .task{font-size:15.5px}
  .captxt{font-size:16px}
  .cap{padding:12px 14px 10px}
  .lvhead h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>/* DAA Quest 3D kit: a small wrapper over three.js for tabletop dioramas.
   Every level gets ctx.world. In the self-test (and when WebGL is missing) ctx.world is NOOP: any call returns NOOP,
   so level code never needs to check. Never read game state back from the world. */
'use strict';
const NOOP = new Proxy(function () {}, {
  get: (t, k) => k === 'then' ? undefined : k === Symbol.toPrimitive ? () => 0 : k === 'real' ? false : NOOP,
  apply: () => NOOP, construct: () => NOOP, set: () => true,
});

class World {
  /* host: element the canvas goes into. opts: {orbit:true, shadows:true} */
  constructor(host, opts = {}) {
    const T = this.T = THREE;
    this.real = true; this.host = host; this.dead = false;
    this.r = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    this.r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.r.shadowMap.enabled = opts.shadows !== false; this.r.shadowMap.type = T.PCFSoftShadowMap;
    this.r.outputEncoding = T.sRGBEncoding;
    host.prepend(this.r.domElement);
    this.scene = new T.Scene();
    this.cam = new T.PerspectiveCamera(36, 1, 0.1, 600);
    this.cam.position.set(8, 9, 14);
    this.target = new T.Vector3(0, 0.5, 0);
    if (T.OrbitControls && opts.orbit !== false) {
      const c = this.ctl = new T.OrbitControls(this.cam, this.r.domElement);
      c.enableDamping = true; c.dampingFactor = .12; c.enablePan = false; c.maxPolarAngle = Math.PI / 2.1; c.minDistance = 4; c.maxDistance = 90; c.target = this.target;

    return {
      el: tbl, tds,
      set(r, c, v, cl) { const td = tds[r][c]; td.classList.remove('empty'); td.innerHTML = String(v); if (cl) td.classList.add(...cl.split(' ')); },
      get(r, c) { return tds[r][c].classList.contains('empty') ? null : tds[r][c].textContent; },
      cls(r, c, cl, on = true) { tds[r]?.[c]?.classList.toggle(cl, on); },
      clear(cl) { tds.flat().forEach(td => td.classList.remove(...cl.split(' '))); },
      col(c, html) { tbl.rows[0].cells[c + 1].innerHTML = html; },
      row(r, html) { tbl.rows[r + 1].cells[0].innerHTML = html; },
    };
  },
  /* SVG graph. nodes:[{id,x,y,label}], edges:[{u,v,w,dir}] (w shown as label). opts:{w,h,r,onNode(id),onEdge(i),curve:boolean per edge via e.bend} */
  graph(nodes, edges, opts = {}) {
    const W = opts.w || 600, H = opts.h || 360, R = opts.r || 20;
    const svg = s('svg', { class: 'g', viewBox: `0 0 ${W} ${H}`, width: W });
    const uid = 'm' + Math.random().toString(36).slice(2, 7);
    svg.append(s('defs', {}, ['', 'hi', 'ok'].map(k => s('marker', { id: uid + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' },
      s('path', { d: 'M0 0L10 5L0 10z', fill: k === 'hi' ? 'var(--acc)' : k === 'ok' ? 'var(--ok)' : 'var(--mut)' })))));
    const P = Object.fromEntries(nodes.map(n => [n.id, n]));
    const eg = s('g'), ng = s('g'); svg.append(eg, ng);
    const E = edges.map((e, i) => {
      const a = P[e.u], b = P[e.v], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
      const x1 = a.x + dx / L * R, y1 = a.y + dy / L * R, x2 = b.x - dx / L * (R + (e.dir ? 3 : 0)), y2 = b.y - dy / L * (R + (e.dir ? 3 : 0));
      const bend = e.bend || 0, mx = (x1 + x2) / 2 - dy / L * bend, my = (y1 + y2) / 2 + dx / L * bend;
      const path = s('path', { d: bend ? `M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}` : `M${x1} ${y1}L${x2} ${y2}`, 'marker-end': e.dir ? `url(#${uid})` : null });
      const lx = bend ? (x1 + 2 * mx + x2) / 4 : mx - dy / L * 11, ly = bend ? (y1 + 2 * my + y2) / 4 : my + dx / L * 11;
      const t = s('text', { x: lx, y: ly }, e.w ?? '');
      const g = s('g', { class: 'edge' + (opts.onEdge ? ' click' : ''), onclick: opts.onEdge ? () => opts.onEdge(i) : null }, path, t);
      eg.append(g); return { g, path, t, e };
    });
    const N = {};
    nodes.forEach(n => {
      const shape = n.rect ? s('rect', { x: n.x - (n.rw || 30), y: n.y - R, width: 2 * (n.rw || 30), height: 2 * R, rx: 10 }) : s('circle', { cx: n.x, cy: n.y, r: R });
      const tag = s('text', { class: 'tag', x: n.x, y: n.y - R - 11 }, n.tag ?? '');
      const lab = s('text', { x: n.x, y: n.y }, n.label ?? n.id);
      const g = s('g', { class: 'node' + (opts.onNode ? ' click' : ''), onclick: opts.onNode ? () => opts.onNode(n.id) : null }, shape, lab, tag);
      ng.append(g); N[n.id] = { g, lab, tag, shape };
    });
    const mark = (g, path, c, on) => { g.classList.toggle(c, on); if (path && path.getAttribute('marker-end')) path.setAttribute('marker-end', `url(#${uid}${g.classList.contains('ok') ? 'ok' : g.classList.contains('hi') ? 'hi' : ''})`); };
    return {
      el: svg, N, E,
      node(id, c, on = true) { N[id] && N[id].g.classList.toggle(c, on); },
      edge(i, c, on = true) { E[i] && mark(E[i].g, E[i].path, c, on); },
      tag(id, txt) { N[id].tag.textContent = txt ?? ''; },
      label(id, txt) { N[id].lab.textContent = txt; },
      fill(id, color) { N[id].shape.style.fill = color || ''; },
      edgeLabel(i, txt) { E[i].t.textContent = txt; },
      clear(c) { Object.values(N).forEach(n => n.g.classList.remove(...c.split(' '))); E.forEach((x, i) => c.split(' ').forEach(k => mark(x.g, x.path, k, false))); },
    };
  },
  /* tree layout. root = {label, kids:[...], cls, edge (label on edge from parent), tag (small text above), id} ; returns {el, render(root)} */
  tree(opts = {}) {
    const wrap = h('div', { style: 'overflow-x:auto' });
    const R = opts.r || 20, LH = opts.levelH || 78, GAP = opts.gap || 50;
    const api = {
      el: wrap,
      render(root, onNode) {
        let leaf = 0, depth = 0; const all = [];
        (function lay(n, d) {
          n._d = d; depth = Math.max(depth, d); all.push(n);
          const k = (n.kids || []).filter(Boolean);
          if (!k.length) { n._x = leaf++; } else { k.forEach(c => lay(c, d + 1)); n._x = (k[0]._x + k[k.length - 1]._x) / 2; }
        })(root, 0);
        const W = Math.max(leaf * GAP + 40, 120), H = (depth + 1) * LH + 30;
        const nodes = all.map((n, i) => ({ id: n.id ?? ('t' + i), x: 20 + GAP / 2 + n._x * GAP, y: 34 + n._d * LH, label: n.label, tag: n.tag, rect: n.rect, rw: n.rw, _n: n }));
        const idOf = new Map(all.map((n, i) => [n, nodes[i].id]));
        const edges = [];
        all.forEach(n => (n.kids || []).filter(Boolean).forEach(c => edges.push({ u: idOf.get(n), v: idOf.get(c), w: c.edge ?? '' })));
        const g = UI.graph(nodes, edges, { w: W, h: H, r: R, onNode: onNode || opts.onNode });
        g.el.removeAttribute('width'); g.el.style.width = Math.min(W, opts.maxW || 99999) + 'px'; g.el.style.minWidth = Math.min(W, 260) + 'px';
        nodes.forEach(n => { if (n._n.cls) n._n.cls.split(' ').forEach(c => g.node(n.id, c)); });
        edges.forEach((e, i) => { const c = all.find(n => idOf.get(n) === e.v); if (c.ecls) c.ecls.split(' ').forEach(k => g.edge(i, k)); });
        wrap.innerHTML = ''; wrap.append(g.el); api.g = g;
        return g;
      },
    };
    return api;
  },
  /* multiple-choice buttons. options: array of strings/html or {label,value}. onPick(value, btn) */
  choices(options, onPick) {
    const el = h('div', { class: 'choices' });
    const btns = options.map(o => {
      const lab = typeof o === 'object' ? o.label : o, val = typeof o === 'object' ? o.value : o;
      const b = h('button', { class: 'btn', html: String(lab), onclick: () => onPick(val, b) });
      b._v = val; el.append(b); return b;
    });
    tex(el);
    el.btns = btns;
    el.pick = v => { const b = btns.find(x => x._v === v); b && b.click(); };   // used by demoStep
    return el;
  },
  /* number/text input. onSubmit(string) */
  ask(label, onSubmit, opts = {}) {
    const inp = h('input', { type: opts.type || 'text', placeholder: opts.placeholder || '?', inputmode: opts.text ? 'text' : 'decimal', autocomplete: 'off' });
    const go = () => { const v = inp.value.trim(); if (v !== '') onSubmit(v); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    const el = h('div', { class: 'ask' }, label ? h('span', { html: label }) : null, inp, h('button', { class: 'btn pri', onclick: go }, opts.button || 'Check'));
    tex(el);
    el.input = inp;
    el.submit = v => { inp.value = v; go(); };   // used by demoStep
    setTimeout(() => { if (!window.__TEST && !Game.ctx?.demo && document.contains(inp) && matchMedia("(pointer:fine)").matches) inp.focus({ preventScroll: true }); }, 30);
    return el;
  },
  /* compare numbers typed by player, tolerant to "1/2", "0.5", "1,234" */
  num(v) {
    v = String(v).replace(/,/g, '').trim();
    if (/^-?\d+(\.\d+)?\s*\/\s*\d+(\.\d+)?$/.test(v)) { const [a, b] = v.split('/').map(Number); return a / b; }
    return Number(v);
  },
  same(a, b, eps = 0.011) { const x = UI.num(a), y = typeof b === 'number' ? b : UI.num(b); return Number.isFinite(x) && Math.abs(x - y) <= eps * Math.max(1, Math.abs(y)); },
  fmt(x, d = 2) { return Number.isInteger(x) ? String(x) : (+x.toFixed(d)).toString(); },
};

let heroWorld = null;
function killWorlds() { if (heroWorld) { heroWorld.dispose && heroWorld.dispose(); heroWorld = null; } if (Game.ctx && Game.ctx.world && Game.ctx.world.real) { Game.ctx.world.dispose(); Game.ctx.world = NOOP; } }
/* hero: a row of crates that keeps getting sorted (selection sort), forever */
function heroScene(host) {
  const w = heroWorld = World.make(host); if (!w.real) return;
  const n = 9, R = RNG(7), vals = R.shuffle([...Array(n).keys()].map(i => i + 1));
  w.slab({ w: n * 1.25 + 1.5, d: 3.2, color: '#ffffff', h: .35 });
  const bars = vals.map((v, i) => w.box({ w: .9, d: .9, h: .5 + v * .42, x: (i - (n - 1) / 2) * 1.25, color: World.PAL[(v - 1) % World.PAL.length], label: v, labelOpts: { size: .5 } }));
  w.fit({ dir: [.45, .5, 1] }); if (w.ctl) { w.ctl.autoRotate = true; w.ctl.autoRotateSpeed = .5; w.ctl.enableZoom = false; }
  const X = i => (i - (n - 1) / 2) * 1.25;
  (async () => {
    while (!w.dead) {
      for (let i = 0; i < n - 1 && !w.dead; i++) {
        let m = i; for (let j = i + 1; j < n; j++) if (vals[j] < vals[m]) m = j;
        w.glow(bars[m], '#ffc53d'); await Game.wait(450);
        if (m !== i) { await Promise.all([w.hop(bars[m], { x: X(i) }, 650, 1.8), w.hop(bars[i], { x: X(m) }, 650, .7)]); [vals[i], vals[m]] = [vals[m], vals[i]];[bars[i], bars[m]] = [bars[m], bars[i]]; }
        w.glow(bars[i], null);
      }
      await Game.wait(1800); if (w.dead) return;
      const order = R.shuffle([...Array(n).keys()]), nb = [], nv = [];
      await Promise.all(order.map((from, to) => { nb[to] = bars[from]; nv[to] = vals[from]; return w.hop(bars[from], { x: X(to) }, 700, 1 + to * .2); }));
      for (let i = 0; i < n; i++) { bars[i] = nb[i]; vals[i] = nv[i]; }
      await Game.wait(600);
    }
  })();
}

  }
  el.append(worlds, h('p', { class: 'note', style: 'text-align:center;margin-top:24px' }, 'Progress is saved in this browser. Drag any 3D scene to look around.'));

/* ---------- story: the "how it works" of a level, told as animated 3D beats ----------
   L.story(world) builds a small scene and returns beats [{text, run: async () => {...}}]. */
function runStory(L, world, w3d, playEl, onDone) {
  playEl.classList.add('story');
  world.captioned = true;   // fit() leaves room for the caption box
  const txt = h('div', { class: 'captxt' }), dots = h('div', { class: 'dots' });
  const bBack = h('button', { class: 'btn', onclick: () => show(at - 1) }, '‹ Back');
  const bNext = h('button', { class: 'btn pri', onclick: () => at + 1 < n ? show(at + 1) : finish() }, 'Next');
  const cap = h('div', { class: 'cap' }, txt, h('div', { class: 'caprow' }, dots, h('div', { style: 'flex:1' }),
    h('button', { class: 'btn', onclick: () => finish() }, 'Skip story'), bBack, bNext));
  w3d.append(cap);
  let beats = L.story(world), n = beats.length, at = -1, over = false;
  const finish = () => { if (over) return; over = true; window.__FAST = false; cap.remove(); playEl.classList.remove('story'); onDone(); };
  const show = async k => {
    if (over || k < 0) return;
    bBack.disabled = bNext.disabled = true;
    if (k !== at + 1) {   // going back: rebuild the scene and replay the earlier beats instantly
      world.clear(); beats = L.story(world);
      window.__FAST = true; try { for (let i = 0; i < k; i++) beats[i].run && await beats[i].run(); } finally { window.__FAST = false; }
    }
    at = k; if (over) return;
    txt.innerHTML = beats[k].text; tex(txt);
    dots.innerHTML = ''; dots.append(...beats.map((_, i) => h('i', { class: i === k ? 'on' : i < k ? 'was' : '' })));
    bNext.textContent = k + 1 < n ? 'Next' : 'Your turn: play';

/* builds ctx, mounts the level. Also used by the self-test (with detached elements). */
function runLevel(L, diff, seed, ui, test) {
  const rng = RNG(seed);
  const inst = diff === 'exam' ? JSON.parse(JSON.stringify(L.exam)) : L.make(rng, diff);
  const st = { hearts: 3, score: 0, combo: 0, mistakes: 0, done: false, hints: 0 };
  const paint = () => {
    ui.hearts.innerHTML = ''; ui.hearts.append(...[0, 1, 2].map(i => h('span', { class: i < st.hearts ? '' : 'off' }, '♥')));
    ui.score.textContent = st.score; ui.combo.textContent = 'combo ×' + st.combo;
  };
  const pop = (txt, color) => {
    if (test) return;
    const r = (ui.w3d && ui.w3d.offsetHeight ? ui.w3d : ui.stage).getBoundingClientRect();
    const f = h('div', { class: 'float', style: `left:${r.left + r.width / 2 - 20}px;top:${Math.max(80, r.top + 30)}px;color:${color}` }, txt);
    document.body.append(f); setTimeout(() => f.remove(), 900);
  };
  const line = (cls, html) => { const p = h('p', { class: cls, html }); ui.log.prepend(p); tex(p); };
  const ctx = Game.ctx = {
    el: ui.stage, world: ui.world || NOOP, inst, rng, diff, demo: false, test: !!test,
    task(html) { ui.task.innerHTML = html; tex(ui.task); },
    say(html) { line('n', html); },
    good(msg, pts = 10) {
      if (st.done) return; st.combo++; const g = pts + Math.min(st.combo, 10) * 2; st.score += g; paint();
      if (msg) line('g', msg); SFX.good(st.combo); pop('+' + g, 'var(--ok)');
    },
    bad(msg) {
      if (st.done) return;
      st.mistakes++; st.combo = 0; st.hearts = Math.max(0, st.hearts - 1); paint(); line('b', msg || 'Not quite.'); SFX.bad();
      if (test) test.bad.push(msg);
      for (const e of [ui.stage, ui.w3d]) if (e) { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
      if (st.hearts === 0 && !test && !st.oh) { st.oh = true; setTimeout(() => outOfHearts(L, diff), 400); }
    },
    hintNote(html) { line('h', html); },
    done(summary) {
      if (st.done) return; st.done = true; stopDemo();
      const stars = st.hearts === 0 ? 0 : Math.max(1, 3 - st.mistakes - (st.hints > 1 ? 1 : 0));
      const bonus = diff === 'exam' ? 120 : diff * 40;
      st.score += bonus; paint();
      if (test) { test.done = true; test.summary = summary; return; }
      const usedDemo = st.watched;
      const xp = usedDemo ? Math.round(st.score / 4) : st.score;
      Game.addXp(xp); if (!usedDemo) Game.save(L.id, { stars, score: st.score });
      if (diff === 'exam' && stars === 3 && !usedDemo) { const ex = LS.get('dq-exam', {}); ex[L.id] = 1; LS.set('dq-exam', ex); }
      SFX.win(); if (stars >= 2 && !usedDemo) confetti();
      const ls = Game.levels.slice().sort((a, b) => a.unit - b.unit || a.order - b.order), nx = ls[ls.indexOf(L) + 1];
      modal(h('div', {},
        h('div', { class: 'big' }, starStr(usedDemo ? 0 : stars)),
        h('h2', {}, usedDemo ? 'Demo finished' : stars === 3 ? 'Flawless!' : stars === 2 ? 'Nice work!' : 'Cleared!'),
        h('p', { class: 'mut' }, `${st.mistakes} mistake${st.mistakes === 1 ? '' : 's'} · +${xp} XP` + (usedDemo ? ' (demo: quarter XP, no stars)' : '')),
        summary ? h('div', { class: 'sum', html: '<b>Answer</b><br>' + summary }) : null,
        h('div', { class: 'ctrl' },
          h('button', { class: 'btn', onclick: () => { closeModal(); play(L.id, diff); } }, '🎲 Play again'),
          diff !== 'exam' && diff < 3 ? h('button', { class: 'btn', onclick: () => { closeModal(); play(L.id, diff + 1); } }, 'Harder ↑') : null,
          L.exam && diff !== 'exam' ? h('button', { class: 'btn', onclick: () => { closeModal(); play(L.id, 'exam'); } }, '🎓 Exam version') : null,
          nx ? h('button', { class: 'btn pri', onclick: () => { closeModal(); go('play/' + nx.id); } }, 'Next: ' + nx.title + ' →') : h('button', { class: 'btn pri', onclick: () => { closeModal(); go(''); } }, 'Home'))));
    },
    get busy() { return st.done; },
    _st: st,
  };
  paint();
  ui.stage.innerHTML = ''; ui.log.innerHTML = '';
  ctx.handle = L.mount(ctx) || {};
  return ctx;
}

function quiz(unitFilter) {
  stopDemo(); killWorlds();

  const pool = Game.quiz.filter(q => !unitFilter || q.unit == unitFilter);
  const R = RNG(Date.now() >>> 0), qs = R.shuffle(pool).slice(0, 12);
  let i = 0, right = 0, streak = 0, best = 0, timer = null;
  const box = h('div', { class: 'panel quiz' });
  el.append(topbar(h('span', { class: 'pill' }, '⚡ Rapid-fire')),
    h('div', { class: 'diff', style: 'justify-content:center;margin-bottom:12px' },
      h('button', { class: 'btn' + (!unitFilter ? ' on' : ''), onclick: () => quiz() }, 'All units'),
      Object.keys(Game.units).filter(u => Game.quiz.some(q => q.unit == u)).map(u => h('button', { class: 'btn' + (unitFilter == u ? ' on' : ''), onclick: () => quiz(u) }, 'Unit ' + u))),
    box);
  const show = () => {
    clearInterval(timer);
    if (i >= qs.length) {
      const xp = right * 15 + best * 5; Game.addXp(xp); if (right >= qs.length * .8) { SFX.win(); confetti(); }
      box.innerHTML = ''; box.append(h('h2', {}, `${right}/${qs.length} correct`), h('p', { class: 'mut' }, `Best streak ${best} · +${xp} XP`),
        h('div', { class: 'ctrl' }, h('button', { class: 'btn pri', onclick: () => quiz(unitFilter) }, 'Again'), h('button', { class: 'btn', onclick: () => go('') }, 'Home')));
      return;
    }
    const q = qs[i], opts = R.shuffle(q.a.map((t, k) => ({ t, ok: k === 0 })));
    let left = 100; const bar = h('i', { style: 'width:100%' });
    box.innerHTML = '';
    const why = h('div', { class: 'note', style: 'min-height:24px;margin-top:10px' });
    const answer = (o, b) => {
      clearInterval(timer); box.querySelectorAll('.opts .btn').forEach(x => { x.disabled = true; if (x._ok) x.classList.add('right'); });
      if (o && o.ok) { right++; streak++; best = Math.max(best, streak); SFX.good(streak); }
      else { streak = 0; SFX.bad(); if (b) b.classList.add('wrong'); }
      why.innerHTML = (o && o.ok ? '✓ ' : o ? '✗ ' : '⏱ Time up. ') + (q.why || ''); tex(why);
      box.append(h('div', { class: 'ctrl', style: 'margin-top:12px' }, h('button', { class: 'btn pri', onclick: () => { i++; show(); } }, i + 1 < qs.length ? 'Next →' : 'Results')));
    };
    box.append(h('div', { class: 'mut' }, `Question ${i + 1}/${qs.length} · Unit ${q.unit} · streak ${streak}`),
      h('div', { class: 'timer' }, bar), h('div', { class: 'q', html: q.q }),
      h('div', { class: 'opts' }, opts.map(o => { const b = h('button', { class: 'btn', html: o.t, onclick: () => answer(o, b) }); b._ok = o.ok; return b; })), why);
    tex(box);
    timer = setInterval(() => { left -= 100 / 200; bar.style.width = Math.max(0, left) + '%'; if (left <= 0) answer(null); }, 100);   // 20 s
  };
  show();
}

/* ---------- self-test: #test plays every level in demo mode and checks it finishes with no mistakes ---------- */
async function selfTest() {
  window.__TEST = true;
  const out = [], seeds = [11, 22, 33, 44, 55];
  for (const L of Game.levels) {
    for (const diff of [1, 2, 3, 'exam']) {
      if (diff === 'exam' && !L.exam) continue;
      for (const seed of (diff === 'exam' ? [1] : seeds)) {
        const T = { bad: [], done: false };
        const ui = { hearts: h('span'), score: h('b'), combo: h('span'), task: h('div'), stage: h('div'), log: h('div') };
        document.body.append(ui.stage);
        let err = null, steps = 0;
        try {
          const ctx = runLevel(L, diff, seed, ui, T); ctx.demo = true;
          if (!ctx.handle.demoStep) throw new Error('no demoStep');
          while (!T.done && steps < 800) { await ctx.handle.demoStep(); steps++; }
        } catch (e) { err = String(e && e.stack || e).slice(0, 300); }
        ui.stage.remove();
        const ok = !err && T.done && !T.bad.length;
        out.push({ id: L.id, diff, seed, ok, steps, err, bad: T.bad.slice(0, 2), summary: ok ? undefined : T.summary });
      }
    }
  }
  const fails = out.filter(r => !r.ok);
  const pre = h('pre', { id: 'testout' }, JSON.stringify({ levels: Game.levels.map(l => l.id), runs: out.length, fails, quiz: Game.quiz.length, quizBad: Game.quiz.filter(q => !q.q || !q.a || q.a.length < 2 || q.unit == null).length }, null, 1));
  document.body.append(pre); document.title = fails.length ? 'TEST FAIL' : 'TEST PASS';
}

      };
      return [
        { text: 'Meera drives a taxi. A ride of \\(n\\) km costs her \\(f(n) = 2n + 3\\) rupees: ₹2 of fuel per km plus ₹3 to start. Each tower is her cost <b>per km</b>, \\(f(n) \\div n\\).',
          run: async () => {

        { text: 'She wants a simple promise: "never more than <b>₹3 per km</b>". In symbols \\(f(n) \\le c \\cdot g(n)\\) with \\(g(n) = n\\) (the highest power in \\(f\\)) and \\(c = 3\\). The purple bar is the cap.',
          run: async () => { T.setBar(T.up, 3 * S, 'c = 3'); await W.drop(T.up.g, 5, 600); W.setText(T.board, 'is  2n + 3 ≤ 3·n ?'); await Game.wait(300); } },
        { text: 'Check short rides. \\(n = 1\\): \\(5 \\gt 3 \\cdot 1\\). \\(n = 2\\): \\(7 \\gt 3 \\cdot 2\\). The towers poke through the cap: the promise is <b>broken</b> there.',
          run: async () => { await judge(1, 3); await judge(2, 3); } },
        { text: 'From \\(n = 3\\) on it holds: \\(9 \\le 9\\), \\(11 \\le 12\\), \\(13 \\le 15\\)… The towers keep sinking towards 2, so they never touch the cap again.',
          run: async () => { for (let n = 3; n <= NV; n++) await judge(n, 3); } },
        { text: 'Big-Oh ignores small inputs. Put a gate at \\(n_0 = 3\\): \\(2n + 3 \\le 3n\\) for all \\(n \\ge 3\\). So \\(f(n) = O(n)\\) with \\(c = 3,\\ n_0 = 3\\).',
          run: async () => { T.gate.visible = true; T.setGate(3); await W.drop(T.gate, 6, 500); for (const n of [1, 2]) col(n, C.dim, '#dfe7ec'); W.setText(T.board, '2n + 3 ≤ 3n  for all n ≥ 3'); await Game.wait(300); } },
        { text: 'Would \\(c = 2\\) work? No: every tower is \\(2 + \\frac{3}{n}\\), above 2 <b>forever</b>, and no gate fixes that. \\(c\\) must beat the leading coefficient. Safe recipe: add the positive coefficients, \\(c = 2 + 3 = 5\\), which works from \\(n_0 = 1\\).',
          run: async () => {
            T.gate.visible = false; await T.moveBar(T.up, 2 * S, 'c = 2'); for (let n = 1; n <= NV; n++) col(n, C.bad, '#f3b4ac'); W.setText(T.board, 'c = 2:  2n + 3 > 2n  for every n  ✗'); await Game.wait(900);
            await T.moveBar(T.up, 5 * S, 'c = 5'); for (let n = 1; n <= NV; n++) col(n, C.ok, '#bfe6cf'); W.setText(T.board, 'c = 5:  2n + 3 ≤ 5n  for all n ≥ 1  ✓'); await Game.wait(400);
          } },
        { text: 'Lower bound: drop the small term. \\(2n \\le 2n + 3\\) always, so every tower stands above the orange bar at \\(c_1 = 2\\): \\(f(n) = \\Omega(n)\\). Both bars together: \\(2n \\le 2n + 3 \\le 3n\\) for \\(n \\ge 3\\), so \\(f(n) = \\Theta(n)\\).',
          run: async () => {
            await T.moveBar(T.up, 3 * S, 'c₂ = 3'); T.gate.visible = true; T.setGate(3);
            for (let n = 1; n <= NV; n++) col(n, n < 3 ? C.dim : C.ok, n < 3 ? '#dfe7ec' : '#bfe6cf');
            T.setBar(T.lo, .06, 'c₁ = 2'); await T.moveBar(T.lo, 2 * S, 'c₁ = 2', 700);
            W.setText(T.board, '2n ≤ 2n + 3 ≤ 3n  for all n ≥ 3   →   Θ(n)');
          } },
      ];
    },
    exam: { c: [1, 1, 3], mode: 'Theta' },
    examSrc: '2023 Re-exam (Model) Q2b ii · f(n) = 3n² + n + 1, find Θ',
    make(r, d) {
      for (let t = 0; t < 500; t++) {
        const deg = d === 1 ? r.int(1, 2) : d === 2 ? 2 : r.int(2, 3);
        const c = Array.from({ length: deg + 1 }, (_, k) => k === deg ? r.int(1, 5) : r.int(0, d === 1 ? 4 : 6));
        if (d === 3) c[r.int(0, deg - 1)] = -r.int(1, 5);
        if (c.slice(0, deg).every(x => x === 0)) continue;
        const mode = d === 1 ? 'O' : d === 2 ? r.pick(['Theta', 'Theta', 'Omega']) : 'Theta';
        const inst = { c, mode };
        if (this.solve(inst)) return inst;
      }
      return { c: [1, 1, 3], mode: 'Theta' };
    },
    /* a valid (c1, c2, n0) on the 0.5-grid of the sliders, n0 <= 12 */
    solve({ c, mode }) {
      const deg = c.length - 1, lead = c[deg], g = n => n ** deg, f = n => ev(c, n);
      const sumPos = c.reduce((s, a) => s + Math.max(0, a), 0);
      let up = null, lo = null;
      if (mode !== 'Omega') for (let c2 = sumPos; c2 <= sumPos + 6; c2 += .5) { const n0 = firstGood(n => f(n) <= c2 * g(n)); if (n0 <= 12) { up = { c2, n0 }; break; } }
      if (mode !== 'O') for (let c1 = lead; c1 >= .5; c1 -= .5) { const n0 = firstGood(n => c1 * g(n) <= f(n) && f(n) >= 0); if (n0 <= 12) { lo = { c1, n0 }; break; } }
      if ((mode !== 'Omega' && !up) || (mode !== 'O' && !lo)) return null;
      return { c1: lo?.c1, c2: up?.c2, n0: Math.max(up?.n0 || 1, lo?.n0 || 1) };
    },
    mount(ctx) {
      const { c, mode } = ctx.inst, deg = c.length - 1, lead = c[deg], R = ctx.rng;
      const f = n => ev(c, n), g = n => n ** deg, ft = fTex(c), gt = deg === 1 ? 'n' : `n^{${deg}}`;
      const sumPos = c.reduce((s, a) => s + Math.max(0, a), 0);
      const sol = this.solve(ctx.inst);
      const useUp = mode !== 'Omega', useLo = mode !== 'O';
      const cMax = Math.max(10, Math.ceil(sumPos + 4));
      const st = { c1: useLo ? Math.max(.5, lead - (lead > 1 ? 1 : .5)) : null, c2: useUp ? lead : null, n0: 1 };
      let phase = 'g';

      /* 3D road: tower n has height f(n) ÷ g(n); the bars sit at c1 and c2 */
      const W = ctx.world, C3 = World.C, NV = 12, HM = 6, SC = HM / Math.max(sumPos + 1.5, lead + 2.5);
      const T = track3d(W, NV, { up: useUp, lo: useLo, hmax: HM, onPick: n => { if (phase !== 'bounds') return; set.n0(n); draw(); } });
      W.setText(T.legF, `f(n) = ${fTxt(c)}     tower = f(n) ÷ ${pTxt(deg)}`);
      for (let n = 1; n <= NV; n++) { const r = f(n) / g(n); T.setH(T.fT[n], r * SC); T.fLab[n].position.y = Math.min(HM + 1, Math.max(.02, r * SC)) + .4; W.setText(T.fLab[n], UI.fmt(r, 2)); }
      W.fit({ dir: [.3, .5, 1], pad: .92 });
      const draw3d = () => {
        const bad = [];
        for (let n = 1; n <= NV; n++) {
          const ign = n < st.n0, red = !ign && fails(n).length;
          if (red) bad.push(n);
          W.paint(T.fT[n], ign ? C3.dim : red ? C3.bad : C3.ok, 0);
          W.paint(T.pads[n], ign ? '#dfe7ec' : red ? '#f3b4ac' : '#bfe6cf', 0);
        }
        T.setGate(st.n0);
        if (useUp) T.setBar(T.up, st.c2 * SC, `c₂ = ${st.c2}`);
        if (useLo) T.setBar(T.lo, st.c1 * SC, `c₁ = ${st.c1}`);
        W.setText(T.board, bad.length ? `✗ red at n = ${bad.slice(0, 5).join(', ')}${bad.length > 5 ? ', …' : ''}` : `✓ no red tower from the gate on (n ≥ ${st.n0})`);
      };
      const plotBox = H('div', { class: 'bigo-plot' }), ratioBox = H('div', { class: 'bigo-plot', style: 'margin-top:10px' });
      const status = H('div', { class: 'bigo-st' }), tbl = H('div', { class: 'bigo-tbl' });
      const sliders = H('div'), extra = H('div');
      ctx.el.append(H('div', { class: 'note' }, H('span', { html: `\\(f(n) = ${ft}\\)  ·  goal: ${NAMES[mode]}  ·  each tower is \\(f(n) \\div ${gt}\\); it must stay ${useLo ? 'above the \\(c_1\\) bar' : ''}${useLo && useUp ? ' and ' : ''}${useUp ? 'under the \\(c_2\\) bar' : ''} right of the gate. Click a tower to move the \\(n_0\\) gate there.` })),
        H('div', { class: 'bigo-wrap' }, H('div', { class: 'bigo-plot' }, plotBox, ratioBox),
          H('div', { class: 'bigo-side' }, extra, sliders, status)), tbl);
      UI.tex(ctx.el.firstChild);

      const fails = n => {           // which bounds fail at this n
        const out = [];
        if (useUp && !(f(n) <= st.c2 * g(n))) out.push('up');
        if (useLo && !(st.c1 * g(n) <= f(n) && f(n) >= 0)) out.push('lo');
        return out;
      };
      const draw = () => {
        draw3d();
        const xMax = Math.max(6, st.n0 + 3), W = 520, Ht = 250, L = 46, B = 26, Tp = 12, Rt = 12;
        const ys = [];
        for (let x = 0; x <= xMax; x += .25) ys.push(f(x), useUp ? st.c2 * g(x) : 0, useLo ? st.c1 * g(x) : 0);
        const y0 = Math.min(0, ...ys), y1 = Math.max(...ys) * 1.05 || 1;
        const X = x => L + x / xMax * (W - L - Rt), Y = y => Tp + (1 - (y - y0) / (y1 - y0)) * (Ht - Tp - B);
        const path = fn => { let d = ''; for (let x = 0; x <= xMax + 1e-9; x += xMax / 120) d += (d ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(fn(x)).toFixed(1); return d; };
        const svg = S('svg', { viewBox: `0 0 ${W} ${Ht}` });
        for (let n = 1; n <= xMax; n++) {
          const bad = fails(n).length, ign = n < st.n0;
          if (ign || bad) svg.append(S('rect', { class: ign ? 'ign' : 'badz', x: X(n - .5), y: Tp, width: X(1) - X(0), height: Ht - Tp - B }));
        }
        svg.append(S('line', { class: 'ax', x1: L, y1: Y(0), x2: W - Rt, y2: Y(0) }), S('line', { class: 'ax', x1: L, y1: Tp, x2: L, y2: Ht - B }));
        for (let n = 0; n <= xMax; n++) svg.append(S('text', { class: 'tk', x: X(n), y: Ht - 8, 'text-anchor': 'middle' }, n));
        [y1 / 2, y1].forEach(v => svg.append(S('text', { class: 'tk', x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }, Math.round(v))));
        if (useUp) svg.append(S('path', { class: 'up', d: path(x => st.c2 * g(x)) }));
        if (useLo) svg.append(S('path', { class: 'lo', d: path(x => st.c1 * g(x)) }));
        svg.append(S('path', { class: 'f', d: path(f) }));
        for (let n = 1; n <= xMax; n++) svg.append(S('circle', { cx: X(n), cy: Y(f(n)), r: 4.5, class: n < st.n0 ? 'pt-ign' : fails(n).length ? 'pt-bad' : 'pt-ok' }));
        svg.append(S('line', { class: 'n0', x1: X(st.n0), y1: Tp, x2: X(st.n0), y2: Ht - B }), S('text', { class: 'lg', x: X(st.n0) + 4, y: Ht - B - 6, style: 'fill:var(--warn)' }, 'n₀'));
        let ly = Tp + 14;
        const leg = (txt, col) => { svg.append(S('text', { class: 'lg', x: L + 34, y: ly, style: `fill:${col}` }, txt)); ly += 15; };
        leg('f(n)', 'var(--acc)'); if (useUp) leg(`c₂·g(n) = ${st.c2}·${deg === 1 ? 'n' : 'n' + '²³'[deg - 2]}`, 'var(--acc2)'); if (useLo) leg(`c₁·g(n) = ${st.c1}·${deg === 1 ? 'n' : 'n' + '²³'[deg - 2]}`, 'var(--ok)');
        plotBox.innerHTML = ''; plotBox.append(svg);

        /* zoom: the ratio f(n)/g(n) must stay between c1 and c2 */
        const xr = Math.max(12, st.n0 + 4), rat = n => f(n) / g(n);
        const rv = [rat(1), lead, useUp ? st.c2 : 0, useLo ? st.c1 : 0];
        for (let n = 1; n <= xr; n++) rv.push(rat(n));
        const r0 = Math.min(0, ...rv), r1 = Math.max(...rv) * 1.15, H2 = 150;
        const X2 = x => L + (x - 1) / (xr - 1) * (W - L - Rt), Y2 = y => Tp + (1 - (y - r0) / (r1 - r0)) * (H2 - Tp - B);
        const sv2 = S('svg', { viewBox: `0 0 ${W} ${H2}` });
        for (let n = 1; n <= xr; n++) { const bad = fails(n).length, ign = n < st.n0; if (ign || bad) sv2.append(S('rect', { class: ign ? 'ign' : 'badz', x: X2(n - .5), y: Tp, width: X2(2) - X2(1), height: H2 - Tp - B })); }
        sv2.append(S('line', { class: 'ax', x1: L, y1: H2 - B, x2: W - Rt, y2: H2 - B }));
        for (let n = 1; n <= xr; n++) if (xr <= 14 || n % 2) sv2.append(S('text', { class: 'tk', x: X2(n), y: H2 - 8, 'text-anchor': 'middle' }, n));
        if (useUp) sv2.append(S('line', { class: 'up', x1: L, x2: W - Rt, y1: Y2(st.c2), y2: Y2(st.c2) }), S('text', { class: 'tk', x: L - 6, y: Y2(st.c2) + 4, 'text-anchor': 'end' }, 'c₂'));
        if (useLo) sv2.append(S('line', { class: 'lo', x1: L, x2: W - Rt, y1: Y2(st.c1), y2: Y2(st.c1) }), S('text', { class: 'tk', x: L - 6, y: Y2(st.c1) + 4, 'text-anchor': 'end' }, 'c₁'));
        let d = ''; for (let x = 1; x <= xr + 1e-9; x += (xr - 1) / 100) d += (d ? 'L' : 'M') + X2(x).toFixed(1) + ' ' + Y2(rat(x)).toFixed(1);
        sv2.append(S('path', { class: 'f', d }));
        for (let n = 1; n <= xr; n++) sv2.append(S('circle', { cx: X2(n), cy: Y2(rat(n)), r: 3.5, class: n < st.n0 ? 'pt-ign' : fails(n).length ? 'pt-bad' : 'pt-ok' }));
        sv2.append(S('text', { class: 'lg', x: L + 8, y: Tp + 12, style: 'fill:var(--acc)' }, `zoom: f(n)/g(n) → ${lead} as n grows`));
        ratioBox.innerHTML = ''; ratioBox.append(sv2);

        /* table n = 1..8 */
        const cols = Array.from({ length: 8 }, (_, k) => k + 1);
        const rows = [useLo ? 'c₁·g(n)' : null, 'f(n)', useUp ? 'c₂·g(n)' : null].filter(Boolean);
        const gr = UI.grid(rows.length, cols.length, { rows, cols: cols.map(n => 'n=' + n), corner: '' });
        cols.forEach((n, k) => {
          const fl = fails(n), ign = n < st.n0;
          rows.forEach((rw, ri) => {
            const v = rw === 'f(n)' ? f(n) : rw[1] === '₂' ? st.c2 * g(n) : st.c1 * g(n);
            const bad = !ign && ((rw[1] === '₂' && fl.includes('up')) || (rw[1] === '₁' && fl.includes('lo')));
            gr.set(ri, k, UI.fmt(v, 1), ign ? 'dim' : bad ? 'bad' : rw === 'f(n)' ? '' : 'ok');
          });
        });
        tbl.innerHTML = ''; tbl.append(gr.el);
        const bad = []; for (let n = st.n0; n <= 30; n++) if (fails(n).length) bad.push(n);
        status.innerHTML = bad.length ? `<span style="color:var(--bad)">✗ fails at n = ${bad.slice(0, 6).join(', ')}${bad.length > 6 ? ', …' : ''}</span>` : '<span style="color:var(--ok)">✓ no red zone for n ≥ n₀ (in view)</span>';
      };
      const slider = (key, label, min, max, step) => {
        const out = H('b', {}, st[key]);
        const inp = H('input', { type: 'range', min, max, step, value: st[key], oninput: e => { st[key] = +e.target.value; out.textContent = st[key]; draw(); } });
        sliders.append(H('div', { class: 'bigo-sl' }, H('span', {}, label), inp, out));
        return v => { inp.value = v; st[key] = +v; out.textContent = v; };
      };
      let set = {};
      const buildSliders = () => {
        sliders.innerHTML = '';
        if (useLo) set.c1 = slider('c1', 'c₁', .5, cMax, .5);
        if (useUp) set.c2 = slider('c2', 'c₂', .5, cMax, .5);
        set.n0 = slider('n0', 'n₀', 1, 15, 1);
        sliders.append(H('div', { class: 'ctrl' }, H('button', { class: 'btn pri', onclick: () => check() }, '✔ Check my proof')));
      };

      const check = () => {
        if (phase !== 'bounds') return;
        const { c1, c2, n0 } = st;
        if (useUp) {
          if (c2 < lead || (c2 === lead && firstGood(n => f(n) <= c2 * g(n)) === Infinity))
            return ctx.bad(`With \\(c_2 = ${c2}\\) the upper bound fails <b>forever</b>: \\(f(n)/${gt} \\to ${lead}\\), and the other terms keep \\(f(n) \\gt ${c2}${gt}\\). No \\(n_0\\) can save it. Pick \\(c_2 \\gt ${lead}\\); the recipe uses the sum of positive coefficients, \\(c_2 = ${sumPos}\\).`);
          for (let n = n0; n <= MAXN; n++) if (f(n) > c2 * g(n)) {
            const last = firstGood(m => f(m) <= c2 * g(m)) - 1;
            return ctx.bad(`Upper bound fails at \\(n = ${n}\\): \\(f(${n}) = ${UI.fmt(f(n))} \\gt c_2 g(${n}) = ${c2} \\cdot ${g(n)} = ${UI.fmt(c2 * g(n))}\\). Either raise \\(n_0\\) past \\(n = ${last}\\) or raise \\(c_2\\) (with \\(c_2 = ${sumPos}\\), the sum of positive coefficients, \\(n_0 = 1\\) works${c.some(a => a < 0) ? ' or nearly' : ''}).`);
          }
        }
        if (useLo) {
          if (c1 > lead || (c1 === lead && firstGood(n => c1 * g(n) <= f(n)) === Infinity))
            return ctx.bad(`With \\(c_1 = ${c1}\\) the lower bound fails <b>forever</b>: \\(f(n)/${gt} \\to ${lead}\\), so \\(${c1}${gt}\\) ends up above \\(f(n)\\). Pick \\(c_1 \\le ${lead}\\)${c.some(a => a < 0) ? ' (smaller than the leading coefficient, because of the minus term)' : ', e.g. the leading coefficient'}.`);
          for (let n = n0; n <= MAXN; n++) if (!(c1 * g(n) <= f(n) && f(n) >= 0)) {
            const last = firstGood(m => c1 * g(m) <= f(m) && f(m) >= 0) - 1;
            return ctx.bad(`Lower bound fails at \\(n = ${n}\\): \\(c_1 g(${n}) = ${c1} \\cdot ${g(n)} = ${UI.fmt(c1 * g(n))} \\gt f(${n}) = ${UI.fmt(f(n))}\\). Lower \\(c_1\\) or move \\(n_0\\) past \\(n = ${last}\\).`);
          }
        }
        if (c1 != null && c1 <= 0) return ctx.bad('\\(c_1\\) must be positive.');
        ctx.good(`Proof holds for every \\(n\\) from ${n0} to ${MAXN} and the constants respect the leading coefficient ${lead}, so it holds for all larger \\(n\\) too.`, 25);
        finish();
      };
      const finish = () => {
        phase = 'end'; draw();
        const { c1, c2, n0 } = st;
        const ineq = mode === 'O' ? `${ft} \\le ${c2}${gt}` : mode === 'Omega' ? `${c1}${gt} \\le ${ft}` : `${c1}${gt} \\le ${ft} \\le ${c2}${gt}`;
        const sym = mode === 'O' ? 'O' : mode === 'Omega' ? '\\Omega' : '\\Theta';
        const rc = mode === 'O' ? `c = ${sol.c2}` : mode === 'Omega' ? `c = ${sol.c1}` : `c_1 = ${sol.c1},\\ c_2 = ${sol.c2}`;
        ctx.done(`\\(${ineq}\\) for all \\(n \\ge ${n0}\\)<br>Your constants: ${mode === 'Theta' ? `\\(c_1 = ${c1},\\ c_2 = ${c2}\\)` : `\\(c = ${mode === 'O' ? c2 : c1}\\)`}, \\(n_0 = ${n0}\\)<br>Recipe answer: \\(${rc},\\ n_0 = ${sol.n0}\\)<br>\\(\\therefore f(n) = ${sym}(${gt})\\)`);
      };

      const gOpts = ['n', 'n^2', 'n^3', 'n \\log n', '1'];
      const gRight = deg === 1 ? 'n' : `n^${deg}`;
      const start = () => {
        ctx.task(`Step 1: for \\(f(n) = ${ft}\\), which \\(g(n)\\) goes inside the ${NAMES[mode]}?`);
        extra.innerHTML = '';
        extra.append(UI.choices(R.shuffle(gOpts).map(o => ({ label: `\\(${o}\\)`, value: o })), v => {
          if (v !== gRight) return ctx.bad(`\\(g(n)\\) is the <b>highest power</b> of \\(n\\) in \\(f\\), with its coefficient dropped: the term \\(${lead === 1 ? '' : lead}${gt}\\) gives \\(g(n) = ${gt}\\). Lower terms are the "fish next to the elephant".`);
          ctx.good(`\\(g(n) = ${gt}\\): the dominant term.`);
          phase = 'bounds'; extra.innerHTML = '';
          ctx.task(`Step 2: drag ${mode === 'Theta' ? '\\(c_1\\), \\(c_2\\)' : '\\(c\\)'} and \\(n_0\\) until there is <b>no red zone right of \\(n_0\\)</b>, then press Check.`);

        hint: () => phase === 'g' ? 'Look at the biggest power of n.'
          : `Recipe: ${useUp ? `\\(c_2\\) = sum of positive coefficients = ${sumPos}` : ''}${useUp && useLo ? '; ' : ''}${useLo ? `\\(c_1\\) = leading coefficient ${lead}${c.some(a => a < 0) ? ' or a bit less, because of the minus term' : ''}` : ''}. A valid choice: ${useLo ? `\\(c_1 = ${sol.c1}\\) ` : ''}${useUp ? `\\(c_2 = ${sol.c2}\\) ` : ''}\\(n_0 = ${sol.n0}\\).`,
        demoStep() {
          if (phase === 'g') return extra.querySelector('.choices').pick(gRight);

        },
      };
    },
  });
})();

/* Unit 2 · Growth Race: order functions by growth and find where they cross */
(() => {
  const H = UI.h, S = UI.s;
  document.head.append(H('style', {}, `

  const COL = [World.PAL[7], World.PAL[0], World.PAL[8], World.PAL[2], World.PAL[4]];
  const LG = n => Math.log2(n);
  const lnFact = (() => { const m = [0]; for (let k = 1; k <= 4000; k++) m[k] = m[k - 1] + Math.log(k); return n => m[Math.round(n)] ?? Infinity; })();
  /* growth classes in chain order */
  const CL = {
    log: { r: 0, th: '\\log n', tex: p => `${p.c === 1 ? '' : p.c}\\log n${p.d ? ' + ' + p.d : ''}`, v: (p, n) => p.c * LG(n) + p.d },
    sqrt: { r: 1, th: '\\sqrt n', tex: p => `${p.c === 1 ? '' : p.c}\\sqrt{n}${p.d ? ' + ' + p.d : ''}`, v: (p, n) => p.c * Math.sqrt(n) + p.d },
    lin: { r: 2, th: 'n', tex: p => `${p.c === 1 ? '' : p.c}n${p.d ? ' + ' + p.d : ''}`, v: (p, n) => p.c * n + p.d },
    nlog: { r: 3, th: 'n \\log n', tex: p => `${p.c === 1 ? '' : p.c}n\\log n${p.d ? ' + ' + p.d : ''}`, v: (p, n) => p.c * n * LG(n) + p.d },
    quad: { r: 4, th: 'n^2', tex: p => `${p.c === 1 ? '' : p.c}n^2${p.b ? ' + ' + p.b + 'n' : ''}${p.d ? ' + ' + p.d : ''}`, v: (p, n) => p.c * n * n + (p.b || 0) * n + p.d },
    cube: { r: 5, th: 'n^3', tex: p => `${p.c === 1 ? '' : p.c}n^3${p.d ? ' + ' + p.d : ''}`, v: (p, n) => p.c * n ** 3 + p.d },
    exp: { r: 6, th: '2^n', tex: () => '2^n', v: (p, n) => 2 ** n, lv: (p, n) => n * Math.LN2 },
    fact: { r: 7, th: 'n!', tex: () => 'n!', v: (p, n) => Math.exp(lnFact(n)), lv: (p, n) => lnFact(n) },
  };
  const lv = (F, n) => CL[F.k].lv ? CL[F.k].lv(F, n) : Math.log(Math.max(1e-3, CL[F.k].v(F, n)));
  const val = (F, n) => CL[F.k].v(F, n);
  const big = x => x < 1e6 ? UI.fmt(x, 1) : x.toExponential(2).replace('e+', '×10^');
  /* smallest n0 with slow(n) < fast(n) for all n in [n0, 3000] */
  const cross = (Sl, Fa) => { for (let n = 3000; n >= 1; n--) if (lv(Sl, n) >= lv(Fa, n) - 1e-12) return n + 1; return 1; };

  /* ---- 3D: a running track. Distance along the track = value of the function on a log scale (every mark is ×10) ---- */
  const SUP = s => String(s).replace(/\^(-?\d+)/g, (_, d) => d.split('').map(ch => ch === '-' ? '⁻' : '⁰¹²³⁴⁵⁶⁷⁸⁹'[ch]).join(''));
  const THT = { log: 'log n', sqrt: '√n', lin: 'n', nlog: 'n log n', quad: 'n²', cube: 'n³', exp: '2ⁿ', fact: 'n!' };
  const fnTxt = F => F.k === 'exp' || F.k === 'fact' ? THT[F.k] : (F.c === 1 ? '' : F.c) + THT[F.k] + (F.b ? ` + ${F.b}n` : '') + (F.d ? ` + ${F.d}` : '');
  const raceTrack = (W, items, o = {}) => {
    const C3 = World.C, K = items.length, LEN = 13, LZ = 1.5, x0 = -LEN / 2, Z = i => (i - (K - 1) / 2) * LZ, zb = Z(0) - LZ / 2, zf = Z(K - 1) + LZ / 2;
    const UX = u => x0 + Math.max(0, Math.min(1.04, u)) * LEN;
    W.slab({ w: LEN + 8, d: K * LZ + 4.4, x: -1.4, z: 1.5, color: C3.grass, h: .3 });
    const R = { UX, runners: [], tags: [], lanes: [] };
    items.forEach((it, i) => {
      const onClick = o.onPick ? () => o.onPick(i) : null;
      R.lanes[i] = W.box({ w: LEN + 2, h: .12, d: LZ - .1, x: .2, z: Z(i), color: i % 2 ? '#de8d68' : '#d67f59', r: .03, onClick });
      W.text(`${it.name}: ${it.txt}`, { x: x0 - 3.2, y: .6 + (K - 1 - i) * .7, z: Z(i), size: .72, bg: it.color, color: '#ffffff' });
      const g = R.runners[i] = W.group({ x: x0, y: .12, z: Z(i) }); g.scale.set(1.5, 1.5, 1.5);
      W.cyl({ parent: g, r: .27, rTop: .2, h: .7, y: .35, color: it.color });
      W.ball({ parent: g, r: .23, y: .93, color: '#f2c9a0' });
      W.box({ parent: g, w: .12, h: .3, d: .5, x: .12, y: .25, color: C3.ink, r: .04 });
      if (onClick) W.click(g, onClick);
      R.tags[i] = W.text('', { parent: g, x: 0, y: 1.55, z: 0, size: .48, bg: '#ffffff', color: '#12283a' });
    });
    W.box({ w: .1, h: .14, d: K * LZ, x: x0 - .45, color: '#ffffff', r: 0 });
    for (const t of o.ticks || []) {
      W.box({ w: .06, h: .135, d: K * LZ, x: UX(t.u), color: '#ffffff', r: 0, shadow: false });
      W.text(t.label, { x: UX(t.u), y: .5, z: zb - .6, size: .75, color: '#12283a' });
    }
    R.board = W.text('', { x: 0, y: 3.6 + K * .45, z: zb - .6, size: 1, bg: '#12283a', color: '#ffffff' });
    /* podium in front of the track: slowest on the lowest step */
    const pz = zf + 1.9, PX = k => (k - (K - 1) / 2) * 2.5 - 1; let nFlag = 0;
    for (let k = 0; k < K; k++) W.box({ w: 2.3, h: .35 + .3 * k, d: 1.3, x: PX(k), z: pz, color: '#f4f7f9', r: .05 });
    W.text('slowest', { x: PX(0) - 2.7, y: .4, z: pz, size: .7, color: '#12283a' });
    W.text('fastest', { x: PX(K - 1) + 2.7, y: .4, z: pz, size: .7, color: '#12283a' });
    R.place = (i, u, txt) => { R.runners[i].position.x = UX(u); if (txt != null) W.setText(R.tags[i], txt + (u > 1.04 ? ' →' : '')); };
    R.run = (i, u, txt, ms = 500) => { if (txt != null) W.setText(R.tags[i], txt + (u > 1.04 ? ' →' : '')); return W.move(R.runners[i], { x: UX(u) }, ms); };
    R.award = (i, k, txt, u) => {
      const m = W.cyl({ r: .5, h: .3, x: UX(u), y: 1.6, z: Z(i), color: items[i].color });
      W.text(txt, { parent: m, x: 0, y: .75, z: 0, size: .66, bg: '#ffffff', color: '#12283a' });
      return W.hop(m, { x: PX(k), y: .35 + .3 * k + .15, z: pz }, 700, 2);
    };
    R.flag = (u, i, j, txt) => {
      const z = (Z(i) + Z(j)) / 2, x = UX(u);
      const h = 2.6 + (nFlag++ % 2) * .9;
      W.cyl({ r: .05, h, x, z, color: C3.ink });
      W.text(txt, { x, y: h + .3, z, size: .66, bg: '#ffc53d', color: '#12283a' });
    };
    return R;
  };

  Game.level({
    id: 'growth', unit: 2, order: 30, icon: '🏁', title: 'Growth Race', tag: 'Order of growth · who wins for large n',
    scene: 'A race where each runner\'s distance is a function of n: who leads in the long run?',
    intro: `<ol><li>Throw away constants and smaller terms: keep each function's growth class.</li><li>Order the classes with the chain \\(1 \\lt \\log n \\lt \\sqrt n \\lt n \\lt n\\log n \\lt n^2 \\lt n^3 \\lt 2^n \\lt n!\\).</li><li>A big constant is only a head start: find the \\(n\\) where the faster class overtakes for good.</li></ol>`,
    story(W) {
      const PAL = World.PAL, fs = [n => 50 * n, n => n * n, n => 2 ** n];
      const R = raceTrack(W, [{ name: 'A', txt: '50n', color: PAL[7] }, { name: 'B', txt: 'n²', color: PAL[0] }, { name: 'C', txt: '2ⁿ', color: PAL[2] }],
        { ticks: [0, 1, 2, 3, 4, 5, 6].map(e => ({ u: e / 6, label: e ? SUP('10^' + e) : '1' })) });
      W.fit({ pad: 1.08 });
      const show = v => v < 1e6 ? String(v) : SUP(v.toExponential(1).replace('e+', '×10^'));
      const at = (n, ms) => { W.setText(R.board, 'n = ' + n); return Promise.all(fs.map((f, i) => ms ? R.run(i, Math.log10(f(n)) / 6, show(f(n)), ms) : R.place(i, Math.log10(f(n)) / 6, show(f(n))))); };
      const sweep = async (a, b) => { for (let n = a; n <= b; n += Math.max(1, Math.round((b - a) / 14))) { await at(n, 150); } await at(b, 150); };
      at(1);
      return [
        { text: 'Coach Kabir times three runners. After \\(n\\) seconds runner A has covered \\(50n\\) metres, B \\(n^2\\) and C \\(2^n\\). The track marks are ×10 apart. Who leads in the long run?',
          run: async () => { await at(1, 500); await Game.wait(300); } },
        { text: 'At \\(n = 2\\): A is at 100, B and C only at 4. A looks unbeatable, but the 50 is just a <b>head start</b> (a constant factor).',
          run: async () => { await at(2, 600); W.pop(R.runners[0]); await Game.wait(400); } },
        { text: 'C doubles every second. At \\(n = 8\\) it is still behind (256 vs 400), at \\(n = 9\\) it is ahead: \\(512 \\gt 450\\). That is the <b>crossover</b>: C beats A for every \\(n \\ge 9\\).',
          run: async () => { await sweep(3, 9); R.flag(Math.log10(480) / 6, 0, 2, 'C > A from n = 9'); await Game.wait(400); } },
        { text: 'B needs longer: \\(n^2 \\gt 50n\\) only when \\(n \\gt 50\\). At \\(n = 51\\): \\(2601 \\gt 2550\\), and B stays ahead for good. C has long left the chart.',
          run: async () => { await sweep(10, 51); R.flag(Math.log10(2575) / 6, 0, 1, 'B > A from n = 51'); await Game.wait(400); } },
        { text: 'So for large \\(n\\) the constants do not matter, only the <b>growth class</b>: A is \\(\\Theta(n)\\), B is \\(\\Theta(n^2)\\), C is \\(\\Theta(2^n)\\), and \\(n \\lt n^2 \\lt 2^n\\).',
          run: async () => { const us = fs.map(f => Math.log10(f(51)) / 6); await R.award(0, 0, 'A: Θ(n)', us[0]); await R.award(1, 1, 'B: Θ(n²)', us[1]); await R.award(2, 2, 'C: Θ(2ⁿ)', us[2]); } },
        { text: 'To rank any functions: keep the dominant term, drop constants, and place it on the chain \\(1 \\lt \\log n \\lt \\sqrt n \\lt n \\lt n\\log n \\lt n^2 \\lt n^3 \\lt 2^n \\lt n!\\). Ranking is a lookup; a crossover is found by plugging in \\(n\\).',
          run: async () => { W.setText(R.board, 'log n < √n < n < n log n < n² < n³ < 2ⁿ < n!'); for (const r of R.runners) W.pop(r); await Game.wait(300); } },
      ];
    },
    formula: `\\[1 \\lt \\log n \\lt \\sqrt{n} \\lt n \\lt n\\log n \\lt n^2 \\lt n^3 \\lt 2^n \\lt n! \\lt n^n\\]<p>The chart's y-axis is logarithmic, so every step up is ×10.</p>`,
    exam: { f: [{ k: 'quad', c: 3, b: 2, d: 5 }, { k: 'nlog', c: 5, d: 100 }, { k: 'exp', c: 1, d: 0 }] },
    examSrc: '2024 Final Q6b · A = 3n²+2n+5, B = 5n log n + 100, C = 2ⁿ',
    make(r, d) {
      const K = [3, 4, 5][d - 1];
      const pool = d === 1 ? ['log', 'lin', 'nlog', 'quad', 'exp'] : ['log', 'sqrt', 'lin', 'nlog', 'quad', 'cube', 'exp', 'fact'];
      for (let t = 0; t < 800; t++) {
        const ks = r.shuffle(pool).slice(0, K);
        const f = ks.map(k => ({ k, c: k === 'exp' || k === 'fact' ? 1 : r.pick([1, 2, 3, 5, 10, 20, 50]), d: k === 'exp' || k === 'fact' ? 0 : r.pick([0, 0, 5, 100]), b: k === 'quad' ? r.pick([0, 2]) : 0 }));
        const pr = this.pairs({ f });
        if (pr.length && pr.length <= 2 && pr.every(p => p.n <= 120) && pr.some(p => p.n >= 3)) return { f: r.shuffle(f) };
      }
      return { f: [{ k: 'lin', c: 50, d: 0 }, { k: 'quad', c: 1, d: 0 }, { k: 'log', c: 1, d: 5 }] };
    },
    /* adjacent pairs in the true order whose crossover is past n = 1 */
    pairs({ f }) {
      const o = f.map((F, i) => i).sort((a, b) => CL[f[a].k].r - CL[f[b].k].r);
      const out = [];
      for (let k = 0; k + 1 < o.length; k++) { const n = cross(f[o[k]], f[o[k + 1]]); if (n >= 2) out.push({ s: o[k], q: o[k + 1], n }); }
      return out;
    },
    mount(ctx) {
      const { f } = ctx.inst, K = f.length, R = ctx.rng, easy = ctx.diff === 1;
      const name = i => 'ABCDE'[i];
      const order = f.map((F, i) => i).sort((a, b) => CL[f[a].k].r - CL[f[b].k].r);
      const pairs = this.pairs(ctx.inst);
      const maxN = Math.max(20, Math.min(150, Math.ceil(Math.max(0, ...pairs.map(p => p.n)) * 1.8)));
      let n = 1, phase = 'order', got = [], pi = 0, raceId = 0;

      /* cards */
      const cards = f.map((F, i) => {
        const b = H('button', { class: 'btn', style: `--gc:${COL[i]}`, onclick: () => pick(i) }, H('b', {}, name(i) + ': '), H('span', { html: `\\(${CL[F.k].tex(F)}\\)` }));
        return b;
      });
      const ordEl = H('div', { class: 'growth-order' }, H('span', { class: 'mut' }, 'slowest →'));
      /* 3D track: same log scale as the chart below */
      const W = ctx.world, ln10 = Math.LN10;
      const sec = [...f].sort((a, c) => CL[a.k].r - CL[c.k].r)[Math.max(0, K - 2)];
      const yHi = Math.max(3, Math.min(Math.max(...f.map(F => lv(F, maxN))) / ln10, Math.max(6, lv(sec, maxN) / ln10 * 1.6)));
      const yLo = Math.max(-1, Math.min(0, ...f.map(F => lv(F, 1) / ln10)));
      const U = (F, v) => (lv(F, v) / ln10 - yLo) / (yHi - yLo);
      const ticks = []; for (let e = Math.ceil(yLo); e <= yHi; e += Math.max(1, Math.ceil(yHi / 6))) ticks.push({ u: (e - yLo) / (yHi - yLo), label: e === 0 ? '1' : SUP('10^' + e) });
      const R3 = raceTrack(W, f.map((F, i) => ({ name: name(i), txt: fnTxt(F), color: COL[i] })), { ticks, onPick: i => pick(i) });
      W.fit({ pad: .9 });
      const nOut = H('b', { style: 'color:var(--acc);min-width:44px' }, '1');
      const slider = H('input', { type: 'range', min: 1, max: maxN, step: 1, value: 1, oninput: e => { raceId++; setN(+e.target.value); } });
      const bRace = H('button', { class: 'btn', onclick: () => race() }, '▶ Race');
      const chart = H('div', { class: 'growth-chart' });
      const extra = H('div');
      ctx.el.append(H('div', { class: 'growth-cards' }, cards), ordEl, extra,
        H('div', { class: 'growth-sl' }, H('span', {}, 'n ='), slider, nOut, bRace),
        H('div', { class: 'growth-wrap' }, chart));
      UI.tex(ctx.el);

      const setN = v => {
        n = v; slider.value = v; nOut.textContent = v;
        f.forEach((F, i) => R3.place(i, U(F, n), `${name(i)} = ${SUP(big(val(F, n)))}`));
        W.setText(R3.board, 'n = ' + n);
        drawChart();
      };
      const drawChart = () => {
        const W = 520, Ht = 280, l = 50, b = 26, t = 12, rr = 12, ln10 = Math.LN10;
        const second = [...f].sort((a, c) => CL[a.k].r - CL[c.k].r)[Math.max(0, K - 2)];
        const yMax = Math.max(3, Math.min(Math.max(...f.map(F => lv(F, maxN))) / ln10, Math.max(6, lv(second, maxN) / ln10 * 1.6)));
        const yMin = Math.max(-1, Math.min(0, ...f.map(F => lv(F, 1) / ln10)));
        const X = x => l + (x - 1) / (maxN - 1) * (W - l - rr), Y = y => t + (1 - (y - yMin) / (yMax - yMin)) * (Ht - t - b);
        const svg = S('svg', { viewBox: `0 0 ${W} ${Ht}` });
        const cid = 'gc' + Math.random().toString(36).slice(2, 7);
        svg.append(S('defs', {}, S('clipPath', { id: cid }, S('rect', { x: l, y: t, width: W - l - rr, height: Ht - t - b }))));
        for (let e = Math.ceil(yMin); e <= yMax; e += Math.max(1, Math.ceil(yMax / 6))) {
          svg.append(S('line', { class: 'ax', x1: l, x2: W - rr, y1: Y(e), y2: Y(e), style: 'opacity:.35' }), S('text', { class: 'tk', x: l - 6, y: Y(e) + 4, 'text-anchor': 'end' }, e === 0 ? '1' : '10' + String(e).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'[ch]).join('')));
        }
        svg.append(S('line', { class: 'ax', x1: l, y1: Ht - b, x2: W - rr, y2: Ht - b }));
        const step = Math.max(1, Math.round(maxN / 8 / 5) * 5);
        for (let x = 1; x <= maxN; x += x === 1 ? step - 1 : step) svg.append(S('text', { class: 'tk', x: X(x), y: Ht - 8, 'text-anchor': 'middle' }, x));
        const g = S('g', { 'clip-path': `url(#${cid})` }); svg.append(g);
        const labs = [];
        f.forEach((F, i) => {
          let d = ''; for (let x = 1; x <= maxN + 1e-9; x += (maxN - 1) / 200) d += (d ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(lv(F, x) / ln10).toFixed(1);
          g.append(S('path', { d, style: `fill:none;stroke:${COL[i]};stroke-width:2.6` }));
          const xl = Math.min(maxN, Math.max(1, [...Array(maxN).keys()].map(k => k + 1).filter(x => lv(F, x) / ln10 <= yMax).pop() || 1));
          labs.push({ i, x: Math.min(X(xl) + 4, W - rr - 10), y: Math.max(t + 12, Y(lv(F, xl) / ln10) - 4) });
        });
        labs.sort((p, q) => p.y - q.y).forEach((p, k, arr) => { if (k && Math.abs(p.x - arr[k - 1].x) < 20 && p.y - arr[k - 1].y < 14) p.y = arr[k - 1].y + 14; });
        labs.forEach(p => svg.append(S('text', { x: p.x, y: p.y, style: `fill:${COL[p.i]};font:700 13px var(--head)` }, name(p.i))));
        pairs.forEach((p, k) => { if (k < pi || phase === 'end') { const x = p.n; svg.append(S('circle', { cx: X(x), cy: Y(lv(f[p.s], x) / ln10), r: 5, style: 'fill:var(--warn);stroke:var(--card);stroke-width:2' })); } });
        svg.append(S('line', { x1: X(n), x2: X(n), y1: t, y2: Ht - b, style: 'stroke:var(--acc);stroke-width:2;stroke-dasharray:4 4' }));
        svg.append(S('text', { x: l + 6, y: t + 14, class: 'tk' }, 'log scale: value'), S('text', { x: W - rr - 4, y: Ht - b - 6, class: 'tk', 'text-anchor': 'end' }, 'n →'));
        chart.innerHTML = ''; chart.append(svg);
      };
      const race = async () => {
        const id = ++raceId;
        for (let v = 1; v <= maxN; v += Math.max(1, Math.round(maxN / 60))) { if (id !== raceId) return; setN(v); await Game.wait(60); }
        if (id === raceId) setN(maxN);
      };

      const why = (i, b) => `${name(i)} is \\(\\Theta(${CL[f[i].k].th})\\) but ${name(b)} is \\(\\Theta(${CL[f[b].k].th})\\), and \\(${CL[f[b].k].th}\\) comes earlier in the chain \\(\\log n \\lt \\sqrt n \\lt n \\lt n\\log n \\lt n^2 \\lt n^3 \\lt 2^n \\lt n!\\). Constants like ${f[i].c > 1 || f[i].d ? 'the ones in front' : 'these'} do not change the class.`;
      const pick = i => {
        if (phase !== 'order' || got.includes(i)) return;
        const want = order[got.length];
        if (i !== want) { W.shake(R3.runners[i]); return ctx.bad(why(i, want)); }
        R3.award(i, got.length, `${name(i)}: Θ(${THT[f[i].k]})`, U(f[i], n));
        got.push(i); cards[i].classList.add('done'); cards[i].disabled = true;
        ordEl.append(H('span', { class: 'chip', style: `--gc:${COL[i]}`, html: `${name(i)}: \\(\\Theta(${CL[f[i].k].th})\\)` }), got.length < K ? H('span', { class: 'mut' }, '<') : '');
        UI.tex(ordEl);
        ctx.good(`${name(i)} \\(= \\Theta(${CL[f[i].k].th})\\)${got.length === 1 ? ' is the slowest-growing.' : got.length === K ? ' grows fastest.' : '.'}`);

      };
      const next = () => {
        extra.innerHTML = '';
        if (pi >= pairs.length) return finish();
        const p = pairs[pi], A = name(p.s), B = name(p.q);
        ctx.task(`${A} grows slower than ${B}, but not at the start. From which \\(n\\) on is <b>${A} \\(\\lt\\) ${B} for good</b>? Drag the slider to explore.`);

          if (!UI.same(v, p.n, 0)) {
            const m = p.n - 1;
            return ctx.bad(`At \\(n = ${m}\\): ${A} \\(= ${big(val(f[p.s], m))} \\ge\\) ${B} \\(= ${big(val(f[p.q], m))}\\). At \\(n = ${p.n}\\): ${A} \\(= ${big(val(f[p.s], p.n))} \\lt\\) ${B} \\(= ${big(val(f[p.q], p.n))}\\), and it stays that way. So the answer is \\(n = ${p.n}\\).`);
          }
          raceId++; setN(Math.min(maxN, p.n));
          ctx.good(`From \\(n = ${p.n}\\): ${A}(${p.n}) \\(= ${big(val(f[p.s], p.n))} \\lt\\) ${B}(${p.n}) \\(= ${big(val(f[p.q], p.n))}\\). Before that ${A}'s head start (its constants) keeps it ahead.`);
          R3.flag(U(f[p.s], p.n), p.s, p.q, `${A} < ${B} from n = ${p.n}`);
          pi++; drawChart(); next();
        };
        if (easy) {
          const opts = R.shuffle([...new Set([p.n, p.n + 1, Math.max(1, p.n - 1), p.n + 3, Math.max(1, p.n - 3)])].slice(0, 4));
          extra.append(UI.choices(opts.map(v => ({ label: 'n = ' + v, value: String(v) })), onAns));
        } else extra.append(UI.ask('from n =', onAns));
      };
      const finish = () => {
        phase = 'end'; extra.innerHTML = ''; drawChart();
        const chain = order.map(i => `${name(i)}\\,(${CL[f[i].k].th})`).join(' \\lt ');
        const cr = pairs.map(p => `${name(p.s)} \\(\\lt\\) ${name(p.q)} from \\(n = ${p.n}\\)`).join('; ');
        ctx.done(`Slowest to fastest: \\(${chain}\\)<br>Slowest: ${name(order[0])}; fastest: ${name(order[K - 1])}.<br>${cr ? 'Crossovers: ' + cr + '.' : ''}`);
      };
      ctx.task('Click the functions from <b>slowest</b> growing to <b>fastest</b> growing (as \\(n \\to \\infty\\)).');
      setN(Math.min(maxN, 5)); race();
      return {
        hint: () => phase === 'order' ? `Drop constants; compare growth classes. Next is ${name(order[got.length])}.` : `Drag the slider around \\(n = ${pairs[pi]?.n}\\) and compare the two bars.`,
        demoStep() {
          if (phase === 'order') return pick(order[got.length]);
          if (phase === 'cross') { const p = pairs[pi]; const ch = extra.querySelector('.choices'); if (ch) ch.pick(String(p.n)); else extra.querySelector('.ask').submit(String(p.n)); }
        },
      };
    },
  });
})();

      groups: N => [...Array(N).keys()].map(i => 'i=' + i), cnt: (N, g) => g,

      th: 'Θ(N²)', sumWhy: 'Inner counts are \\(0, 1, \\dots, N-1\\). Their sum is \\(\\frac{N(N-1)}{2}\\).',

      groups: N => pows(N).map(i => 'i=' + i), cnt: N => N,

      th: 'Θ(N log N)', sumWhy: '\\(N\\) outer runs, each with \\(\\lceil\\log_2 N\\rceil\\) inner runs: nested loops multiply.',

    seq: {
