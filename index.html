        },
      };
    },
  });
})();

/* ==== u3_quick.js ==== */
/* Unit 3 · Quick sort, the course's Partition: first element = pivot, ∞ sentinel,
   i right while A[i] < pivot, j left while A[j] > pivot, swap if i < j, else swap(A[l], A[j]). */
document.head.append(UI.h('style', {}, `
.u3qs svg.g .node .tag{paint-order:stroke;stroke:var(--card);stroke-width:5px;font-size:11px}
.u3qs table.st{border-collapse:collapse;font:12.5px var(--mono);margin-top:10px}
.u3qs table.st td,.u3qs table.st th{border:1px solid var(--line);padding:3px 7px;text-align:center;white-space:nowrap}
.u3qs table.st th{color:var(--mut);font-weight:600}
.u3qs table.st tr.call td{background:var(--card2);color:var(--acc);text-align:left;font-weight:700}
.u3qs .arr .ptrs span{font-size:13px}
`));
(() => {
  const GOLD = '#ffc53d', CI = '#3d9be9', CJ = '#e2557a';
  /* animations run one after another in a queue; the game never waits for them */
  const mkQ = () => { let q = Promise.resolve(); return fn => { const sp = window.__FAST || window.__TEST ? 0 : 1; return q = q.then(() => fn(sp)).catch(e => console.error(e)); }; };

  /* the 3D warehouse: crates on a conveyor (last slot = the ∞ wall), two robot arms i and j on an overhead rail,
     a pedestal that lifts the pivot crate. All bookkeeping (which crate is in which slot) is plain JS, done when a move is queued. */
  function belt(W, vals, o = {}) {
    const C = World.C, N = vals.length, Q = mkQ(), SP = 1.45, BY = .5, RY = 4.7, TIP = 3.55;
    const X = k => (k - (N - 1) / 2) * SP;
    const fin = vals.filter(Number.isFinite), lo = Math.min(...fin), hi = Math.max(...fin);
    const ch = v => Number.isFinite(v) ? .75 + .85 * (hi === lo ? .5 : (v - lo) / (hi - lo)) : 2.2;
    const len = N * SP + .8;
    W.slab({ w: len + 2.4, d: 5, color: '#cfd8de', h: .25 });                                                  // warehouse floor
    W.slab({ w: len, d: 2, y: BY, h: .28, color: '#3c4f63' });                                                // belt
    for (const z of [-1.05, 1.05]) W.box({ w: len + .1, h: .16, d: .12, y: BY + .02, z, color: C.steel, r: .03 });
    for (let x = -len / 2 + .5; x <= len / 2 - .4; x += 2.9) for (const z of [-.8, .8]) W.box({ w: .22, h: BY - .28, d: .22, x, z, color: '#56667a', r: .03 });
    for (const x of [-len / 2 - .5, len / 2 + .5]) { W.box({ w: .26, h: RY, d: .26, x, z: -1.5, color: C.steel, r: .05 }); W.box({ w: .26, h: .26, d: 1.6, x, z: -.8, y: RY, color: C.steel, r: .05 }); }
    W.box({ w: len + 1.3, h: .2, d: .2, y: RY, z: 0, color: '#7c8f9d', r: .05 });                             // overhead rail
    const zone = W.box({ w: 1, h: .05, d: 1.9, y: BY + .03, color: '#ffe08a', r: 0, shadow: false }); zone.visible = false;
    const ped = W.box({ w: 1.2, h: .5, d: 1.2, y: BY + .25, color: GOLD, r: .08 }); ped.visible = false;
    const cr = vals.map((v, k) => {
      const inf = !Number.isFinite(v), h = ch(v);
      const m = W.box({ w: 1.06, h, d: inf ? 1.5 : 1.06, x: X(k), y: BY + h / 2, color: inf ? '#56667a' : C.wood, r: .07, label: inf ? '∞' : v, labelOpts: { size: .62, dy: .45 } });
      if (!inf) { W.box({ parent: m, w: 1.08, h: .1, d: 1.08, y: h / 2 - .22, color: C.woodDark, r: 0, shadow: false }); W.box({ parent: m, w: 1.08, h: .1, d: 1.08, y: -h / 2 + .22, color: C.woodDark, r: 0, shadow: false }); }
      W.click(m, () => o.onCrate && o.onCrate(slots.indexOf(c)));
      if (!o.noIdx) W.text(`[${k}]`, { x: X(k), y: .3, z: 1.75, size: .5, color: '#3d5a70' });
      const c = { m, h, v }; return c;
    });
    const slots = cr.slice(), done = cr.map(() => false);
    const mkArm = (name, col, off) => {
      const g = W.group({ x: X(name === 'i' ? 0 : N - 1) + off });
      W.box({ parent: g, w: .62, h: .42, d: .62, y: RY, color: col, r: .08 });
      W.cyl({ parent: g, r: .07, h: RY - TIP - .3, y: (RY + TIP + .3) / 2, color: '#56667a' });
      const tip = W.cone({ parent: g, r: .24, h: .5, y: TIP + .25, color: col }); tip.rotation.x = Math.PI;
      W.text(name, { parent: g, x: 0, y: RY + .75, z: 0, size: .72, bg: col, color: '#ffffff' });
      g.visible = false; return g;
    };
    const arm = { i: mkArm('i', CI, -.2), j: mkArm('j', CJ, .2) }, off = { i: -.2, j: .2 }, at = { i: 0, j: N - 1 };
    W.fit({ dir: [.1, .5, 1], pad: o.pad || .9 });
    const baseY = c => BY + c.h / 2;
    return {
      Q, X,
      /* slide an arm along the rail to slot k */
      arm(name, k) { const dist = Math.abs(k - at[name]), c = slots[k]; at[name] = k; return Q(async sp => { arm[name].visible = true; await W.move(arm[name], { x: X(k) + off[name] }, (240 + 150 * dist) * sp); W.pop(c.m); }); },
      /* start partitioning slots l..h-1: mat under the segment, pivot crate up on the pedestal, arms to both ends */
      call(l, h) {
        const piv = slots[l], vis = slots.map((c, k) => (k >= l && k <= h) || done[k] ? 1 : .3), snap = slots.slice();
        Q(async sp => {
          zone.visible = true;
          await Promise.all([W.to(zone.scale, { x: (h - l) * SP - .2 }, 300 * sp), W.move(zone, { x: (X(l) + X(h - 1)) / 2 }, 300 * sp), ...snap.map((c, k) => W.fade(c.m, vis[k], 250 * sp))]);
          ped.visible = true; ped.position.x = X(l); ped.position.y = BY - .3;
          W.move(ped, { y: BY + .25 }, 350 * sp); W.glow(piv.m, GOLD);
          await W.move(piv.m, { y: baseY(piv) + .5 }, 350 * sp);
        });
        this.arm('i', l); return this.arm('j', h);
      },
      /* two crates swap places with a hop */
      swap(a, b) {
        const ca = slots[a], cb = slots[b]; slots[a] = cb; slots[b] = ca;
        return Q(async sp => { await Promise.all([W.hop(ca.m, { x: X(b) }, 620 * sp, 1.5), W.hop(cb.m, { x: X(a) }, 620 * sp, 2.4)]); });
      },
      /* the pivot leaves the pedestal at slot l and lands in its final slot j (green) */
      home(l, j) {
        const cp = slots[l], cj = slots[j]; slots[l] = cj; slots[j] = cp; done[j] = true;
        return Q(async sp => {
          W.glow(cp.m, null);
          const ps = [W.hop(cp.m, { x: X(j), y: baseY(cp) }, 650 * sp, 1.6)];
          if (l !== j) ps.push(W.hop(cj.m, { x: X(l), y: baseY(cj) }, 650 * sp, 2.5));
          await Promise.all(ps);
          ped.visible = false; await W.paint(cp.m, C.ok, 250 * sp); W.pop(cp.m);
        });
      },
      /* a one-crate segment is already in place */
      single(k) { const c = slots[k]; done[k] = true; return Q(async sp => { await Promise.all([W.fade(c.m, 1, 200 * sp), W.paint(c.m, C.ok, 250 * sp)]); }); },
      shake(k) { const c = slots[k]; return Q(() => { c && W.shake(c.m); }); },
      finish() {
        const snap = slots.slice();
        return Q(async sp => { zone.visible = false; ped.visible = false; arm.i.visible = arm.j.visible = false; await Promise.all(snap.map(c => Promise.all([W.fade(c.m, 1, 200 * sp), Number.isFinite(c.v) ? W.paint(c.m, C.ok, 250 * sp) : 0]))); snap.forEach(c => { if (Number.isFinite(c.v)) W.pop(c.m); }); await Game.wait(300 * sp); });
      },
    };
  }

  Game.level({
    id: 'quick', unit: 3, order: 30, icon: '⚡', title: 'Quick Sort Partition', tag: 'D&C · split hard, combine free', scene: 'Sort crates on the warehouse conveyor with two robot arms and a pivot',
    intro: `<p>Pivot = the <b>first</b> element \\(A[l]\\); an \\(\\infty\\) sentinel sits after the array.</p>
<p>\\(i\\) moves right and stops at the first \\(A[i] \\ge\\) pivot. \\(j\\) moves left and stops at the first \\(A[j] \\le\\) pivot.</p>
<p>If \\(i \\lt j\\): swap \\(A[i], A[j]\\) and keep scanning. Once they cross: swap the pivot with \\(A[j]\\); \\(j\\) is its final place.</p>
<p>Quick-sort the left part, then the right part. Nothing to combine.</p>`,
    formula: `<p>Best (pivot halves the array): \\(T(n) = 2T(n/2) + n\\). Master's: \\(a=2,b=2,k=1,p=0\\), Case 2 \\(\\Rightarrow \\Theta(n\\log n)\\).</p><p>Worst (sorted input, end pivot): \\(T(n) = T(n-1) + n = \\frac{n(n+1)}{2} = O(n^2)\\).</p><p>In place; stack \\(O(\\log n)\\) to \\(O(n)\\).</p>`,
    exam: { a: [25, 36, 12, 4, 5, 16, 58, 54, 24, 16, 9, 65, 78] },
    examSrc: '2025 Final Q3a · 25,36,12,4,5,16,58,54,24,16,9,65,78, pivot 25',
    make(r, d) {
      const n = [r.int(6, 7), r.int(9, 10), 12][d - 1];
      const a = Array.from({ length: n }, () => r.int(1, d === 1 ? 40 : 99));
      if (d > 1) a[r.int(1, n - 1)] = a[r.int(1, n - 1)];   // a duplicate now and then (like the two 16s in the exam)
      return { a };
    },
    /* story: Kabir's warehouse, crates 5 8 2 9 3 */
    story(W) {
      const B = belt(W, [5, 8, 2, 9, 3, Infinity], { noIdx: true, pad: 1 });
      const pause = ms => B.Q(sp => Game.wait(ms * sp));
      return [
        { text: 'Kabir must put the crates on his conveyor in order. He takes the <b>first crate, 5</b>, as the <b>pivot</b> and lifts it up. Goal: smaller crates to its left, bigger ones to its right.',
          run: async () => { await B.call(0, 5); } },
        { text: 'Robot arm <b>i</b> walks right, passing every crate smaller than 5. It stops at the first crate \\(\\ge 5\\): the <b>8</b>.',
          run: async () => { await B.arm('i', 1); } },
        { text: 'Arm <b>j</b> starts at the \\(\\infty\\) wall and walks left, passing every crate bigger than 5. It stops at the first crate \\(\\le 5\\): the <b>3</b>.',
          run: async () => { await B.arm('j', 4); } },
        { text: '\\(i \\lt j\\): the 8 is too big for the left side and the 3 too small for the right. <b>Swap them</b> and keep scanning.',
          run: async () => { await pause(300); await B.swap(1, 4); } },
        { text: 'i moves on past 2 and stops at <b>9</b>. j moves on past 9 and stops at <b>2</b>. Now \\(i \\ge j\\): the arms have <b>crossed</b>.',
          run: async () => { await B.arm('i', 2); await B.arm('i', 3); await pause(250); await B.arm('j', 3); await B.arm('j', 2); } },
        { text: 'Crossed means the scan is over: <b>swap the pivot with crate j</b>. The 5 is now in its final place, with 2, 3 on its left and 9, 8 on its right.',
          run: async () => { await pause(300); await B.home(0, 2); } },
        { text: 'Repeat on each side; there is nothing to combine. A pivot that halves the row gives \\(T(n) = 2T(n/2) + n = \\Theta(n \\log n)\\). An already sorted row gives \\(T(n) = T(n-1) + n = O(n^2)\\).',
          run: async () => { await B.call(0, 2); await pause(300); await B.home(0, 0); await B.single(1); await B.call(3, 5); await pause(300); await B.home(3, 4); await B.single(3); await B.finish(); } },
      ];
    },
    mount(ctx) {
      const H = UI.h, W = ctx.world, d = ctx.diff, n = ctx.inst.a.length;
      const A = ctx.inst.a.concat([Infinity]);
      ctx.el.classList.add('u3qs');
      const show = v => v === Infinity ? '∞' : v;
      const B = belt(W, A, { onCrate: k => click(k) });
      const arr = UI.arr(A.map(show), { idx: true, label: 'A (∞ = sentinel)', onClick: k => click(k) });
      const info = H('div', { class: 'note', style: 'margin:2px 0 6px' });
      const extra = H('div');
      const tree = UI.tree({ r: 17, levelH: 58, gap: 64 });
      const tbody = H('tbody');
      const table = H('table', { class: 'st' }, H('thead', {}, H('tr', {}, ['Pass', 'i stops', 'j stops', 'Action', 'Array after'].map(t => H('th', {}, t)))), tbody);
      if (!W.real) ctx.el.append(arr.el);   // flat fallback when 3D is unavailable
      ctx.el.append(info, extra);
      if (!W.real) ctx.el.append(H('div', { class: 'note', style: 'margin-top:8px' }, 'Recursion tree (node = pivot, tag = range)'), tree.el);
      ctx.el.append(H('div', { style: 'overflow-x:auto' }, table));
      const final = new Array(n).fill(false);
      let root = null, stack = [], seg = null, i, j, piv, pass, phase = 'i', calls = 0, firstResult = null;
      const drawTree = () => {
        if (!root) return;
        const conv = x => ({ id: 'q' + x.l + '_' + x.h, label: x.leaf ? show(A[x.l]) : x.pv, tag: x.h - x.l > 1 ? `[${x.l}..${x.h - 1}]` : '', cls: x === seg?.node ? 'hi' : x.done ? 'ok' : '', kids: (x.kids || []).map(conv) });
        tree.render(conv(root));
      };
      const paint = () => {
        arr.clear('hi dim piv done sel');
        for (let k = 0; k <= n; k++) {
          if (final[k]) arr.cls(k, 'done');
          if (seg && (k < seg.l || k > seg.h)) arr.cls(k, 'dim');
        }
        if (seg) {
          arr.cls(seg.l, 'piv');
          arr.ptr('p', seg.l); arr.ptr('i', i); arr.ptr('j', j);
          info.innerHTML = `Segment [${seg.l}..${seg.h - 1}] · pivot = <b>${piv}</b> · i = ${i} · j = ${j}${seg.h === n ? '' : ` · A[${seg.h}] = ${show(A[seg.h])} acts as the sentinel`}`;
        } else { arr.ptr('p', -1); arr.ptr('i', -1); arr.ptr('j', -1); info.textContent = ''; }
        drawTree();
      };
      const addNode = (l, h, parent) => {
        const x = { l, h, kids: [], leaf: h - l === 1 };
        if (parent) parent.kids.push(x); else root = x;
        return x;
      };
      const nextCall = () => {
        extra.innerHTML = '';
        while (stack.length) {
          const s = stack.pop();
          if (s.h - s.l <= 0) continue;
          const node = addNode(s.l, s.h, s.parent);
          if (s.h - s.l === 1) { node.done = true; final[s.l] = true; B.single(s.l); ctx.say(`Segment [${s.l}..${s.l}] = ${A[s.l]} has one crate: already in place.`); continue; }
          seg = { l: s.l, h: s.h, node }; piv = A[s.l]; node.pv = piv; i = s.l; j = s.h; pass = 1; calls++;
          tbody.append(H('tr', { class: 'call' }, H('td', { colspan: 5 }, `Call ${calls}: segment [${s.l}..${s.h - 1}] = ${A.slice(s.l, s.h).join(' ')}, pivot = ${piv}`)));
          B.call(s.l, s.h);

      const expJ = () => { let k = j - 1; while (A[k] > piv) k--; return k; };
      const askI = () => ctx.task(`Pass ${pass}: arm <b>i</b> moves right from ${i}. Click the crate where it stops (first \\(A[i] \\ge ${piv}\\)).`);
      const askJ = () => ctx.task(`Pass ${pass}: arm <b>j</b> moves left from ${j}. Click the crate where it stops (first \\(A[j] \\le ${piv}\\)).`);
      let rowI = null;
      const click = k => {
        if (!seg || (phase !== 'i' && phase !== 'j') || k < 0) return;
        if (phase === 'i') {
          const e = expI();
          if (k === e) {
            i = k; rowI = k; phase = 'j'; paint(); B.arm('i', k);
            ctx.good(`i stops at ${k}: \\(A[${k}] = ${show(A[k])} \\ge ${piv}\\)${k === seg.h ? ' (the sentinel stops it)' : ''}.`, 6);
            return askJ();
          }
          B.shake(k);
          if (k <= i) return ctx.bad(`i only moves <b>right</b>: the scan starts at \\(i+1 = ${i + 1}\\) (the do-while increments first).`);
          if (k < e) return ctx.bad(`\\(A[${k}] = ${show(A[k])} \\lt ${piv}\\), so i keeps moving. It stops at the first value \\(\\ge\\) the pivot: \\(A[${e}] = ${show(A[e])}\\).`);
          return ctx.bad(`Too far. i stops at the <b>first</b> \\(A[i] \\ge ${piv}\\): that is \\(A[${e}] = ${show(A[e])}\\) at index ${e}.`);
        }
        const e = expJ();
        if (k === e) {
          j = k; phase = 'act'; paint(); B.arm('j', k);
          ctx.good(`j stops at ${k}: \\(A[${k}] = ${A[k]} \\le ${piv}\\)${k === seg.l ? ' (the pivot itself stops it)' : ''}.`, 6);
          return askAct();
        }
        B.shake(k);
        if (k >= j) return ctx.bad(`j only moves <b>left</b>: the scan starts at \\(j-1 = ${j - 1}\\).`);
        if (k > e) return ctx.bad(`\\(A[${k}] = ${A[k]} \\gt ${piv}\\), so j keeps moving left. It stops at the first value \\(\\le\\) the pivot: \\(A[${e}] = ${A[e]}\\).`);
        return ctx.bad(`Too far. j stops at the <b>first</b> \\(A[j] \\le ${piv}\\) going left: \\(A[${e}] = ${A[e]}\\) at index ${e}.`);
      };
      const askAct = () => {
        ctx.task(`i = ${i}, j = ${j}. What now?`);
        extra.innerHTML = '';
        const ch = UI.choices([
          { label: `\\(i \\lt j\\): swap A[${i}] = ${show(A[i])} ↔ A[${j}] = ${A[j]}`, value: 'swap' },
          { label: `crossed (\\(i \\ge j\\)): swap pivot A[${seg.l}] ↔ A[${j}]`, value: 'piv' }], v => act(v));
        extra.append(ch); extra.ch = ch;
      };
      const act = v => {
        if (phase !== 'act') return;
        const want = i < j ? 'swap' : 'piv';
        if (v !== want) return ctx.bad(want === 'swap' ? `\\(i = ${i} \\lt j = ${j}\\): they have not crossed. \\(A[${i}] = ${A[i]}\\) is too big for the left side and \\(A[${j}] = ${A[j]}\\) too small for the right, so swap them and keep scanning.` : `\\(i = ${i} \\ge j = ${j}\\): the pointers crossed. Everything left of j is \\(\\le ${piv}\\), so the pivot goes to position j: swap A[${seg.l}] with A[${j}].`);
        extra.innerHTML = '';
        if (want === 'swap') {
          const a = A[i], b = A[j];
          arr.swap(i, j); B.swap(i, j); [A[i], A[j]] = [A[j], A[i]];
          tbody.append(H('tr', {}, [pass, `i=${rowI} (${show(a)})`, `j=${j} (${b})`, `swap ${a}, ${b}`, A.slice(0, n).join(' ')].map(t => H('td', {}, t))));
          ctx.good(`Swap ${a} ↔ ${b}. Now A[${i}] \\(\\le\\) pivot and A[${j}] \\(\\ge\\) pivot. Continue from i = ${i}, j = ${j}.`);
          pass++; phase = 'i'; paint(); askI();
        } else {
          tbody.append(H('tr', {}, [pass, `i=${i} (${show(A[i])})`, `j=${j} (${A[j]})`, 'crossed: no swap', A.slice(0, n).join(' ')].map(t => H('td', {}, t))));
          const l = seg.l, h = seg.h;
          arr.swap(l, j); B.home(l, j); [A[l], A[j]] = [A[j], A[l]];
          final[j] = true;
          tbody.append(H('tr', {}, ['end', '', '', `swap pivot ${piv} ↔ A[${j}]`, A.slice(0, n).join(' ')].map(t => H('td', {}, t))));
          if (!firstResult) firstResult = { arr: A.slice(0, n), j };
          ctx.good(`Pivot ${piv} is home at index <b>${j}</b>. Left [${l}..${j - 1}] all \\(\\le ${piv}\\), right [${j + 1}..${h - 1}] all \\(\\ge ${piv}\\). Recurse left, then right.`);

          stack.push({ l: j + 1, h, parent: seg.node }, { l, h: j, parent: seg.node });
          nextCall();
        }
      };
      const finish = () => {
        arr.clear('dim'); for (let k = 0; k < n; k++) arr.cls(k, 'done');
        B.finish();
        if (d === 1) return end();
        phase = 'best';
        ctx.task(`Sorted! Part (ii): the <b>best case</b> of quick sort by Master's theorem?`);
        extra.innerHTML = '';
        const ch = UI.choices([
          { label: '\\(T(n) = 2T(n/2) + n\\): \\(a=2,b=2,k=1\\), Case 2, \\(\\Theta(n\\log n)\\)', value: 'ok' },
          { label: '\\(T(n) = T(n-1) + n\\): \\(\\Theta(n^2)\\)', value: 'w' },
          { label: '\\(T(n) = 2T(n/2) + 1\\): Case 1, \\(\\Theta(n)\\)', value: 'c1' },
          { label: '\\(T(n) = T(n/2) + n\\): Case 3, \\(\\Theta(n)\\)', value: 'c3' }], v => {
          if (v !== 'ok') return ctx.bad(`Best case = the pivot lands in the middle every time: two halves (\\(a = 2, b = 2\\)) plus a linear partition (\\(f(n) = n\\), \\(k = 1\\)). \\(\\log_2 2 = 1 = k\\) and \\(p = 0 \\gt -1\\): Case 2, \\(\\Theta(n\\log n)\\). \\(T(n-1)+n\\) is the worst case.`);
          ctx.good('Best case \\(\\Theta(n\\log n)\\), same as merge sort.'); end();
        });
        extra.append(ch); extra.ch = ch;
      };
      const end = () => {
        phase = 'end'; extra.innerHTML = '';
        const f = firstResult;
        ctx.done(`After partition 1 (pivot ${ctx.inst.a[0]}): ${f.arr.map((v, k) => k === f.j ? `<b>${v}</b>` : v).join(' ')}, pivot home at index ${f.j}<br>Sorted: <b>${A.slice(0, n).join(' ')}</b> after <b>${calls}</b> partition calls<br>Best case \\(T(n) = 2T(n/2) + n = \\Theta(n\\log n)\\); worst \\(T(n-1)+n = O(n^2)\\).`);
      };
      stack.push({ l: 0, h: n, parent: null });
      nextCall();
      return {
        hint() {
          if (phase === 'i') return `Walk right from index ${i + 1}; stop on the first value \\(\\ge ${piv}\\) (index ${expI()}).`;
          if (phase === 'j') return `Walk left from index ${j - 1}; stop on the first value \\(\\le ${piv}\\) (index ${expJ()}).`;
          if (phase === 'act') return i < j ? 'They have not crossed yet: swap.' : 'They crossed: the pivot goes to j.';
          if (phase === 'best') return 'Best case = balanced split, two halves + linear partition.';
        },
        demoStep() {
          if (phase === 'i') click(expI());
          else if (phase === 'j') click(expJ());
          else if (phase === 'act') act(i < j ? 'swap' : 'piv');
          else if (phase === 'best') extra.ch.pick('ok');
        },
      };
    },
  });
})();

/* Unit 4 · Fractional knapsack (reference level: shows the level API end to end) */
Game.level({
  id: 'fknap', unit: 4, order: 20, icon: '🎒', title: 'Fractional Knapsack', tag: 'Greedy · best profit per kg first', scene: 'Load the delivery truck with the most valuable cargo',
  intro: `<p><b>Real life:</b> you're a gold dealer with a bag that holds \\(M\\) kg. Gold dust, silver dust, copper dust… you can take <i>part</i> of any heap. Grab the most valuable-per-kg dust first.</p>
<ol><li>Find the ratio \\(p_i / w_i\\) for every item.</li><li>Take items in <b>decreasing ratio</b>.</li><li>If an item fits, take all of it (\\(x_i = 1\\)).</li><li>The first item that doesn't fit: take the fraction \\(x_i = \\frac{\\text{space left}}{w_i}\\). The bag is now full.</li><li>Profit \\(= \\sum p_i x_i\\).</li></ol>`,
  formula: `\\[\\max \\sum p_i x_i \\quad\\text{s.t.}\\ \\sum w_i x_i \\le M,\\ 0 \\le x_i \\le 1\\]<p>Sort by ratio: \\(O(n \\log n)\\).</p>`,
  exam: { p: [10, 5, 15, 7, 6, 18, 3], w: [2, 3, 5, 7, 1, 4, 1], M: 15 },
  examSrc: '2025 Final Q5b · n = 7, M = 15',
  make(r, d) {
    const n = [4, 5, 7][d - 1];
    for (;;) {
      const w = Array.from({ length: n }, () => r.int(1, d === 1 ? 6 : 9));
      const p = w.map(x => x * r.int(1, 6) + r.int(0, 4));
      const tot = w.reduce((a, b) => a + b, 0), M = Math.max(3, Math.round(tot * (0.45 + r() * 0.25)));
      const st = this.solve({ p, w, M });
      if (st.some(s => s.x > 0 && s.x < 1)) return { p, w, M };   // make sure a fraction is needed
    }
  },
  /* greedy order (ties: lower index first) + amounts */
  solve({ p, w, M }) {
    const idx = p.map((_, i) => i).sort((a, b) => p[b] / w[b] - p[a] / w[a] || a - b);
    let left = M; const out = [];
    for (const i of idx) { if (left <= 0) break; const x = Math.min(1, left / w[i]); out.push({ i, x }); left -= x * w[i]; }
    return out;
  },
  /* the story: a tiny 3-crate example, told beat by beat */
  story(W) {
    const C = World.C, PAL = World.PAL, M = 10, BED = 8, U = BED / M;
    const items = [{ n: 'Saffron', p: 60, w: 2 }, { n: 'Tea', p: 60, w: 6 }, { n: 'Rice', p: 40, w: 8 }];
    W.slab({ w: 18, d: 3.4, z: 3.4, color: C.wood, h: .4 });
    const truck = W.group({ z: -1.6 });
    W.slab({ parent: truck, w: BED + .5, d: 2.7, y: .9, h: .3, color: '#3c4f63' });
    W.box({ parent: truck, w: BED + .5, h: .9, d: .14, z: -1.35, y: 1.35, color: '#e9eef2' });
    W.box({ parent: truck, w: 2.2, h: 2.3, d: 2.7, x: -BED / 2 - 1.5, y: 1.55, color: '#2f6fd6', r: .25 });
    W.box({ parent: truck, w: 1.1, h: .8, d: 2.72, x: -BED / 2 - 1.95, y: 2.05, color: '#bfe3f2', r: .1 });
    for (const x of [-BED / 2 - 1.5, -BED / 2 + 1.8, BED / 2 - 1.6]) for (const z of [-1.25, 1.25]) { const wh = W.cyl({ parent: truck, r: .55, h: .4, x, z, y: .55, color: '#1d2a36' }); wh.rotation.x = Math.PI / 2; }
    const sign = W.text('', { parent: truck, x: 0, y: 3, z: -1.35, size: .7, bg: '#12283a', color: '#ffffff' });
    const xs = [-7, -2.6, 4.2];
    const cr = items.map((it, i) => { const c = W.box({ w: it.w * U, h: 1.15, d: 1.5, x: xs[i], z: 3.4, color: PAL[i + 1], r: .1 }); c.visible = false; return c; });
    const tags = cr.map((c, i) => W.text('', { x: xs[i], y: 2.1, z: 3.4, size: .6, bg: '#ffffff', color: '#12283a' }));
    W.fit({ dir: [.25, .6, 1] });
    let bedX = -BED / 2;
    const load = async (i, frac = 1) => {
      const c = cr[i], full = items[i].w * U, wd = full * frac;
      if (frac < 1) { const rest = W.box({ w: full * (1 - frac), h: 1.15, d: 1.5, x: xs[i] + full * frac / 2, z: 3.4, color: PAL[i + 1], opacity: .3, r: .05 }); rest.castShadow = false; c.scale.x = frac; c.position.x = xs[i] - full * (1 - frac) / 2; }
      W.setText(tags[i], '');
      await W.hop(c, { x: bedX + wd / 2, z: -1.6, y: .9 + .575 }, 800, 2.4); bedX += wd;
    };
    return [
      { text: 'Riya delivers spices. Her truck carries only <b>10 kg</b>, and three sacks are waiting on the dock. She can open a sack and take <b>part of it</b>.',
        run: async () => { W.setText(sign, 'holds 10 kg'); for (let i = 0; i < 3; i++) { cr[i].visible = true; await W.drop(cr[i], 5, 420); W.setText(tags[i], `${items[i].n}: ₹${items[i].p}, ${items[i].w} kg`); } } },
      { text: 'Which sack first? Not the biggest, not the priciest. She asks: <b>how much money does each kg earn?</b> That is \\(p_i / w_i\\).',
        run: async () => { for (let i = 0; i < 3; i++) { W.setText(tags[i], `₹${items[i].p} ÷ ${items[i].w} kg = ₹${items[i].p / items[i].w}/kg`); W.pop(cr[i]); await Game.wait(650); } } },
      { text: 'Saffron earns ₹30 per kg, the best. It fits, so <b>all of it</b> goes in: \\(x_1 = 1\\). 8 kg of space left.',
        run: async () => { W.glow(cr[0], '#ffc53d'); await Game.wait(400); await load(0); W.glow(cr[0], null); W.setText(sign, '2 / 10 kg   ₹60'); } },
      { text: 'Next best is tea at ₹10 per kg. It also fits: \\(x_2 = 1\\). Only 2 kg of space left.',
        run: async () => { W.glow(cr[1], '#ffc53d'); await Game.wait(400); await load(1); W.glow(cr[1], null); W.setText(sign, '8 / 10 kg   ₹120'); } },
      { text: 'Rice weighs 8 kg but only 2 kg fits. So she <b>cuts the sack</b>: \\(x_3 = \\frac{2}{8} = \\frac14\\), which earns \\(40 \\times \\frac14 = 10\\).',
        run: async () => { W.glow(cr[2], '#ffc53d'); await Game.wait(500); await load(2, .25); W.glow(cr[2], null); W.setText(sign, '10 / 10 kg   ₹130'); } },
      { text: 'Full truck, profit \\(60 + 60 + 10 = 130\\). That is the whole algorithm: <b>sort by profit per kg, fill, cut the last one</b>. Sorting makes it \\(O(n \\log n)\\).',
        run: async () => { await W.move(truck, { x: -1.2 }, 500); for (const c of cr) W.pop(c); } },
    ];
  },
  mount(ctx) {
    const { p, w, M } = ctx.inst, n = p.length, H = UI.h, W = ctx.world, showR = ctx.diff === 1;
    const ratio = i => p[i] / w[i];
    const taken = new Array(n).fill(0);
    let left = M, phase = 'pick', pending = null, profit = 0;

    /* ---- 3D scene: crates on the dock, a truck whose bed length is the capacity M ---- */
    const BED = 11, U = BED / M, PAL = World.PAL, GAP = .35;
    const widths = w.map(x => Math.max(.5, x * U)), rowW = widths.reduce((a, b) => a + b + GAP, -GAP);
    const dock = W.slab({ w: Math.max(rowW + 1.5, BED + 4.5), d: 3.4, z: 3.4, color: World.C.wood, h: .4 });
    const truck = W.group({ z: -1.6 });
    W.slab({ parent: truck, w: BED + .5, d: 2.7, y: .9, h: .3, color: '#3c4f63' });                                   // bed
    W.box({ parent: truck, w: BED + .5, h: .9, d: .14, z: -1.35, y: 1.35, color: '#e9eef2' });                        // back wall
    W.box({ parent: truck, w: 2.2, h: 2.3, d: 2.7, x: -BED / 2 - 1.5, y: 1.55, color: '#2f6fd6', r: .25 });           // cab
    W.box({ parent: truck, w: 1.1, h: .8, d: 2.72, x: -BED / 2 - 1.95, y: 2.05, color: '#bfe3f2', r: .1 });           // window
    for (const x of [-BED / 2 - 1.5, -BED / 2 + 1.8, BED / 2 - 1.6]) for (const z of [-1.25, 1.25]) { const wh = W.cyl({ parent: truck, r: .55, h: .4, x, z, y: .55, color: '#1d2a36' }); wh.rotation.x = Math.PI / 2; }
    const ruler = W.text(`0 / ${M} kg`, { parent: truck, x: 0, y: 2.9, z: -1.35, size: .62, bg: '#12283a', color: '#ffffff' });
    const crates = [], home = [];
    let cx = -rowW / 2;
    for (let i = 0; i < n; i++) {
      const x = cx + widths[i] / 2; cx += widths[i] + GAP;
      const c = W.box({ w: widths[i], h: showR ? .55 + ratio(i) / Math.max(...p.map((_, k) => ratio(k))) * 1.1 : 1.15, d: 1.5, x, z: 3.4, color: PAL[i % PAL.length], r: .1,
        label: `#${i + 1}`, labelOpts: { size: .62 }, onClick: () => pick(i) });
      W.text(`${p[i]} / ${w[i]}kg`, { parent: c, x: 0, y: -c.userData.h / 2 - .02, z: 1.1, size: .46, bg: '#ffffff', color: '#12283a' });
      crates.push(c); home.push(x);
    }
    W.fit({ dir: [.25, .6, 1] });
    let bedX = -BED / 2;   // next free x on the truck bed
    const load = async (i, x) => {
      const c = crates[i], full = widths[i], wd = w[i] * x * U;
      W.click(c, null); W.glow(c, null);
      if (x < 1) {   // cut the crate: the loaded part shrinks, a faded remainder stays on the dock
        const rest = W.box({ w: full * (1 - x), h: c.userData.h, d: 1.5, x: home[i] + full * x / 2, z: 3.4, color: PAL[i % PAL.length], opacity: .3, r: .05 });
        rest.castShadow = false; c.scale.x = Math.max(.05, wd / full); c.position.x = home[i] - full * (1 - x) / 2;
      }
      const tx = bedX + wd / 2; bedX += wd;
      await W.hop(c, { x: tx, z: -1.6, y: .9 + c.userData.h / 2 }, 700, 2.2);
      W.pop(c);
    };

    /* ---- workbench: the exam-style table + the answer boxes ---- */
    const tbl = UI.grid(3, n, { rows: ['profit \\(p_i\\)', 'weight \\(w_i\\)', '\\(p_i / w_i\\)'], cols: p.map((_, i) => 'Item ' + (i + 1)), onClick: (r, c) => pick(c) });
    for (let i = 0; i < n; i++) { tbl.set(0, i, p[i]); tbl.set(1, i, w[i]); tbl.set(2, i, showR ? UI.fmt(ratio(i)) : '?'); }
    const cap = H('div', { class: 'note', style: 'margin-top:8px' }), extra = H('div');
    ctx.el.append(tbl.el, cap, extra); UI.tex(tbl.el);
    const paintBag = () => {
      cap.textContent = `Truck holds ${M} kg. Loaded ${UI.fmt(M - left)} kg, ${UI.fmt(left)} kg free. Profit so far ${UI.fmt(profit)}.`;
      W.setText(ruler, `${UI.fmt(M - left)} / ${M} kg   profit ${UI.fmt(profit)}`);
    };
    const reveal = i => { tbl.set(2, i, UI.fmt(ratio(i))); };
    const bestNow = () => { const rest = [...Array(n).keys()].filter(i => !taken[i]); const m = Math.max(...rest.map(ratio)); return rest.filter(i => Math.abs(ratio(i) - m) < 1e-9); };
    const next = () => {
      if (left <= 1e-9 || taken.every(x => x)) return finish();
      phase = 'pick'; ctx.task('Click the crate with the <b>highest profit per kg</b> \\(p_i/w_i\\) that is still on the dock.');
    };
    const pick = i => {
      if (phase !== 'pick' || taken[i]) return;
      const best = bestNow();
      reveal(i);
      if (!best.includes(i)) {
        const b = best[0]; W.shake(crates[i]);
        return ctx.bad(`Item ${i + 1} has \\(p/w = ${p[i]}/${w[i]} = ${UI.fmt(ratio(i))}\\), but Item ${b + 1} has \\(${p[b]}/${w[b]} = ${UI.fmt(ratio(b))}\\). Greedy always loads the <b>highest ratio</b> first.`);
      }
      for (let r = 0; r < 3; r++) tbl.cls(r, i, 'ok');
      if (w[i] <= left + 1e-9) {
        taken[i] = 1; left -= w[i]; profit += p[i]; paintBag(); load(i, 1);
        ctx.good(`Item ${i + 1} (ratio ${UI.fmt(ratio(i))}) fits completely: \\(x_{${i + 1}} = 1\\), profit +${p[i]}.`);
        next();
      } else {
        phase = 'frac'; pending = i; W.glow(crates[i], '#ffc53d');
        ctx.good(`Item ${i + 1} has the best ratio, but it weighs ${w[i]} kg and only ${UI.fmt(left)} kg is free.`, 5);
        ctx.task(`Cut the crate. What fraction \\(x_{${i + 1}}\\) of Item ${i + 1} fits? (you can type a fraction like 2/3)`);
        extra.innerHTML = ''; extra.append(UI.ask(`\\(x_{${i + 1}} = \\)`, v => frac(v)));
      }
    };
    const frac = v => {
      const i = pending, x = left / w[i];
      if (!UI.same(v, x)) return ctx.bad(`Fraction = free space ÷ weight = \\(${UI.fmt(left)}/${w[i]} = ${UI.fmt(x, 3)}\\).`);
      const was = left;
      taken[i] = x; profit += p[i] * x; left = 0; paintBag(); extra.innerHTML = ''; load(i, x);
      ctx.good(`\\(x_{${i + 1}} = ${UI.fmt(was)}/${w[i]}\\), profit \\(+${p[i]} \\times ${UI.fmt(x, 3)} = ${UI.fmt(p[i] * x)}\\). The truck is full.`);
      next();
    };
    const finish = () => {
      if (ctx.diff === 1) return end();
      phase = 'total'; ctx.task('The truck is full. What is the <b>total profit</b> \\(\\sum p_i x_i\\)?');
      extra.innerHTML = ''; extra.append(UI.ask('Total profit =', v => {
        if (!UI.same(v, profit)) return ctx.bad(`Add up profit × fraction for every crate on the truck. It is ${UI.fmt(profit)}.`);
        ctx.good('Correct total.'); end();
      }));
    };
    const end = async () => {
      phase = 'end'; extra.innerHTML = '';
      const xs = taken.map(x => UI.fmt(x)).join(', ');
      if (W.real) { W.move(truck, { x: -3 }, 900); for (const c of crates) if (c.position.z < 0) W.move(c, { x: c.position.x - 3 }, 900); await Game.wait(700); }
      ctx.done(`\\(x = (${xs})\\)<br>Max profit \\(= ${UI.fmt(profit)}\\)`);
    };
    paintBag(); next();
    return {
      hint: () => phase === 'pick' ? `Compare \\(p/w\\) of the crates left on the dock. The highest is Item ${bestNow()[0] + 1}.` : phase === 'frac' ? `Free space is ${UI.fmt(left)}, crate weight is ${w[pending]}. Divide.` : `Add each \\(p_i x_i\\).`,
      demoStep() {
        if (phase === 'pick') pick(bestNow()[0]);
        else if (phase === 'frac') extra.querySelector('.ask').submit(UI.fmt(left / w[pending], 4));
        else if (phase === 'total') extra.querySelector('.ask').submit(UI.fmt(profit, 4));
      },
    };
  },
});

Game.level({
  id: 'huff', unit: 4, order: 50, icon: '🌳', title: 'Huffman Coding', tag: 'Greedy · merge the two rarest symbols',
  scene: 'Build the telegraph office\'s code tree: short codes for common letters',
  intro: `<ol><li>One leaf per symbol, weighted by its frequency.</li><li>Join the <b>two smallest</b> under a new parent (weight = their sum). The first one taken is the <b>left</b> child.</li><li>Repeat until one tree is left. Left edges are <b>0</b>, right edges <b>1</b>; a code is the path from the root.</li><li>Decode by walking from the root; at a leaf write the symbol and restart.</li></ol>
<p class="note">Tie rule (course): smaller weight first; on a tie the node created earlier goes first (leaves in the given order).</p>`,
  formula: `\\[\\text{Cost} = \\sum_i f_i \\cdot \\ell_i\\]<p>(\\(\\ell_i\\) = code length) = the sum of all internal-node weights.</p><p>\\(n - 1\\) merges on a min-heap: \\(O(n \\log n)\\).</p>`,
  exam: { sym: ['A', 'B', 'C', 'D', '_'], f: [40, 10, 20, 15, 15], scale: 100, enc: 'ABACABAD', dec: '100010111001010' },
  examSrc: '2023 Final Q4b · A .4 B .1 C .2 D .15 _ .15',
  make(r, d) {
    const n = [4, 5, 6][d - 1];
    const f = d === 1 ? r.shuffle(Array.from({ length: 12 }, (_, i) => i * 3 + r.int(1, 2))).slice(0, n) : Array.from({ length: n }, () => r.int(2, 25));
    return { sym: 'ABCDEFG'.slice(0, n).split(''), f };
  },
  /* 3D telegraph office: letter blocks on the desk (size = frequency); merges add parent balls above them, joined by links.
     The scene keeps its own layout model in plain JS and never reads anything back from the meshes.
     syms: [{s, f, txt}] */
  _scene(W, syms) {
    const C = World.C, PAL = World.PAL, n = syms.length, LP = 2.2, LV = 1.6, maxF = Math.max(...syms.map(x => x.f));
    const lx = k => (k - (n - 1) / 2) * LP, kx = n * LP / 2 + 1.7;
    W.slab({ w: n * LP + 3.3, d: 3.2, x: 1.35, z: .3, color: C.wood, h: .3 });
    W.box({ w: 1.7, h: .25, d: 1, x: kx, z: .5, color: '#5a3d2b' });                                  // telegraph key
    W.cyl({ r: .12, h: .4, x: kx - .45, y: .45, z: .5, color: '#d8a531', metal: .5 });
    W.box({ w: 1.4, h: .1, d: .22, x: kx, y: .7, z: .5, color: '#d8a531', metal: .5 });
    const knob = W.cyl({ r: .24, h: .16, x: kx + .55, y: .85, z: .5, color: '#12283a' });
    const sign = W.text('', { x: kx, y: 2, z: .5, size: .64, bg: '#12283a', color: '#ffffff' });
    const S = { onNode: null, nodes: [], pad: 1 }, all = [];
    const click = t => () => S.onNode && S.onNode(t);
    S.nodes = syms.map((sy, i) => {
      const s = .8 + .7 * Math.sqrt(sy.f / maxF), t = { leaf: true, s, kids: null, lvl: 0 };
      t.m = W.box({ w: s, h: s, d: s, x: lx(i), color: PAL[i % PAL.length], r: .1, onClick: click(t) });

        if (phase === 'build') {
          const s = pool.slice().sort(key);
          pick(sel.length ? s.find(t => t !== sel[0]) : s[0]);
        } else if (phase === 'code') {
          const c = codeOf(leaves[qi]);
          if (easy) extra.querySelector('.choices').pick(c); else await extra.querySelector('.ask').submit(c);
        } else if (phase === 'cost') extra.querySelector('.ask').submit(UI.fmt(cost / (I.scale || 1), 4));
        else if (phase === 'enc') extra.querySelector('.ask').submit(codeOf(bySym(word[ei])));
        else if (phase === 'dec') await clickNode(cur.kids[dec[di] === '0' ? 0 : 1].id);
        else await Game.wait(300);
        while (phase === 'anim') await Game.wait(60);
      },
    };
  },
});

Game.level({
  id: 'jobs', unit: 4, order: 30, icon: '📅', title: 'Job Sequencing', tag: 'Greedy · richest job first, as late as allowed', scene: 'Book the repair workshop\'s week with the best-paying jobs',
  intro: `<ol><li>Sort jobs by <b>profit, highest first</b> (ties: keep the given order).</li><li>Make as many slots as the <b>largest deadline</b>.</li><li>For each job, try slot \\(d_i\\); if taken, slide <b>left</b> to the nearest free slot.</li><li>No free slot in \\(1..d_i\\)? <b>Reject</b> the job.</li><li>Profit = sum of the placed jobs.</li></ol>`,
  formula: `<p>Place job \\(i\\) in slot \\(t = \\max\\{\\,t \\le d_i : t \\text{ free}\\,\\}\\), else reject.</p><p>Sort \\(O(n \\log n)\\) + slot search \\(O(n\\,d_{\\max})\\) → \\(O(n^2)\\) simple; \\(O(n \\log n)\\) with union-find.</p>`,
  exam: { p: [35, 30, 25, 20, 15, 12, 5], d: [3, 4, 4, 2, 3, 1, 2] },
  examSrc: '2024 Final Q5b · 7 jobs J1..J7',
  make(r, d) {
    const n = [4, 6, 8][d - 1];
    for (;;) {
      const ps = new Set(); while (ps.size < n) ps.add(r.int(1, 20) * 5);
      const prof = r.shuffle([...ps]);
      const maxD = Math.max(2, Math.ceil(n * (d === 1 ? 0.5 : 0.55)));
      const dl = prof.map(() => r.int(1, maxD));
      const sol = this.solve({ p: prof, d: dl });
      const rej = sol.steps.filter(s => s.slot < 0).length, slid = sol.steps.filter(s => s.slot > 0 && s.slot < s.d).length;
      if (rej >= 1 && slid >= 1 && rej <= n / 2) return { p: prof, d: dl };
    }
  },
  solve({ p, d }) {
    const n = p.length, D = Math.max(...d), order = p.map((_, i) => i).sort((a, b) => p[b] - p[a] || a - b);
    const slot = new Array(D + 1).fill(-1), steps = [];
    for (const i of order) {
      let t = d[i]; while (t >= 1 && slot[t] >= 0) t--;
      if (t >= 1) slot[t] = i; steps.push({ i, d: d[i], slot: t >= 1 ? t : -1 });
    }
    return { order, slot, steps, D, profit: slot.reduce((a, j) => a + (j >= 0 ? p[j] : 0), 0) };
  },
  /* 3D workshop: a queue of job crates (height = profit) in front, a calendar of day tiles behind, a reject bin on the right.
     jobs: [{name, p, d, c (colour index)}] in queue order. */
  _scene(W, jobs, D) {
    const C = World.C, PAL = World.PAL, n = jobs.length, P = 2.3, QP = 2.15, calW = D * P, x0 = -(calW + 3.2) / 2;
    const maxP = Math.max(...jobs.map(j => j.p)), TZ = -1.2, QZ = 4, bx = x0 + calW + 1.7;
    const tx = t => x0 + (t - .5) * P, qx = k => (k - (n - 1) / 2) * QP;
    W.slab({ w: Math.max(n * QP + .6, calW + 3.8), d: 2.4, z: QZ, color: C.wood, h: .3 });
    W.box({ w: calW + .2, h: 3, d: .25, x: x0 + calW / 2, z: TZ - 1.55, color: '#ffffff' });              // wall calendar
    W.box({ w: calW + .2, h: .7, d: .3, x: x0 + calW / 2, z: TZ - 1.55, y: 3.3, color: C.bad });
    const tiles = [null];
    for (let t = 1; t <= D; t++) {
      tiles.push(W.box({ w: 2, h: .3, d: 2.3, x: tx(t), z: TZ, color: '#ffffff', r: .1 }));
      W.text('Day ' + t, { x: tx(t), y: 3.3, z: TZ - 1.35, size: .55, color: '#ffffff', stroke: 'rgba(0,0,0,.2)' });
    }
    const bin = W.group({ x: bx, z: TZ });
    for (const [w, d, x, z] of [[2.2, .15, 0, 1.02], [2.2, .15, 0, -1.02], [.15, 2.2, 1.02, 0], [.15, 2.2, -1.02, 0]]) W.box({ parent: bin, w, d, h: .8, x, z, color: C.steel });
    W.box({ parent: bin, w: 2.1, d: 2.1, h: .1, color: '#7f93a1' });
    W.text('Reject bin', { parent: bin, x: 0, y: .45, z: 1.6, size: .52, bg: C.bad, color: '#ffffff' });
    const crates = jobs.map((j, k) => {
      const hh = .5 + 1.3 * j.p / maxP;
      const c = W.box({ w: 1.4, d: 1.4, h: hh, x: qx(k), z: QZ, color: PAL[j.c % PAL.length], r: .1, label: j.name, labelOpts: { size: .6 } });
      const info = W.text(`p=${j.p} d=${j.d}`, { parent: c, x: 0, y: -hh / 2 + .32, z: .95, size: .5, bg: '#ffffff', color: '#12283a' });
      return { c, h: hh, info, j };
    });
    const flag = W.text('▼ deadline', { x: tx(1), y: 4.2, z: TZ - 1.55, size: .62, bg: '#ffc53d', color: '#12283a' });   // marks the current job's deadline day
    flag.visible = false;
    const sign = W.text('', { x: bx, y: 2.9, z: TZ, size: .6, bg: '#12283a', color: '#ffffff' });
    let binned = 0;
    return {
      tiles, crates, bin, flag, sign, tx, qx,
      flagTo(t, ms = 350) { flag.visible = true; return W.move(flag, { x: tx(t) }, ms); },
      toSlot(k, t) { const o = crates[k]; W.setText(o.info, ''); W.tag(o.c, `${o.j.name} · ${o.j.p}`); W.glow(o.c, null); return W.hop(o.c, { x: tx(t), y: .3 + o.h / 2, z: TZ }, 650, 2.2); },
      async toBin(k) {
        const o = crates[k], r = binned++;
        W.setText(o.info, ''); W.glow(o.c, null); W.paint(o.c, C.dim, 300); W.scale(o.c, .5, 400);
        await W.hop(o.c, { x: bx + (r % 2 ? .45 : -.45), y: .15 + o.h * .25 + (r > 3 ? .7 : 0), z: TZ + (r % 4 < 2 ? .42 : -.42) }, 700, 2.4);
      },
    };
  },
  /* the story: four bike repairs, three days */
  story(W) {
    const C = World.C;
    const jobs = [{ name: 'J1', p: 30, d: 2, c: 0 }, { name: 'J2', p: 50, d: 2, c: 1 }, { name: 'J3', p: 20, d: 3, c: 2 }, { name: 'J4', p: 40, d: 1, c: 3 }];
    const S = this._scene(W, jobs, 3), cr = S.crates;
    for (const o of cr) o.c.visible = false;
    W.fit({ dir: [.25, .6, 1] });
    const book = async (k, t) => { S.flagTo(t); W.glow(cr[k].c, C.hi); await Game.wait(500); await S.toSlot(k, t); W.paint(S.tiles[t], '#bfe8cf'); W.pop(cr[k].c); };
    return [
      { text: 'Kabir repairs bikes. Every repair takes <b>one day</b>, and a customer pays only if the bike is ready by their <b>deadline</b> \\(d\\). Four jobs came in, but the week has only three days.',
        run: async () => { for (const o of cr) { o.c.visible = true; await W.drop(o.c, 5, 380); } } },
      { text: 'He cannot do them all, so the best-paying job gets first choice. He lines the crates up by <b>profit, highest first</b>: J2, J4, J1, J3.',
        run: async () => { const to = [2, 0, 3, 1]; await Promise.all(cr.map((o, k) => W.hop(o.c, { x: S.qx(to[k]) }, 700, 1.2 + k * .5))); } },
      { text: 'J2 pays 50 and is due by day 2. He books it on <b>day 2 itself</b>, the latest day allowed, so day 1 stays free for someone in a bigger hurry.',
        run: async () => { await book(1, 2); W.setText(S.sign, 'Profit 50'); } },
      { text: 'J4 pays 40 and must be done on day 1. Day 1 is still free (that is why J2 went late), so J4 gets it.',
        run: async () => { await book(3, 1); W.setText(S.sign, 'Profit 50 + 40 = 90'); } },
      { text: 'J1 pays 30, due by day 2. Day 2 is taken, so he slides <b>left</b>: day 1 is taken too. No free day \\(\\le 2\\), so J1 is <b>rejected</b>.',
        run: async () => {
          const o = cr[0]; S.flagTo(2); W.glow(o.c, C.hi); await Game.wait(400);
          await W.hop(o.c, { x: S.tx(2), y: 2.6, z: -1.2 }, 600, 1); W.shake(cr[1].c); await W.shake(o.c); await Game.wait(250);
          await W.move(o.c, { x: S.tx(1) }, 450); W.shake(cr[3].c); await W.shake(o.c); await Game.wait(250);
          await S.toBin(0);
        } },
      { text: 'J3 pays only 20, but it is due by day 3 and day 3 is free, so it gets in. Total profit \\(50 + 40 + 20 = 110\\).',
        run: async () => { await book(2, 3); W.setText(S.sign, 'Profit 50 + 40 + 20 = 110'); } },
      { text: 'The method: <b>sort by profit, give each job the latest free slot \\(\\le d_i\\), reject it if there is none</b>. Sorting is \\(O(n \\log n)\\), sliding left is \\(O(n \\cdot d_{\\max})\\): \\(O(n^2)\\) in all.',
        run: async () => { S.flag.visible = false; for (const k of [3, 1, 2]) { W.pop(cr[k].c); await Game.wait(200); } } },
    ];
  },
  mount(ctx) {
    const { p, d } = ctx.inst, n = p.length, H = UI.h, easy = ctx.diff === 1, W = ctx.world, C = World.C;
    const sol = this.solve(ctx.inst), D = sol.D, order = sol.order;
    const slot = new Array(D + 1).fill(-1);
    let k = 0, phase = 'place', profit = 0;

    /* ---- 3D scene ---- */
    const S = this._scene(W, order.map(i => ({ name: 'J' + (i + 1), p: p[i], d: d[i], c: i })), D);
    for (let t = 1; t <= D; t++) W.click(S.tiles[t], () => place(t));
    W.click(S.bin, () => place(0));
    W.fit({ dir: [.25, .6, 1] });
    const anim = fn => { if (W.real) fn().catch(e => console.error(e)); };   // crates move independently: never blocks the game logic

    /* ---- workbench: job table (sorted by profit) + the slot array the exam asks for ---- */
    const tbl = UI.grid(3, n, { rows: ['profit \\(p\\)', 'deadline \\(d\\)', 'slot'], cols: order.map(i => 'J' + (i + 1)) });
    order.forEach((i, c) => { tbl.set(0, c, p[i]); tbl.set(1, c, d[i]); });
    const tl = UI.arr(Array(D).fill('·'), { label: 'Slots (each = 1 day)', idx: Array.from({ length: D }, (_, t) => 'day ' + (t + 1)), onClick: t => place(t + 1), cls: 'jobs-tl' });
    const rejBtn = H('button', { class: 'btn', onclick: () => place(0) }, '✖ Reject this job');
    const info = H('div', { class: 'note' });
    const extra = H('div');
    ctx.el.append(H('div', { class: 'note' }, 'Jobs sorted by profit (high → low)'), tbl.el, tl.el, H('div', { class: 'jobs-row' }, rejBtn, info), extra);
    UI.tex(tbl.el);
    const latest = i => { let t = d[i]; while (t >= 1 && slot[t] >= 0) t--; return t; };   // 0 = none
    const paint = () => {
      tl.clear();
      for (let t = 1; t <= D; t++) if (slot[t] >= 0) tl.cls(t - 1, 'done');
      if (phase === 'place') {
        const i = order[k];
        tl.ptr('↑ deadline', d[i] - 1);
        if (easy) for (let t = 1; t <= D; t++) { if (t > d[i]) tl.cls(t - 1, 'dim'); else if (slot[t] < 0) tl.cls(t - 1, 'hi'); }
        else for (let t = d[i] + 1; t <= D; t++) tl.cls(t - 1, 'dim');
        for (let t = 1; t <= D; t++) W.paint(S.tiles[t], slot[t] >= 0 ? '#bfe8cf' : t > d[i] ? C.dim : easy ? '#ffe7a3' : '#ffffff', 200);
        S.flagTo(d[i]);
      } else {
        tl.ptr('↑ deadline', -1); S.flag.visible = false;
        for (let t = 1; t <= D; t++) W.paint(S.tiles[t], slot[t] >= 0 ? '#bfe8cf' : '#ffffff', 200);
      }
      info.textContent = `Profit so far: ${profit}`;
      W.setText(S.sign, `Profit ${profit}`);
    };
    const next = () => {
      tbl.clear('hi');
      if (k >= n) return finish();
      const i = order[k]; for (let r = 0; r < 3; r++) tbl.cls(r, k, 'hi');
      W.glow(S.crates[k].c, C.hi);
      ctx.task(`Job <b>J${i + 1}</b> (profit ${p[i]}, deadline ${d[i]}): click the <b>latest free day ≤ ${d[i]}</b> on the calendar, or the reject bin if there is none.`);
      paint();
    };
    const flash = t => { tl.cls(t - 1, 'bad'); setTimeout(() => tl.cls(t - 1, 'bad', false), 500); W.shake(S.tiles[t]); };
    const place = t => {
      if (phase !== 'place') return;
      const i = order[k], best = latest(i), J = 'J' + (i + 1), kk = k;
      if (t === 0) {
        if (best > 0) { W.shake(S.bin); return ctx.bad(`${J} can still be scheduled: slot ${best} is free and \\(${best} \\le d = ${d[i]}\\). Only reject when <b>every</b> slot \\(1..${d[i]}\\) is taken.`); }
        tbl.set(2, k, '✖', 'bad'); anim(async () => S.toBin(kk));
        ctx.good(`${J} rejected: slots 1..${d[i]} are all taken, so it cannot finish by its deadline ${d[i]}.`);
        k++; return next();
      }
      if (t > d[i]) { flash(t); return ctx.bad(`Slot ${t} ends at time ${t}, after ${J}'s deadline ${d[i]}: it would be late and earn nothing. ` + (best ? `The latest free slot \\(\\le ${d[i]}\\) is slot ${best}.` : `Every slot \\(\\le ${d[i]}\\) is taken, so reject it.`)); }
      if (slot[t] >= 0) { W.shake(S.crates[order.indexOf(slot[t])].c); return ctx.bad(`Slot ${t} already holds J${slot[t] + 1} (a more profitable job, placed earlier). ` + (best ? `Slide left from slot ${d[i]}: the first free one is slot ${best}.` : `Slots 1..${d[i]} are all taken, so reject ${J}.`)); }
      if (t !== best) { flash(t); return ctx.bad(`Slot ${t} is free, but slot ${best} is free too and later. Greedy puts the job as <b>late</b> as possible (start at \\(d = ${d[i]}\\), slide left), so the early slot ${t} stays free for a job with a tighter deadline.`); }
      slot[t] = i; profit += p[i]; tl.set(t - 1, J); tbl.set(2, k, t, 'ok');
      anim(async () => { await S.toSlot(kk, t); W.pop(S.crates[kk].c); });
      const slid = t < d[i] ? ` (slot ${d[i]}${d[i] - t > 1 ? '…' + (t + 1) : ''} taken, slid left)` : '';
      ctx.good(`${J} → slot ${t}${slid}. Profit +${p[i]} = ${profit}.`);
      k++; next();
    };
    const seq = () => { const s = []; for (let t = 1; t <= D; t++) if (slot[t] >= 0) s.push('J' + (slot[t] + 1)); return s; };
    const finish = () => {
      if (easy) return end();
      phase = 'total'; paint(); ctx.task('All jobs handled. What is the <b>total profit</b> of the schedule?');
      W.setText(S.sign, 'Profit ?');
      extra.innerHTML = ''; extra.append(UI.ask('Total profit =', v => {
        if (!UI.same(v, profit)) return ctx.bad(`Add the profits of the scheduled jobs: ${seq().map(j => p[+j.slice(1) - 1]).join(' + ')} = ${profit}.`);
        ctx.good('Correct total.'); end();
      }));
    };
    const end = () => {
      phase = 'end'; extra.innerHTML = ''; rejBtn.disabled = true; paint();
      const rej = order.filter(i => !slot.includes(i)).map(i => 'J' + (i + 1));
      const s = seq();
      ctx.done(`Slots 1..${D}: [${Array.from({ length: D }, (_, t) => slot[t + 1] >= 0 ? 'J' + (slot[t + 1] + 1) : '–').join(', ')}]<br>Order: ${s.join(' → ')}${rej.length ? '<br>Rejected: ' + rej.join(', ') : ''}<br>Max profit \\(= ${s.map(j => p[+j.slice(1) - 1]).join(' + ')} = ${profit}\\)`);
    };
    next();
    return {
      hint: () => {
        if (phase !== 'place') return 'Add the profits of the jobs on the calendar.';
        const i = order[k], b = latest(i);
        return b ? `Start at slot ${d[i]} (the deadline) and move left until a slot is empty: slot ${b}.` : `Slots 1..${d[i]} are all full: reject J${i + 1}.`;
      },
      demoStep() {
        if (phase === 'place') place(latest(order[k]));
        else if (phase === 'total') extra.querySelector('.ask').submit(String(profit));
      },
    };
  },
});

Game.level({
  id: 'omp', unit: 4, order: 40, icon: '🗂️', title: 'Optimal Merge Pattern', tag: 'Greedy · merge the two smallest files', scene: 'Merge the record room\'s paper piles with the least handling',
  intro: `<ol><li>Put all file sizes in a min-heap.</li><li>Take out the <b>two smallest</b> \\(x, y\\).</li><li>Merge them: cost \\(x + y\\); add it to the total.</li><li>Put the merged file \\(x + y\\) back, and repeat until one file is left.</li></ol>`,
  formula: `\\[\\text{Total} = \\sum_{\\text{merges}} (x + y)\\]<p>= \\(\\sum \\text{size}_i \\times \\text{depth}_i\\) over the leaves of the merge tree.</p><p>\\(n - 1\\) merges, each 2 extract-min + 1 insert on a min-heap: \\(O(n \\log n)\\).</p>`,
  exam: { f: [99, 27, 71, 199, 259] },
  examSrc: '2023-24 Re-exam Q6a · sizes 99, 27, 71, 199, 259',
  make(r, d) {
    const n = [4, 6, 8][d - 1];
    return { f: Array.from({ length: n }, () => r.int(2, d === 1 ? 30 : 60)) };
  },
  /* 3D record room: paper piles on a desk (height = size), a cost meter, and the merge tree growing on the shelf behind.
     The scene keeps its own little model (which sheets are in which pile); it never reads anything back from the meshes. */
  _scene(W, sizes, finalCost) {
    const C = World.C, PAL = World.PAL, n = sizes.length, sum = sizes.reduce((a, b) => a + b, 0), MH = 3, U = 2.1 / sum;
    const PITCH = 2.1, TP = 1.9, LV = 1.5, DZ = 2.6, BZ = -1.7, TY = 1.85, deskW = n * PITCH + .8;
    const sx = (k, cnt) => (k - (cnt - 1) / 2) * PITCH;
    W.slab({ w: deskW, d: 2.6, z: DZ, color: C.wood, h: .3 });
    W.slab({ w: n * TP + 1, d: 1.3, z: BZ, y: 1.4, color: '#e9eef2', h: .2 });                             // shelf for the merge tree
    for (const x of [-(n * TP) / 2, (n * TP) / 2]) W.box({ w: .25, h: 1.2, d: 1.1, x, z: BZ, color: C.steel });
    W.text('Merge tree', { x: -(n * TP + 1) / 2 - 1.5, y: 1.9, z: BZ, size: .55, bg: '#12283a', color: '#ffffff' });
    /* cost meter */
    const mx = deskW / 2 + 1.5;
    W.box({ w: 1.2, d: 1.2, h: .25, x: mx, z: DZ, color: C.road });
    W.box({ w: .95, d: .95, h: MH, x: mx, z: DZ, y: .25 + MH / 2, color: '#ffffff', opacity: .28, r: .05 }).castShadow = false;
    const fill = W.box({ w: .7, d: .7, h: MH, x: mx, z: DZ, y: .25, color: C.bad, r: .03 }); fill.scale.y = .001;
    const costLab = W.text('cost 0', { x: mx, y: MH + .9, z: DZ, size: .62, bg: '#12283a', color: '#ffffff' });
    const setCost = c => { const s = Math.max(.001, Math.min(1, c / finalCost)); W.to(fill.scale, { y: s }, 500); W.to(fill.position, { y: .25 + MH * s / 2 }, 500); W.setText(costLab, 'cost ' + c); };
    const S = { onPick: null, nodes: [], setCost, pad: 1 };
    const mkTB = (w, color, x, y) => { const b = W.box({ w: 1.5, h: .8, d: .45, x, y, z: BZ, color, r: .1 }); W.text(String(w), { parent: b, x: 0, y: 0, z: .3, size: .62 }); return b; };
    const all = [];
    S.nodes = sizes.map((w, i) => {
      const hh = Math.max(.15, w * U), o = { h: hh }, t = { w, boxes: [o], H: hh, kids: null, lvl: 0 };
      o.owner = t;
      o.box = W.box({ w: 1.5, d: 1.5, h: hh, x: sx(i, n), z: DZ, color: PAL[i % PAL.length], r: .04, onClick: () => S.onPick && S.onPick(o.owner) });
      t.lab = W.text(String(w), { x: sx(i, n), y: hh + .5, z: DZ, size: .62, bg: '#ffffff', color: '#12283a' });
      t.tb = mkTB(w, PAL[i % PAL.length], (i - (n - 1) / 2) * TP, TY);
      all.push(o); return t;
    });
    const stackTo = (t, X, base, ms, hop) => {
      let y = base;
      const ps = t.boxes.map(o => { const p = { x: X, y: y + o.h / 2 }; y += o.h; return hop ? W.hop(o.box, p, ms, 1.6) : W.move(o.box, p, ms); });
      ps.push(W.move(t.lab, { x: X, y: base + t.H + .5 }, ms));
      return Promise.all(ps);
    };
    let links = [], q = Promise.resolve(), maxLvl = 0, pend = 0;   // pend > 3: the 3D is falling behind the player, so catch up instantly
    /* merge piles a and b. order = the pool after the merge, with null where the new pile goes. Returns {node, done} */
    S.merge = (a, b, order, cost) => {
      const z = { w: a.w + b.w, boxes: [...a.boxes, ...b.boxes], H: a.H + b.H, kids: [a, b], lvl: Math.max(a.lvl, b.lvl) + 1 };
      for (const o of z.boxes) o.owner = z;
      order = order.map(t => t || z);
      const xs = order.map((t, k) => sx(k, order.length)), zx = xs[order.indexOf(z)];
      let li = 0; const pos = new Map(), edges = [];
      const lay = t => { let x; if (!t.kids) x = (li++ - (n - 1) / 2) * TP; else { const [l, r] = t.kids.map(lay); x = (l + r) / 2; } pos.set(t, { x, y: TY + t.lvl * LV }); return x; };
      order.forEach(lay);
      pos.forEach((P, t) => { if (t.kids) for (const k of t.kids) edges.push([P, pos.get(k)]); });
      const P = pos.get(z), grow = z.lvl > maxLvl && z.lvl >= 3; maxLvl = Math.max(maxLvl, z.lvl);
      z.lab = W.text('', { x: zx, y: z.H + .5, z: DZ, size: .62, bg: '#ffe7a3', color: '#12283a' });
      z.tb = mkTB(z.w, '#ffffff', P.x, P.y); z.tb.visible = false;
      const run = async () => {
        const D = pend > 3 ? 0 : 1;
        W.setText(a.lab, ''); W.setText(b.lab, '');
        for (const l of links) W.remove(l); links = [];
        const ps = [];
        order.forEach((t, k) => { if (t !== z) ps.push(stackTo(t, xs[k], 0, 500 * D)); });
        pos.forEach((p, t) => { if (t !== z) ps.push(W.move(t.tb, { x: p.x, y: p.y }, 500 * D)); });
        ps.push(stackTo(a, zx, 0, 500 * D), stackTo(b, zx, a.H, 700 * D, true));
        await Promise.all(ps);
        W.setText(z.lab, String(z.w));
        links = edges.map(([p, c]) => W.link({ x: p.x, y: p.y - .4, z: BZ }, { x: c.x, y: c.y + .4, z: BZ }, { r: .06 }));
        z.tb.visible = true; W.pop(z.tb); setCost(cost);
        if (grow) W.fit({ ms: 600, dir: [.25, .6, 1], pad: S.pad });
        await Game.wait(250 * D);
      };
      if (W.real) pend++;
      const done = W.real ? (q = q.then(run).catch(e => console.error(e)).then(() => { pend--; })) : Promise.resolve();
      return { node: z, done };
    };
    S.select = list => { for (const o of all) W.glow(o.box, list.includes(o.owner) ? C.hi : null); };
    S.shake = t => { for (const o of t.boxes) W.shake(o.box); };
    S.finish = t => { if (W.real) q = q.then(() => { W.paint(t.tb, C.ok); W.pop(t.tb); }); };
    return S;
  },
  /* the story: four piles of exam papers */
  story(W) {
    const C = World.C, S = this._scene(W, [5, 2, 8, 3], 33), N = S.nodes;
    for (const t of N) { t.boxes[0].box.visible = false; W.setText(t.lab, ''); t.tb.visible = false; }
    W.box({ w: .1, h: .1, d: .1, y: 6.9, z: -1.7, opacity: 0 }).castShadow = false;   // reserve room for the finished tree so the camera does not jump
    S.pad = 1.08; W.fit({ dir: [.25, .6, 1], pad: 1.08 });
    let z1, z2, z3;
    return [
      { text: 'Arjun works in the exam records room. Four <b>sorted</b> piles of answer sheets (5, 2, 8 and 3 sheets) must become one sorted pile, and he can merge only <b>two piles at a time</b>.',
        run: async () => { for (const t of N) { t.boxes[0].box.visible = true; await W.drop(t.boxes[0].box, 5, 380); W.setText(t.lab, String(t.w)); t.tb.visible = true; } } },
      { text: 'Merging piles of \\(x\\) and \\(y\\) sheets means handling every sheet once: cost \\(x + y\\). And a pile merged early is handled <b>again</b> in every later merge, so the big pile of 8 should wait.',
        run: async () => { W.glow(N[2].boxes[0].box, C.bad); await W.shake(N[2].boxes[0].box); await Game.wait(700); W.glow(N[2].boxes[0].box, null); } },
      { text: 'So he takes the <b>two smallest</b> piles, 2 and 3, and fuses them into a pile of 5. Cost so far: \\(2 + 3 = 5\\).',
        run: async () => { S.select([N[1], N[3]]); await Game.wait(600); const m = S.merge(N[1], N[3], [N[0], null, N[2]], 5); z1 = m.node; S.select([]); await m.done; } },
      { text: 'Again the two smallest: 5 and 5 make 10. Cost so far: \\(5 + 10 = 15\\).',
        run: async () => { S.select([N[0], z1]); await Game.wait(600); const m = S.merge(N[0], z1, [null, N[2]], 15); z2 = m.node; S.select([]); await m.done; } },
      { text: 'Last merge: 8 and 10 make 18. Total cost \\(5 + 10 + 18 = 33\\). Starting with the big 8 would have cost 47.',
        run: async () => { S.select([N[2], z2]); await Game.wait(600); const m = S.merge(N[2], z2, [null], 33); z3 = m.node; S.select([]); await m.done; } },
      { text: 'The tree behind is the record: the answer is the <b>sum of all the merge blocks</b>, \\(\\sum (x + y)\\), not the final size. With a min-heap, each of the \\(n - 1\\) merges costs \\(O(\\log n)\\): \\(O(n \\log n)\\) in all.',
        run: async () => { for (const t of [z1, z2, z3]) { W.paint(t.tb, C.hi); W.pop(t.tb); await Game.wait(450); } } },
    ];
  },
  mount(ctx) {
    const { f } = ctx.inst, H = UI.h, n = f.length, easy = ctx.diff === 1, W = ctx.world;
    let uid = 0;
    const mk = (w, kids) => ({ id: 'o' + uid++, w, kids, label: String(w), rect: !kids, rw: 24 });
    let pool = f.map(w => mk(w));
    if (easy) pool.sort((a, b) => a.w - b.w);
    let sel = [], total = 0, merges = [], phase = 'pick', pending = null, lastNew = null;

    /* ---- 3D scene ---- */
    const finalCost = (() => { const h = pool.map(x => x.w); let c = 0; while (h.length > 1) { h.sort((a, b) => a - b); const s = h.shift() + h.shift(); c += s; h.push(s); } return c; })();
    const S = this._scene(W, pool.map(x => x.w), finalCost);
    pool.forEach((x, i) => { x.sn = S.nodes[i]; x.sn.ref = x; });
    S.onPick = sn => pick(sn.ref);
    W.fit({ dir: [.25, .6, 1] });

    /* ---- workbench: the list of merges (the DOM forest is only the fallback when 3D is off) ---- */
    const poolEl = H('div', { class: 'omp-pool' }), forest = H('div', { class: 'omp-forest' }), sum = H('div', { class: 'omp-sum' }), extra = H('div');
    if (!W.real) ctx.el.append(H('div', { class: 'note' }, easy ? 'Files (kept sorted, smallest first): click two' : 'Files waiting to be merged: click two'), poolEl,
      H('div', { class: 'note' }, 'Merge forest (squares = original files, circles = merges)'), forest);
    ctx.el.append(sum, extra);
    const two = () => { const s = pool.map(x => x.w).sort((a, b) => a - b); return [s[0], s[1]]; };
    const paint = () => {
      S.select(sel.map(x => x.sn));
      sum.innerHTML = `Merges: ${merges.length ? merges.map(m => `${m.a} + ${m.b} = ${m.c}`).join(', ') : '—'}<br>Total cost so far: <b>${total}</b>`;
      if (W.real) return;
      poolEl.innerHTML = '';
      pool.forEach(x => poolEl.append(H('button', { class: 'btn omp-chip' + (sel.includes(x) ? ' sel' : '') + (x === lastNew ? ' new' : ''), onclick: () => pick(x) }, x.w)));
      forest.innerHTML = '';
      pool.forEach(root => {
        (function tag(t) { t.cls = sel.includes(t) ? 'sel' : t === lastNew ? 'hi' : ''; (t.kids || []).forEach(tag); })(root);
        root.cls = sel.includes(root) ? 'sel' : root === lastNew ? 'hi' : (phase === 'end' ? 'ok' : '');
        const tr = UI.tree({ r: 21, gap: 56, levelH: 66 });
        tr.render(root, () => pick(root));
        forest.append(tr.el);
      });
    };
    const next = () => {
      sel = []; paint();
      if (pool.length === 1) return finish();
      phase = 'pick';
      ctx.task(`Click the <b>two smallest</b> piles (${pool.length} left).`);
    };
    const pick = x => {
      if (phase !== 'pick' || !pool.includes(x)) return;
      if (sel.includes(x)) { sel = sel.filter(y => y !== x); return paint(); }
      const [a, b] = two();
      if (sel.length === 0) {
        if (x.w > b) { S.shake(x.sn); return ctx.bad(`${x.w} is not one of the two smallest. The two smallest files now are ${a} and ${b}. Merging a big file early makes it get copied again in every later merge.`); }
        sel = [x]; paint(); return ctx.task(`Now click the other pile to merge with ${x.w}.`);
      }
      const ws = [sel[0].w, x.w].sort((p, q) => p - q);
      if (ws[0] !== a || ws[1] !== b) { S.shake(x.sn); return ctx.bad(`${sel[0].w} + ${x.w} is not the cheapest merge. The two smallest are ${a} and ${b}; greedy always merges those (cost ${a + b}).`); }
      sel.push(x);
      sel.sort((p, q) => p.w - q.w);

      ctx.task(`Merging ${sel[0].w} and ${sel[1].w}. What does this merge cost (size of the new file)?`);
      extra.innerHTML = ''; extra.append(UI.ask('Merge cost =', v => {
        const c = sel[0].w + sel[1].w;
        if (!UI.same(v, c)) return ctx.bad(`Merging files of sizes \\(m\\) and \\(n\\) touches every record once: cost \\(${sel[0].w} + ${sel[1].w} = ${c}\\).`);

      const [x, y] = sel, z = mk(x.w + y.w, [x, y]);

      if (easy) { let i = 0; while (i < pool.length && pool[i].w <= z.w) i++; pool.splice(i, 0, z); }

      ctx.good(`Merge ${x.w} + ${y.w} = ${z.w}. Running total = ${total}.`);

      if (easy) return end();

      extra.innerHTML = ''; extra.append(UI.ask('Total cost =', v => {

        ctx.good('Correct total.'); end();

    };
    const end = () => {
      phase = 'end'; extra.innerHTML = ''; lastNew = null; paint(); S.finish(pool[0].sn);
      ctx.done(`Merges: ${merges.map(m => `${m.a} + ${m.b} = ${m.c}`).join(', ')}<br>Minimum total computations \\(= ${merges.map(m => m.c).join(' + ')} = ${total}\\)`);
    };
    next();
    return {
      hint: () => {
        if (phase === 'pick') { const [a, b] = two(); return `Sort the sizes in your head: the two smallest are ${a} and ${b}.`; }
        if (phase === 'cost') return `Add the two sizes: ${sel[0].w} + ${sel[1].w}.`;
        return 'Add up every merge cost (every merge block in the tree).';
      },
      async demoStep() {
        while (phase === 'anim') await Game.wait(60);

        else if (phase === 'total') extra.querySelector('.ask').submit(String(total));

  },
